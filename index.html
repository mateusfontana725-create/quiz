<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPR – Partes do equipamento</title>
<meta name="description" content="Quiz para decorar as partes do EPR (equipamento de proteção respiratória): identificar pela seta e completar o nome.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#5b6474;--bd:#dde1e8;--acc:#1f5fa8;--ok:#1b7f3b;--okbg:#e7f6ec;--bad:#b42318;--badbg:#fdecea;--arrow:#e11d48}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#171e29;--tx:#e8edf5;--mut:#9aa4b5;--bd:#2a3443;--acc:#6aa8ff;--ok:#5fd38a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1714}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#171e29;--tx:#e8edf5;--mut:#9aa4b5;--bd:#2a3443;--acc:#6aa8ff;--ok:#5fd38a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1714}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:2}
h1{font-size:17px;margin:0;line-height:1.2}
.meta{font-size:14px;color:var(--mut)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:760px;margin:0 auto;padding:16px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar>div{height:100%;background:var(--acc);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.phase{font-size:13px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.fig{background:#fff;border-radius:10px;border:1px solid var(--bd);padding:6px;display:flex;justify-content:center;cursor:zoom-in;position:relative}
.fig svg{width:100%;max-width:640px;height:auto;display:block}
.zoomhint{position:absolute;right:8px;bottom:8px;background:rgba(17,24,39,.72);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;pointer-events:none}
.ov{position:fixed;inset:0;background:#0b0f15;z-index:10;overflow:auto;-webkit-overflow-scrolling:touch}
.ov .inner{background:#fff;margin:56px auto 24px;width:max(100vw,1100px);max-width:1600px}
.ov svg{width:100%;height:auto;display:block}
.ov .close{position:fixed;top:10px;right:12px;z-index:11;background:#fff;color:#111;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.ov .ovcap{position:fixed;top:14px;left:14px;color:#fff;font-size:14px;z-index:11}
@keyframes pulse{0%{r:var(--r0);opacity:.9}100%{r:var(--r1);opacity:0}}
.fig-cap{font-size:13px;color:var(--mut);margin-top:6px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ans{display:flex;gap:8px;margin-top:14px}
.ans input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.ans input:focus{outline:2px solid var(--acc);outline-offset:1px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;border-left:4px solid var(--mut);background:var(--card);border:1px solid var(--bd)}
.fb.ok{border-left-color:var(--ok);background:var(--okbg)}
.fb.bad{border-left-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.kb{font-size:12px;color:var(--mut)}
.res h2{margin:4px 0 8px}
.res ul{padding-left:20px}
.res li{margin:4px 0}
.hide{display:none}
@media (max-width:480px){main{padding:12px}h1{font-size:16px}.q{font-size:17px}}
</style>
</head>
<body>
<header>
  <h1>EPR – Partes do equipamento</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="meta" id="count"></span>
    <button class="btn" id="restart" type="button">Recomeçar</button>
  </div>
</header>
<main>
  <div class="bar"><div id="prog"></div></div>
  <div class="meta" id="stats" style="margin-bottom:10px"></div>
  <section class="card" id="stage"></section>
</main>

const P = [{"fig": "f1", "n": 1, "name": "Conjunto redutor de pressão ou válvula de primeiro estágio", "al": ["redutor de pressão", "válvula de primeiro estágio", "conjunto redutor", "primeiro estágio"], "s": [362, 312], "t": [327, 291], "cl": 1}, {"fig": "f1", "n": 2, "name": "Alarme de baixa pressão tipo apito", "al": ["alarme de baixa pressão", "apito"], "s": [402, 298], "t": [340, 273], "cl": 1}, {"fig": "f1", "n": 3, "name": "Suporte dorsal ou backplate", "al": ["suporte dorsal", "backplate"], "s": [232, 309], "t": [263, 291], "cl": 1}, {"fig": "f1", "n": 4, "name": "Tirantes abdominais ou tirantes de cintura", "al": ["tirantes abdominais", "tirantes de cintura"], "s": [502, 267], "t": [468, 247]}, {"fig": "f1", "n": 5, "name": "Retentor do regulador de respiração", "al": ["retentor do regulador", "retentor"], "s": [146, 272], "t": [130, 252]}, {"fig": "f1", "n": 6, "name": "Engate carona ou saída carona", "al": ["engate carona", "saída carona", "saida carona"], "s": [154, 194], "t": [157, 212]}, {"fig": "f1", "n": 7, "name": "Tirantes de ombro", "al": ["tirantes de ombro", "tirante de ombro"], "s": [407, 66], "t": [384, 85]}, {"fig": "f1", "n": 8, "name": "Manômetro luminescente", "al": ["manômetro luminescente", "manometro luminescente", "luminescente"], "s": [497, 180], "t": [482, 170]}, {"fig": "f1", "n": 9, "name": "Regulador de respiração ou válvula de demanda", "al": ["regulador de respiração", "válvula de demanda", "valvula de demanda"], "s": [67, 207], "t": [93, 206]}, {"fig": "f1", "n": 10, "name": "Mangueiras ou dutos do sistema pneumático", "al": ["mangueiras", "mangueira", "dutos do sistema pneumático"], "s": [229, 165], "t": [257, 197]}, {"fig": "f1", "n": 11, "name": "Cilindro", "al": ["cilindro"], "s": [309, 43], "t": [300, 72]}, {"fig": "f1", "n": 12, "name": "Manômetro do cilindro", "al": ["manômetro do cilindro", "manometro do cilindro"], "s": [279, 346], "t": [296, 281], "cl": 1}, {"fig": "f1", "n": 13, "name": "Batente do cilindro", "al": ["batente do cilindro", "batente"], "s": [313, 341], "t": [302, 299], "cl": 1}, {"fig": "f1", "n": 14, "name": "Conexão – rosca macho", "al": ["rosca macho", "conexão rosca macho"], "s": [233, 336], "t": [284, 297], "cl": 1}, {"fig": "f1", "n": 15, "name": "Anel de vedação ou o-ring", "al": ["anel de vedação", "anel de vedacao", "vedação", "o-ring"], "s": [349, 345], "t": [317, 287], "cl": 1}, {"fig": "f1", "n": 16, "name": "Peça facial ou máscara facial", "al": ["peça facial", "peca facial", "máscara facial", "mascara facial"], "s": [80, 32], "t": [62, 75]}, {"fig": "f1", "n": 17, "name": "Correia de retenção do cilindro", "al": ["correia de retenção", "correia de retencao", "correia"], "s": [246, 43], "t": [285, 87]}, {"fig": "f2", "n": 1, "name": "Visor panorâmico", "al": ["visor", "visor panorâmico", "visor panoramico"], "s": [149, 51], "t": [87, 51]}, {"fig": "f2", "n": 2, "name": "Orifício de conexão do regulador de respiração", "al": ["orifício de conexão", "orificio de conexao", "conexão do regulador", "orifício"], "s": [19, 139], "t": [45, 107]}, {"fig": "f2", "n": 3, "name": "Tirantes de cabeça", "al": ["tirantes de cabeça", "tirante de cabeça", "tirantes de cabeca"], "s": [144, 20], "t": [124, 30]}, {"fig": "f2", "n": 4, "name": "Borracha seladora", "al": ["borracha seladora", "borracha"], "s": [146, 82], "t": [102, 81]}, {"fig": "f2", "n": 6, "name": "Mascarilha", "al": ["mascarilha"], "s": [41, 34], "t": [68, 65]}, {"fig": "f3", "n": 1, "name": "Botão do sistema by pass ou botão de economia de ar", "al": ["botão by pass", "by pass", "economia de ar"], "s": [22, 99], "t": [58, 99]}, {"fig": "f3", "n": 2, "name": "Engate rápido do tipo baioneta", "al": ["engate rápido", "baioneta"], "s": [56, 20], "t": [72, 38]}, {"fig": "f3", "n": 3, "name": "Sistema de rotação 360 graus", "al": ["rotação 360 graus", "rotação 360", "rotacao 360"], "s": [181, 61], "t": [142, 62]}];
const FIG = {
  f1:{src:'data:image/jpeg;base64,'+IMG.f1, w:598, h:368, title:'Equipamento completo'},
  f2:{src:'data:image/jpeg;base64,'+IMG.f2, w:170, h:156, title:'Peça facial (Figura 44)'},
  f3:{src:'data:image/jpeg;base64,'+IMG.f3, w:202, h:126, title:'Regulador de respiração (Figura 43)'}
};
const CLUSTER_VIEW = [226, 226, 176, 124];
const STOP = new Set(['de','do','da','dos','das','ou','em','com','tipo','para','uma','nos','nas','por']);
function tokens(s){
  return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .split(/[^a-z0-9]+/).filter(t=>t.length>=3 && !STOP.has(t));
}
function accepts(input, p){
  const inT = new Set(tokens(input));
  if(!inT.size) return false;
  return p.al.some(a=>{const at=tokens(a); return at.length && at.every(t=>inT.has(t));});
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const R = rng(20261110);
const order1 = shuffle(P.map((_,i)=>i), R);
const order2 = shuffle(P.map((_,i)=>i), R);
// perguntas de identificação (4 alternativas, letra correta balanceada em blocos de 4)
const Q = [];
order1.forEach((pi,k)=>{
  const p = P[pi];
  const same = P.map((x,i)=>i).filter(i=>i!==pi && P[i].fig===p.fig);
  const other = P.map((x,i)=>i).filter(i=>i!==pi && P[i].fig!==p.fig);
  const pool = shuffle(same,R).concat(shuffle(other,R));
  const dis = pool.slice(0,3).map(i=>P[i].name);
  const blockPerm = shuffle([0,1,2,3], rng(k - (k%4) + 99));
  const pos = blockPerm[k%4];
  const opts = dis.slice();
  opts.splice(pos,0,p.name);
  Q.push({kind:'id', pi, opts, c:pos});
});
order2.forEach(pi=>Q.push({kind:'type', pi}));

let cur = 0, score = {id:0, type:0}, wrong = [], answered = false;
const stage = document.getElementById('stage');

function viewOf(p, full){
  const fig = FIG[p.fig];
  if(full || p.fig!=='f1') return [0,0,fig.w,fig.h];
  if(p.cl) return CLUSTER_VIEW.slice();
  // recorte ao redor da seta (mais zoom no celular), proporção ~ 4:3
  const xs=[p.s[0],p.t[0]], ys=[p.s[1],p.t[1]];
  let w=Math.max(300, Math.max(...xs)-Math.min(...xs)+150), h=w*0.7;
  let cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
  let x=Math.min(Math.max(0,cx-w/2), fig.w-w), y=Math.min(Math.max(0,cy-h/2), fig.h-h);
  return [x,y,w,h];
}
function figSVG(p, full){
  const fig = FIG[p.fig];
  const [vx,vy,vw,vh] = viewOf(p, full);
  const sw = full ? vw/170 : vw/95, hl = sw*3.6, hw = sw*1.9;
  let [sx,sy] = p.s; const [tx,ty] = p.t;
  let ux=tx-sx, uy=ty-sy, L=Math.hypot(ux,uy)||1; ux/=L; uy/=L;
  const Lmin = vw*0.17;
  if(L<Lmin){ sx=tx-ux*Lmin; sy=ty-uy*Lmin; }
  const m=sw*1.5; sx=Math.min(vx+vw-m,Math.max(vx+m,sx)); sy=Math.min(vy+vh-m,Math.max(vy+m,sy));
  const nx=-uy, ny=ux, bx=tx-ux*hl, by=ty-uy*hl;
  const pts=`${tx},${ty} ${bx+nx*hw},${by+ny*hw} ${bx-nx*hw},${by-ny*hw}`;
  return `<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Figura com seta apontando para a peça">
    <image href="${fig.src}" x="0" y="0" width="${fig.w}" height="${fig.h}" preserveAspectRatio="none"/>
    <circle cx="${tx}" cy="${ty}" r="${sw*1.2}" fill="none" stroke="#e11d48" stroke-width="${sw*0.6}" style="--r0:${sw*1.2}px;--r1:${sw*5}px;animation:pulse 1.6s ease-out infinite"/>
    <line x1="${sx}" y1="${sy}" x2="${bx}" y2="${by}" stroke="#fff" stroke-width="${sw*2.2}" stroke-linecap="round"/>
    <polygon points="${pts}" fill="#fff" stroke="#fff" stroke-width="${sw*1.2}" stroke-linejoin="round"/>
    <line x1="${sx}" y1="${sy}" x2="${bx}" y2="${by}" stroke="#e11d48" stroke-width="${sw}" stroke-linecap="round"/>
    <polygon points="${pts}" fill="#e11d48"/>
    <circle cx="${sx}" cy="${sy}" r="${sw*0.9}" fill="#e11d48" stroke="#fff" stroke-width="${sw*0.4}"/>
  </svg>`;
}
function figHTML(p){
  const cap = p.fig==='f1' ? (p.cl ? 'Detalhe da válvula do cilindro' : 'Detalhe do equipamento completo') : FIG[p.fig].title;
  return `<div class="fig" id="figbox" title="Toque para ampliar">${figSVG(p,false)}<span class="zoomhint">🔍 ampliar</span></div>
    <div class="fig-cap">${cap}. Toque na imagem para ver a figura inteira ampliada.</div>`;
}
function openZoom(p){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<span class="ovcap">Arraste para mover · pinça para zoom</span><button class="close" type="button">Fechar ✕</button><div class="inner">${figSVG(p,true)}</div>`;
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc_);};
  const esc_=e=>{if(e.key==='Escape')close();};
  ov.querySelector('.close').addEventListener('click',close);
  document.addEventListener('keydown',esc_);
  document.body.appendChild(ov);
  // centraliza na ponta da seta
  const fig=FIG[p.fig], inner=ov.querySelector('.inner');
  requestAnimationFrame(()=>{const k=inner.clientWidth/fig.w; ov.scrollLeft=Math.max(0,p.t[0]*k-ov.clientWidth/2); ov.scrollTop=Math.max(0,p.t[1]*k+56-ov.clientHeight/2);});
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function updateTop(){
  const total = Q.length;
  document.getElementById('count').textContent = `Questão ${Math.min(cur+1,total)} de ${total}`;
  document.getElementById('prog').style.width = (cur/total*100)+'%';
  const tot = s=>s; 
  document.getElementById('stats').textContent =
    `Parte 1 (identificar): ${score.id}/${order1.length}   ·   Parte 2 (completar): ${score.type}/${order2.length}`;
}
function render(){
  updateTop();
  if(cur>=Q.length) return renderResult();
  const q = Q[cur]; const p = P[q.pi]; answered=false;
  if(q.kind==='id'){
    stage.innerHTML = `
      <div class="phase">Parte 1 · Identifique a peça indicada pela seta</div>
      <div class="q">Qual é a peça apontada pela seta?</div>
      ${figHTML(p)}
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" type="button"><b>${'ABCD'[i]})</b> ${esc(o)}</button>`).join('')}</div>
      <div id="fbbox"></div>
      <div class="nav"><span class="kb">Atalhos: A–D ou 1–4 · Enter avança</span><button class="btn primary hide" id="next" type="button">Próxima →</button></div>`;
    stage.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>chooseId(+b.dataset.i)));
  } else {
    stage.innerHTML = `
      <div class="phase">Parte 2 · Escreva o nome da peça indicada pela seta</div>
      <div class="q">Complete: qual é o nome da peça apontada?</div>
      ${figHTML(p)}
      <form class="ans" id="ansform" autocomplete="off"><input id="ans" type="text" placeholder="Digite o nome da peça" aria-label="Nome da peça"><button class="btn primary" type="submit" id="check">Verificar</button></form>
      <div id="fbbox"></div>
      <div class="nav"><span class="kb">Enter confirma · Depois, Enter ou “Próxima”</span><button class="btn primary hide" id="next" type="button">Próxima →</button></div>`;
    document.getElementById('ansform').addEventListener('submit',e=>{e.preventDefault(); if(!answered) checkType(); else next();});
    setTimeout(()=>document.getElementById('ans').focus(),30);
  }
  document.getElementById('next').addEventListener('click',next);
  const fb_=document.getElementById('figbox'); if(fb_) fb_.addEventListener('click',()=>openZoom(p));
}
function fb(ok, p, note){
  const box = document.getElementById('fbbox');
  box.innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Acertou!':'Errou.'}</b>
    Nome da peça: <strong>${esc(p.name)}</strong><br>
    <span class="small">${esc(note)}</span></div>`;
  document.getElementById('next').classList.remove('hide');
  answered = true;
}
function chooseId(i){
  if(answered) return;
  const q = Q[cur]; const p = P[q.pi];
  const btns = stage.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[q.c].classList.add('right');
  const ok = i===q.c;
  if(!ok){ btns[i].classList.add('wrong'); wrong.push({k:'id',p}); } else score.id++;
  fb(ok, p, `Esta é a peça ${p.n} do quadro “${FIG[p.fig].title}”.`);
}
function checkType(){
  const q = Q[cur]; const p = P[q.pi];
  const v = document.getElementById('ans').value;
  if(!v.trim()) return;
  const ok = accepts(v,p);
  if(ok) score.type++; else wrong.push({k:'type',p,given:v});
  document.getElementById('ans').disabled = true;
  document.getElementById('check').disabled = true;
  fb(ok,p, ok ? `Sua resposta: “${v}”.` : `Sua resposta: “${v}”. Esta é a peça ${p.n} do quadro “${FIG[p.fig].title}”.`);
}
function next(){ cur++; render(); }
function renderResult(){
  const total = order1.length + order2.length;
  const hits = score.id + score.type;
  document.getElementById('prog').style.width='100%';
  stage.innerHTML = `<div class="res"><h2>Fim do quiz</h2>
    <p>Acertos: <strong>${hits}</strong> de ${total}.</p>
    <p>Parte 1 (identificar): ${score.id}/${order1.length} · Parte 2 (completar): ${score.type}/${order2.length}</p>
    ${wrong.length?`<p><b>Peças que você errou:</b></p><ul>${wrong.map(w=>`<li>${esc(w.p.name)}${w.k==='type'?` <span class="small">(você escreveu: “${esc(w.given)}”)</span>`:''}</li>`).join('')}</ul>`:'<p>Nenhum erro. Ótimo!</p>'}
    <div class="nav"><button class="btn primary" id="again" type="button">Refazer</button></div></div>`;
  document.getElementById('again').addEventListener('click',restart);
}
function restart(){cur=0;score={id:0,type:0};wrong=[];render();}
document.getElementById('restart').addEventListener('click',restart);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT' || document.querySelector('.ov')) return;
  const q = Q[cur];
  if(!q || q.kind!=='id') { if(e.key==='Enter' && answered) next(); return; }
  const map={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
  const k=e.key.toLowerCase();
  if(k in map && !answered) chooseId(map[k]);
  else if(e.key==='Enter' && answered) next();
});
render();
</script>
