q": "Na área de controle da cena, o que fica na zona quente?", "alts": ["O espaço confinado, com entrantes e pessoal essencial", "Posto de comando, comando unificado e imprensa", "Equipe de apoio e equipe de saúde (EMS)", "Estacionamento de viaturas e apoio logístico"], "c": 0, "why": [null, "Isso fica na zona fria.", "Fica fora da zona quente.", "É área de apoio, longe do risco."], "e": "O controle da cena usa faixas e barricadas e zonas de operações: quente (perto do espaço, com entrantes e pessoal essencial), morna (corredor de acesso, descontaminação e apoio ao material) e fria (posto de comando, apoio e imprensa).", "d": "Quente = onde está o perigo.", "n": 2}, {"id": "k11", "sub": "ctrl", "t": "mc", "q": "Um espaço cilíndrico tem 4 m de diâmetro e 5 m de altura. Qual é o volume pela fórmula 0,785 × d² × h?", "alts": ["Cerca de 15,7 m³", "Cerca de 50,2 m³", "Cerca de 62,8 m³", "Cerca de 125,6 m³"], "c": 2, "why": ["Resultado de usar d no lugar de d²: 0,785 × 4 × 5.", "Resultado de elevar o diâmetro ao cubo, e não ao quadrado.", null, "Resultado de dobrar a altura no cálculo."], "e": "Volume do cilindro = 0,785 × d² × h = 0,785 × 16 × 5 = 62,8 m³. Conhecer o volume permite estimar o tempo de purga com o insuflador.", "d": "Cilindro: 0,785 × d² × h.", "n": 3}, {"id": "n01", "sub": "norm", "t": "mc", "q": "Qual destas normas sobre espaço confinado tem validade de lei no Brasil?", "alts": ["NBR 16577", "NR-33", "NBR 14606", "NFPA 1670"], "c": 1, "why": ["É norma técnica da ABNT e, por si só, não tem força de lei.", null, "Trata da entrada em tanques de líquidos inflamáveis e combustíveis, e é norma técnica.", "É norma técnica americana de resgate técnico."], "e": "A Aula 02 diz que a NR-33 (Trabalho em Espaço Confinado) é a norma que possui validade de lei. As NBR 14606 e NBR 16577 e as normas NFPA são referências técnicas.", "d": "NR-33 = lei.", "n": 1}, {"id": "n02", "sub": "norm", "t": "mc", "q": "Qual afirmação sobre a PET (Permissão de Entrada e Trabalho) está correta?", "alts": ["É preenchida, assinada e datada em duas vias antes do ingresso, e vale para cada entrada", "Vale para toda a jornada, para qualquer número de entradas no espaço", "Pode ser emitida logo depois do início dos trabalhos, se houver urgência na tarefa em andamento", "Dispensa assinatura quando o supervisor de entrada está no local"], "c": 0, "why": [null, "A PET é válida para cada entrada.", "Deve ser emitida antes do início das atividades.", "Deve ser preenchida, assinada e datada."], "e": "A PET deve ficar visível no local, ser preenchida em duas vias antes do ingresso, numerada e arquivada por cinco anos, encerrada ao final e é válida para cada entrada. O monitoramento atmosférico deve ser mantido constantemente.", "d": "Uma PET por entrada.", "n": 2}, {"id": "n03", "sub": "norm", "t": "mc", "q": "Qual destas NÃO é atribuição do vigia?", "alts": ["Entrar no espaço confinado para ajudar o trabalhador, sem apoio", "Controlar o número de trabalhadores autorizados dentro do espaço", "Ordenar o abandono ao reconhecer sinal de alarme ou sintoma", "Acionar a equipe de emergência e salvamento, quando necessário"], "c": 0, "why": [null, "É atribuição do vigia.", "É atribuição do vigia.", "É atribuição do vigia."], "e": "O vigia permanece fora do espaço, junto à entrada, em contato permanente com os autorizados. Controla quem entra e sai, ordena o abandono diante de sinais de perigo e aciona o resgate. Não deve fazer outras tarefas nem entrar sozinho.", "d": "Vigia fica fora e chama ajuda.", "n": 2}, {"id": "x02", "sub": "gerais", "t": "mc", "q": "Segundo o curso, qual é a orientação sobre a proteção auditiva no espaço confinado?", "alts": ["Uso apenas durante o resgate, sendo dispensada no trabalho normal", "Dispensada se o capacete já tiver protetor de ouvido embutido", "Dispensada em espaços com ventilação mecânica, pois ela abafa o ruído", "Uso obrigatório para o trabalho, podendo ser necessário também para o resgate"], "c": 3, "why": ["O curso diz que é obrigatória para o trabalho, e não só no resgate.", "O curso não admite essa dispensa.", "A ventilação não substitui a proteção auditiva indicada no curso.", null], "e": "A Aula 03 trata a proteção auditiva como uso obrigatório para o trabalho e possivelmente necessária para o resgate. O ruído é um risco físico do espaço confinado, e a proteção deve ser usada sempre que indicada.", "d": "Ruído: sempre protegido.", "n": 1}, {"id": "n05", "sub": "norm", "t": "mc", "q": "Qual é atribuição do supervisor de entrada?", "alts": ["Emitir a PET antes do início das atividades e encerrá-la ao término dos serviços", "Permanecer dentro do espaço para acompanhar os entrantes", "Dispensar os testes dos equipamentos quando a PET já foi assinada e está visível no local", "Substituir sempre o vigia, mesmo sem previsão na PET"], "c": 0, "why": [null, "Ele não precisa estar dentro. Deve assegurar que o vigia esteja operante.", "Deve executar os testes e conferir os equipamentos antes da utilização.", "Só desempenha a função de vigia quando previsto na PET."], "e": "O supervisor emite e encerra a PET, executa os testes e confere equipamentos, implementa os procedimentos, assegura serviços de emergência e salvamento, cancela os procedimentos quando necessário e garante que o vigia esteja operante.", "d": "Supervisor abre e fecha a PET.", "n": 2}, {"id": "n06", "sub": "norm", "t": "mc", "q": "Qual exigência recai sobre a equipe de emergência e salvamento?", "alts": ["Realizar simulados apenas depois que ocorrer algum acidente no espaço", "Participar de simulado anual de salvamento com os cenários possíveis de acidente no espaço", "Dispensar proficiência e equipamentos próprios, usando apenas os equipamentos dos entrantes autorizados", "Ser acionada somente depois de o vigia entrar no espaço confinado"], "c": 1, "why": ["O simulado é anual e preventivo.", null, "A equipe precisa de proficiência e equipamentos.", "O vigia não entra. Ele aciona a equipe quando necessário."], "e": "A equipe deve ter proficiência e equipamentos, conhecer os riscos e responder rápido, assegurar medidas de salvamento e primeiros socorros e participar de simulado anual. Os entrantes também devem estar preparados para um resgate sem entrada.", "d": "Equipe de resgate treina todo ano.", "n": 2}, {"id": "p01", "sub": "epi", "t": "mc", "q": "Em qual condição se pode usar um EPR purificador de ar?", "alts": ["Quando há ao menos 19,5% de oxigênio e o contaminante pode ser filtrado", "Em atmosferas IPVS, com filtro combinado de alta capacidade", "Em atmosferas deficientes de oxigênio, usando filtro químico", "Em ambientes com contaminantes não identificados, usando filtro combinado universal"], "c": 0, "why": [null, "Em atmosfera IPVS é preciso EPR de adução de ar.", "O filtro não produz oxigênio.", "Sem saber o contaminante, não se escolhe o filtro certo."], "e": "O purificador de ar filtra o ar ambiente (filtros mecânicos, químicos ou combinados) e exige no mínimo 19,5% de oxigênio. Onde ele não pode ser usado — falta de O₂, IPVS e ambientes não identificados — entram os EPR de adução de ar.", "d": "Purificador filtra, não cria oxigênio.", "n": 2}, {"id": "x03", "sub": "gerais", "t": "mc", "q": "Por que lanternas e equipamentos de comunicação usados em espaços confinados devem ser intrinsecamente seguros?", "alts": ["Para durar mais tempo, pois aparelhos comuns descarregam em poucos minutos", "Para não gerar faísca capaz de inflamar uma atmosfera explosiva", "Para funcionar mesmo com atmosfera deficiente em oxigênio no interior", "Para evitar a falha das baterias quando houver contato com a água"], "c": 1, "why": ["Autonomia não é o motivo do requisito.", null, "Essa característica não é a da segurança intrínseca.", "Não é o critério indicado no curso."], "e": "O curso indica lanternas de cabeça ou de bolso e comunicação intrinsecamente seguras. Em atmosferas com gases ou poeira combustível, uma faísca comum pode causar explosão, por isso esses equipamentos são projetados para não ter energia suficiente para isso. A comunicação sem fio também pode ser prejudicada no interior.", "d": "Intrinsecamente seguro = sem faísca.", "n": 2}, {"id": "p03", "sub": "epi", "t": "mc", "q": "Qual é a atitude recomendada diante de um episódio de claustrofobia durante a operação?", "alts": ["Só permite entradas curtas, de 30 a 40 minutos de duração", "Só pode ser usado em ambientes com pelo menos 19,5% de oxigênio", "A fonte de ar deve ser a mesma do entrante e do resgatista", "A mangueira pode se enroscar ou danificar e não pode exceder 100 m"], "c": 3, "why": ["Disfarçar alivia por pouco tempo, e o episódio pode voltar.", "Entrantes que entram em pânico removem respiradores e viram vítimas.", "Evitar só reforça a fobia. É preciso enfrentar o medo, de forma gradual.", null], "e": "Claustrofobia é o medo patológico de espaços confinados. Para lidar: antecipar o episódio, controlar a respiração, concentrar-se na missão, comunicar-se, confiar no treinamento e no equipamento e não perder o controle.", "d": "Respira, foca na missão, fala com a equipe.", "n": 2}, {"id": "p04", "sub": "epi", "t": "mc", "q": "Qual ancoragem tem fator de queda baixo (0 a 0,5) e é a mais recomendada?", "alts": ["Ancoragem na altura dos pés, com fator de queda 2", "Ancoragem acima da cabeça do trabalhador", "Ancoragem na altura do ombro, que sempre garante fator de queda 0", "Ancoragem abaixo dos pés, com talabarte esticado"], "c": 1, "why": ["Essa configuração é só para casos críticos.", null, "O fator 0 a 0,5 depende da ancoragem acima da cabeça.", "É a pior situação, com altura de queda maior."], "e": "O fator de queda é a altura da queda dividida pelo comprimento do talabarte. Com ancoragem acima da cabeça, é menor que 1 (0 a 0,5) e é o recomendado. Fator 1 é recomendado com atenção, e fator 2 (ancoragem na altura dos pés) só em casos críticos. O impacto não pode passar de 6 kN, e o absorvedor de energia é obrigatório na retenção de queda.", "d": "Ancore acima da cabeça.", "n": 2}, {"id": "p05", "sub": "epi", "t": "mc", "q": "O que compõe o cálculo da zona livre de queda (ZLQ), segundo a NR-35?", "alts": ["Apenas o comprimento do talabarte e a altura total do trabalhador", "Somente o comprimento do absorvedor de energia aberto, sem margem de segurança abaixo dos pés do trabalhador", "Comprimento do talabarte, absorvedor aberto, distância pé–argola do cinto e 1 m de segurança", "Comprimento do talabarte e a distância até o ponto de ancoragem"], "c": 2, "why": ["Faltam o absorvedor aberto, a distância do cinto e a altura de segurança.", "É preciso somar a altura de segurança de 1 m.", null, "Não é a composição apresentada."], "e": "A ZLQ é o espaço vertical mínimo abaixo do trabalhador para que ele não colida com o chão ou obstáculos. Soma o comprimento do talabarte, o absorvedor de energia aberto, a distância entre o pé e o ponto de ancoragem no cinto e uma altura de segurança de 1 m, considerando eventuais deformações de linhas de vida e pontos de ancoragem.", "d": "ZLQ = talabarte + absorvedor + pé-cinto + 1 m.", "n": 3}]};

    else cls = "dim";
  }
  return `<button type="button" class="opt ${cls} ${a ? "done" : ""}" data-act="ans" data-v="${i}" ${a ? 'aria-disabled="true"' : ""}><span class="let">${LET[i]}</span><span>${esc(q.alts[i])}</span>${st ? `<span class="st">${st}</span>` : ""}</button>`;
}
function optVF(q, v, a){
  let cls = "", st = "";
  if (a){
    if (v === q.v){ cls = "ok"; st = "✓"; }
    else if (v === a.p){ cls = "bad"; st = "✗"; }
    else cls = "dim";
  }
  return `<button type="button" class="opt ${cls} ${a ? "done" : ""}" data-act="ans" data-v="${v}" ${a ? 'aria-disabled="true"' : ""}><span>${v ? "Verdadeiro" : "Falso"}</span>${st ? `<span class="st">${st}</span>` : ""}</button>`;
}
function feedback(q, a){
  const head = a.ok ? "✓ Acertou!" : "✗ Errou.";
  const correto = q.t === "mc" ? `${LET[q.c]}) ${esc(q.alts[q.c])}` : (q.v ? "Verdadeiro" : "Falso");
  let h = `<section class="fb ${a.ok ? "ok" : "bad"}"><div class="verdict">${head}</div>
    <p><strong>Resposta correta:</strong> ${correto}</p>
    <h3>Explicação</h3><p>${esc(q.e)}</p>`;
  if (q.t === "mc"){
    h += `<h3>Por que as outras estão erradas</h3><ul>` + q.alts.map((t, i) => i === q.c ? "" :
      `<li class="${i === a.p ? "mine" : ""}"><strong>${LET[i]})</strong> ${esc(t)}<br><span class="muted">${esc(q.why[i])}${i === a.p ? " (foi a sua escolha)" : ""}</span></li>`).join("") + `</ul>`;
  }
  if (q.d) h += `<div class="dica">Para memorizar: ${esc(q.d)}</div>`;
  return h + `</section>`;
}
function quizView(){
  const q = cur(), a = S.ans[q.id], n = S.order.length, isLast = S.idx === n - 1;
  const cells = S.order.map((id, i) => { const x = S.ans[id]; return `<button type="button" class="cell ${x ? (x.ok ? "ok" : "bad") : ""} ${i === S.idx ? "cur" : ""} ${BY[id].new ? "nova" : ""}" data-act="go" data-i="${i}" aria-label="Questão ${i + 1}">${i + 1}</button>`; }).join("");
  return `
  <div class="stats">
    ${S.review ? '<span class="chip rev">Revisão de erros</span>' : ""}
    <span class="chip">Questão <b>${S.idx + 1}</b> de ${n}</span>
    <span class="chip">Acertos <b>${rights()}</b> de ${answered()}</span>
    <span class="chip">Sequência <b>${S.streak}</b></span>
  </div>
  <div class="bar"><i style="width:${Math.round(answered() / n * 100)}%"></i></div>
  <details class="map"><summary>Mapa de questões</summary><div class="grid">${cells}</div></details>
  <article class="card">
    <p class="tags">${q.new ? '<span class="tag new">NOVA</span>' : ""}<span class="tag">${esc(SUB[q.sub])}</span><span class="tag t">${q.t === "mc" ? "Múltipla escolha" : "Verdadeiro ou falso"}</span>${q.n ? `<span class="tag lv">${q.n === 3 ? "Difícil" : q.n === 2 ? "Médio" : "Fácil"}</span>` : ""}</p>
    <h2 class="q">${esc(q.q)}</h2>
    ${q.t === "mc" ? [0,1,2,3].map(i => optMC(q, i, a)).join("") : `<div class="vf">${optVF(q, true, a)}${optVF(q, false, a)}</div>`}
    ${a ? feedback(q, a) : ""}
    <div class="nav">
      <button type="button" class="btn" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← Anterior</button>
      <button type="button" class="btn ${a ? "pri" : ""}" data-act="next">${isLast ? "Ver resultado" : (a ? "Próxima →" : "Pular →")}</button>
    </div>
  </article>`;
}
function resultView(){
  const n = S.order.length, ans = answered(), ok = rights(), p = ans ? Math.round(ok / n * 100) : 0;
  const msg = p >= 90 ? "Excelente! Você domina o conteúdo." : p >= 70 ? "Bom desempenho. Revise os erros abaixo." : p >= 50 ? "Está no caminho. Releia as explicações dos erros." : "Releia o resumo e tente de novo.";
  const bySub = DATA.subs.map(s => {
    const ids = S.order.filter(id => BY[id].sub === s.id); if (!ids.length) return "";
    const r = ids.filter(id => S.ans[id] && S.ans[id].ok).length;
    return `<div class="row"><span>${esc(s.n)}</span><span>${r}/${ids.length}</span><div class="track"><i style="width:${Math.round(r / ids.length * 100)}%"></i></div></div>`;
  }).join("");
  const wrong = S.order.filter(id => S.ans[id] && !S.ans[id].ok);
  const list = wrong.map(id => { const q = BY[id];
    const c = q.t === "mc" ? `${LET[q.c]}) ${q.alts[q.c]}` : (q.v ? "Verdadeiro" : "Falso");
    return `<details class="err"><summary>${esc(q.q)}</summary><p class="ans">Resposta correta: ${esc(c)}</p><p>${esc(q.e)}</p>${q.d ? `<div class="dica">Para memorizar: ${esc(q.d)}</div>` : ""}</details>`; }).join("");
  return `
  <article class="card">
    <div class="score"><div class="big">${p}%</div><p><strong>${ok} de ${n}</strong> acertos${S.review ? " (revisão de erros)" : ""}</p><p class="muted">${msg}</p>
    ${ans < n ? `<p class="muted">${n - ans} questão(ões) sem resposta.</p>` : ""}
    ${S.best ? `<p class="muted">Maior sequência de acertos: ${S.best}</p>` : ""}</div>
    <h2 class="sec">Por assunto</h2>${bySub}
    ${wrong.length ? `<h2 class="sec">Questões que você errou (${wrong.length})</h2>${list}` : ""}
    <div class="act">
      ${wrong.length ? `<button type="button" class="btn pri" data-act="review">Refazer só os erros</button>` : ""}
      ${ans < n ? `<button type="button" class="btn" data-act="back">Voltar às questões</button>` : ""}
      <button type="button" class="btn" data-act="again">Recomeçar tudo</button>
    </div>
  </article>`;
}
function render(){
  $("#app").innerHTML = view === "result" ? resultView() : quizView();
  const r = $("#restart"); r.textContent = askRestart ? "Confirmar?" : "Recomeçar";
}
function scrollTop(){ $("#top").scrollIntoView({ behavior:"smooth", block:"start" }); }
function answer(v){
  const q = cur(); if (view !== "quiz" || S.ans[q.id]) return;
  const ok = q.t === "mc" ? v === q.c : v === q.v;
  S.ans[q.id] = { p: v, ok };
  S.streak = ok ? S.streak + 1 : 0; S.best = Math.max(S.best, S.streak);
  save(); render();
  const f = document.querySelector(".fb"); if (f) f.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function go(i){ S.idx = Math.max(0, Math.min(S.order.length - 1, i)); view = "quiz"; save(); render(); scrollTop(); }
function next(){ if (S.idx === S.order.length - 1) { view = "result"; render(); scrollTop(); } else go(S.idx + 1); }
function prev(){ if (S.idx > 0) go(S.idx - 1); }
function restartAll(){ S = fresh(); view = "quiz"; askRestart = false; save(); render(); scrollTop(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (e.target.id === "restart"){
    if (askRestart){ clearTimeout(askTimer); restartAll(); }
    else { askRestart = true; render(); askTimer = setTimeout(() => { askRestart = false; render(); }, 3000); }
    return;
  }
  if (!el) return;
  const act = el.dataset.act;
  if (act === "ans") answer(el.dataset.v === "true" ? true : el.dataset.v === "false" ? false : +el.dataset.v);
  else if (act === "next") next();
  else if (act === "prev") prev();
  else if (act === "go") go(+el.dataset.i);
  else if (act === "again") restartAll();
  else if (act === "back"){ const i = S.order.findIndex(id => !S.ans[id]); view = "quiz"; S.idx = i < 0 ? 0 : i; save(); render(); scrollTop(); }
  else if (act === "review"){ const ids = S.order.filter(id => S.ans[id] && !S.ans[id].ok); S = fresh(ids); view = "quiz"; save(); render(); scrollTop(); }
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (view === "quiz"){
    const q = cur(), a = S.ans[q.id];
    if (!a){
      if (q.t === "mc"){ const i = "abcd".indexOf(k); const j = ["1","2","3","4"].indexOf(k); const x = i >= 0 ? i : j; if (x >= 0){ answer(x); return; } }
      else { if (k === "v") { answer(true); return; } if (k === "f") { answer(false); return; } }
    }
    if (k === "arrowright" || (k === "enter" && a)) { if (document.activeElement && document.activeElement.tagName === "BUTTON" && k === "enter") return; e.preventDefault(); next(); }
    else if (k === "arrowleft") { e.preventDefault(); prev(); }
  }
});
render();
})();
</script>
</body>
</html>
