<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado – Saúde e Segurança Aplicada ao Trabalho</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#1c2333; --muted:#667085; --line:#e3e7ef;
  --brand:#2f5bea; --brand-soft:#e8eefe;
  --ok:#12a150; --ok-soft:#e5f7ed; --err:#d92d3a; --err-soft:#fdecee;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1420; --card:#171e2e; --text:#e8ecf5; --muted:#9aa5bd; --line:#27304a;
    --brand:#6b8cff; --brand-soft:#1d2a52;
    --ok:#3ccf7b; --ok-soft:#12301f; --err:#ff6b76; --err-soft:#3a1a1f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5; min-height:100vh;
}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.2px}
header.top small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.ok .dot{background:var(--ok)} .chip.err .dot{background:var(--err)} .chip.all .dot{background:var(--brand)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--brand),#7aa2ff);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qnum{font-weight:800;font-size:1.1rem}
.tag{font-size:.75rem;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 10px;border-radius:999px}
.qtext{font-size:1.05rem;font-weight:600;margin:6px 0 10px;white-space:pre-line}
.afirm{border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:8px;margin:0 0 12px;font-size:.98rem}
.opts{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .05s}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt:active:not(:disabled){transform:scale(.995)}
.opt:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.opt .let{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:.85rem;background:var(--line);color:var(--text)}
.opt .txt{flex:1;padding-top:2px}
.opt .badge{display:none;font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;align-self:center;white-space:nowrap}
.opt.selected{border-color:var(--brand);background:var(--brand-soft)}
.opt.selected .let{background:var(--brand);color:#fff}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .let{background:var(--ok);color:#fff}
.opt.correct .badge{display:inline-block;background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt.wrong .let{background:var(--err);color:#fff}
.opt.wrong .badge{display:inline-block;background:var(--err);color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:16px;border-radius:12px;padding:14px 16px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.err{background:var(--err-soft);border:1px solid var(--err)}
.feedback h3{margin:0 0 4px;font-size:1rem}
.feedback.ok h3{color:var(--ok)} .feedback.err h3{color:var(--err)}
.feedback p{margin:4px 0 0;font-size:.95rem}
.feedback .label{font-weight:700}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .mid{display:flex;gap:10px;flex:1;justify-content:center}
button.btn{font:inherit;font-weight:700;border-radius:12px;padding:11px 20px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--text);transition:filter .15s,transform .05s}
button.btn:hover:not(:disabled){filter:brightness(.97)}
button.btn:active:not(:disabled){transform:scale(.98)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.btn.ghost{background:transparent}
.nav{margin-top:18px}
.nav summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.grid button{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.grid button.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.grid button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.grid button.err{background:var(--err);border-color:var(--err);color:#fff}
.hint{color:var(--muted);font-size:.8rem;margin-top:14px;text-align:center}
/* resultado */
.result{text-align:center}
.result h2{margin:0 0 4px;font-size:1.4rem}
.ring{--p:0;width:170px;height:170px;border-radius:50%;margin:18px auto;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:134px;height:134px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.ring b{font-size:2rem}
.ring span{display:block;font-size:.75rem;color:var(--muted);margin-top:-18px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0 18px}
.rbox{border:1px solid var(--line);border-radius:12px;padding:12px}
.rbox strong{display:block;font-size:1.5rem}
.rbox span{color:var(--muted);font-size:.85rem}
.rbox.ok strong{color:var(--ok)} .rbox.err strong{color:var(--err)}
.review{text-align:left;margin-top:20px}
.review h3{margin:0 0 10px}
.ritem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.ritem .q{font-weight:600;margin-bottom:6px;font-size:.95rem}
.ritem .a{font-size:.9rem;color:var(--muted)}
.ritem .a b{color:var(--text)}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
@media (max-width:520px){
  .card{padding:16px}
  .actions .mid{order:3;width:100%}
  .actions button.btn{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Saúde e Segurança Aplicada ao Trabalho<small>Simulado • Pelotão Bravo e Pelotão Alpha</small></h1>
    <div class="stats">
      <div class="chip ok"><span class="dot"></span>Acertos: <span id="sOk">0</span></div>
      <div class="chip err"><span class="dot"></span>Erros: <span id="sErr">0</span></div>
      <div class="chip all"><span class="dot"></span>Respondidas: <span id="sAns">0</span>/<span id="sTot">0</span></div>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <main id="app"></main>
</div>

<script>
/* ===== Banco de questões =====
   c = alternativa correta (usada apenas internamente para corrigir)
   e = explicação exibida somente após responder */
var QUESTOES = [
/* ---------- PELOTÃO BRAVO ---------- */
{g:"Pelotão Bravo · Grupo 1",
 q:"De acordo com o Decreto nº 5.869/2005, considera-se acidente em serviço aquele que ocorre com o Militar Estadual da ativa em qual das situações abaixo?",
 o:["Apenas durante férias regulamentares","No desempenho de atribuição funcional durante o expediente regular, ou quando determinado por autoridade competente","Somente em atividades esportivas não oficiais","Exclusivamente dentro do quartel"],
 c:"B",
 e:"O Decreto nº 5.869/2005 caracteriza o acidente em serviço pelo desempenho de atribuição funcional no expediente regular ou por determinação de autoridade competente. As demais alternativas restringem indevidamente a hipótese (apenas férias, só esporte não oficial, exclusivamente no quartel)."},
{g:"Pelotão Bravo · Grupo 1",
 q:"Considere a afirmativa: todos os acidentes com trabalhadores, sem exceção alguma, envolvem algum tipo de contato inesperado entre a pessoa e algo ao seu redor.",
 o:["Verdadeiro","Falso"],
 c:"B",
 e:"Falso. Há exceção: a tensão muscular causada por esforço excessivo é um acidente que não envolve contato inesperado com objetos, superfícies ou coisas ao redor. Por isso a expressão \"sem exceção alguma\" torna a afirmativa incorreta."},
{g:"Pelotão Bravo · Grupo 1",
 q:"Segundo a legislação estadual, considera-se acidente em serviço, EXCETO",
 o:["no desempenho de atribuição funcional durante o expediente regular, ou quando determinado por autoridade competente, em sua prorrogação ou antecipação.","no cumprimento de ordem emanada de autoridade.","no decorrer de viagem imposta por motivo de movimentação efetuada no interesse do serviço ou a pedido.","Doenças ocupacionais, ou seja, doenças profissionais ou do trabalho que se equiparam ao acidente, causadas pelas condições da atividade ou da profissão.","no exercício de dever preconizado no art. 102 da lei nº 1943."],
 c:"D",
 e:"Conforme o gabarito, a alternativa D é a exceção. As demais descrevem hipóteses diretas de acidente em serviço: atribuição funcional (inclusive prorrogação ou antecipação), cumprimento de ordem, viagem no interesse do serviço e exercício de dever legal."},
{g:"Pelotão Bravo · Grupo 2",
 q:"Qual é a principal causa dos acidentes de trabalho?",
 o:["Falta de habilidade técnica.","Excesso de confiança.","Atos inseguros.","Treinamento excessivo."],
 c:"C",
 e:"A principal causa dos acidentes de trabalho são os atos inseguros, isto é, falhas de comportamento do próprio trabalhador, como não seguir normas ou procedimentos."},
{g:"Pelotão Bravo · Grupo 2",
 q:"Um trabalhador sofre uma lesão lombar ao tentar levantar uma carga sozinho, sem utilizar a técnica correta. Como essa ocorrência deve ser classificada conforme o estudo das causas de acidentes?",
 o:["Condição insegura, pois o peso da carga é um fator ambiental incontrolável.","Ato inseguro, por envolver o levantamento de peso de maneira incorreta ou superior ao recomendado.","Fator neutro, já que acidentes por excesso de força não envolvem contato com objetos externos.","Negligência exclusiva da gerência por não fornecer EPI adequado para a coluna."],
 c:"B",
 e:"Levantar peso de forma incorreta ou acima do recomendado é um ato inseguro: depende da conduta do trabalhador, e não de uma falha do ambiente."},
{g:"Pelotão Bravo · Grupo 2",
 q:"Qual das seguintes situações exemplifica uma 'Condição Insegura' relacionada à atmosfera do local de trabalho?",
 o:["Carregar peso de modo a dificultar a visão periférica.","A inobservância das normas de segurança por parte da equipe de campo.","A presença de gases, vapores, poeiras ou névoas prejudiciais à saúde.","O não uso de sinalização e delimitação no teatro de operações."],
 c:"C",
 e:"Condição insegura é uma falha do ambiente. A presença de gases, vapores, poeiras ou névoas prejudiciais afeta a atmosfera do local. As demais alternativas descrevem comportamentos (atos inseguros)."},
{g:"Pelotão Bravo · Grupo 3",
 q:"Segundo a norma exposta no texto, como são definidos os Riscos Ambientais (NR 09) no ambiente de trabalho?",
 o:["São exclusivamente as variações climáticas naturais, como chuva e vento, que ocorrem durante o expediente.","São acidentes causados unicamente pelo uso incorreto de ferramentas e máquinas pesadas.","São os agentes físicos, químicos e biológicos que, em função de sua natureza, concentração/intensidade e tempo de exposição, são capazes de causar danos à saúde do trabalhador.","São condutas inadequadas e erros operacionais cometidos pelos próprios trabalhadores durante suas atividades."],
 c:"C",
 e:"Pela NR-09, riscos ambientais são os agentes físicos, químicos e biológicos que, por sua natureza, concentração ou intensidade e tempo de exposição, podem causar danos à saúde do trabalhador."},
{g:"Pelotão Bravo · Grupo 3",
 q:"Com base na classificação dos agentes ambientais apresentada, qual das opções abaixo exemplifica corretamente um Agente Físico e um Agente Biológico, respectivamente?",
 o:["Ruído / Bactérias e vírus","Poeiras e fumos / Fungos","Gases e vapores / Radiação ionizante","Vibrações / Gases tóxicos"],
 c:"A",
 e:"Ruído é agente físico e bactérias e vírus são agentes biológicos. Nas outras opções, poeiras, fumos, gases e vapores são agentes químicos, ou a ordem físico/biológico está invertida."},
{g:"Pelotão Bravo · Grupo 3",
 q:"Sobre as Normas Regulamentadoras, qual é a estrutura do sistema utilizado para a elaboração e revisão dessas normas, conforme preconizado pela Organização Internacional do Trabalho (OIT)?",
 o:["Sistema bipartite, composto exclusivamente por representantes de empresas e sindicatos.","Sistema tripartite paritário, composto por representantes do governo, de empregadores e de trabalhadores.","Sistema centralizado, gerido unicamente por órgãos de fiscalização do governo federal.","Sistema internacional privado, gerenciado pelas associações NFPA e IFSTA."],
 c:"B",
 e:"O sistema é tripartite paritário: governo, empregadores e trabalhadores participam em igualdade de representação na elaboração e revisão das NRs."},
{g:"Pelotão Bravo · Grupo 4",
 q:"Os EPIs podem ser utilizados:",
 o:["Nunca, eventualmente, sempre e no quartel","Continuamente, intermitentemente, eventualmente e em emergência","Calor, frio, fogo e ácidos","Apenas em emergência"],
 c:"B",
 e:"Os EPIs podem ser utilizados de forma contínua, intermitente, eventual e em emergência. A alternativa D limita indevidamente o uso, e a C lista riscos, não formas de utilização."},
{g:"Pelotão Bravo · Grupo 4",
 q:"Sobre equipamentos de proteção, assinale Verdadeiro ou Falso",
 af:"A finalidade indireta do EPI é a de promover o gasto do estado com a formação profissional, aumentando assim despesas com custeio de tratamentos médicos e hospitalares.",
 o:["Verdadeiro","Falso"],
 c:"B",
 e:"Falso. A finalidade indireta do EPI é justamente o oposto: ao prevenir acidentes e doenças, ele contribui para reduzir os gastos do Estado com tratamentos médicos e hospitalares."},
{g:"Pelotão Bravo · Grupo 4",
 q:"Qual das alternativas apresenta apenas exemplos de riscos contra os quais os EPIs podem oferecer proteção?",
 o:["Calor, frio, fogo e eletricidade","Treinamento, fadiga, disciplina e calor","Organização, ruído, treinamento e liderança","Ergonomia, disciplina, liderança e capacitação"],
 c:"A",
 e:"Calor, frio, fogo e eletricidade são riscos físicos contra os quais o EPI protege. As outras alternativas misturam fatores organizacionais ou de gestão (treinamento, disciplina, liderança), que não são riscos que um EPI neutralize."},
{g:"Pelotão Bravo · Grupo 5",
 q:"Qual alternativa NÃO expressa um fator ergonômico na atividade do CBM?",
 o:["Postura inadequada","Movimentos repetitivos","Esforços físicos","Cadeiras adequadas com regulagem"],
 c:"D",
 e:"Postura inadequada, movimentos repetitivos e esforços físicos são fatores ergonômicos de risco. Cadeiras adequadas com regulagem são uma medida de adequação ergonômica, não um fator de risco."},
{g:"Pelotão Bravo · Grupo 5",
 q:"São afastamentos frequentes (a respeito de ergonomia):",
 o:["Intoxicação alimentar","Acidente de trânsito","Evento esportivo","Problemas ortopédicos"],
 c:"D",
 e:"Os problemas ortopédicos são os afastamentos frequentes ligados à ergonomia, pois decorrem de posturas inadequadas, esforços e movimentos repetitivos."},
{g:"Pelotão Bravo · Grupo 5",
 q:"Qual é o principal objetivo da ergonomia no ambiente de trabalho?",
 o:["Aumentar a carga de trabalho do funcionário.","Adaptar o trabalho as características do trabalhador.","Fazer o trabalhador se adaptar ao trabalho.","Diminuir o número de funcionários."],
 c:"B",
 e:"A ergonomia busca adaptar o trabalho às características do trabalhador, e não o contrário."},

/* ---------- PELOTÃO ALPHA ---------- */
{g:"Pelotão Alpha · Grupo 1",
 q:"Em relação à Saúde e Segurança no Trabalho, assinale a alternativa correta:",
 o:["Tem como principal objetivo evitar acidentes durante a realização das atividades profissionais.","Está relacionada principalmente à utilização adequada dos equipamentos de proteção individual.","Envolve normas e procedimentos destinados à prevenção de acidentes e doenças ocupacionais, considerando também aspectos relacionados à saúde, violência e assédio no ambiente de trabalho.","Está relacionada à prevenção de acidentes e à manutenção da capacidade física do trabalhador para realizar suas atividades."],
 c:"C",
 e:"A alternativa C é a mais completa: abrange normas e procedimentos de prevenção de acidentes e doenças ocupacionais e também saúde, violência e assédio no trabalho. As demais tratam apenas de aspectos parciais."},
{g:"Pelotão Alpha · Grupo 1",
 q:"Qual é a diferença entre doença ocupacional e acidente de trabalho?",
 o:["Doença ocupacional acontece somente em atividades administrativas, enquanto acidente ocorre apenas em atividades operacionais.","Doença ocupacional está relacionada ao trabalho, enquanto o acidente acontece durante o trabalho.","Doença ocupacional pode se desenvolver ao longo do tempo em razão das condições de trabalho, enquanto o acidente é um acontecimento durante a atividade que pode provocar uma lesão ou prejuízo à saúde.","Doença ocupacional e acidente de trabalho são situações diferentes, mas ambas podem ser prevenidas por meio de medidas de segurança."],
 c:"C",
 e:"A doença ocupacional se desenvolve gradualmente, por causa das condições de trabalho. O acidente é um evento pontual durante a atividade, que pode causar lesão ou prejuízo à saúde."},
{g:"Pelotão Alpha · Grupo 1",
 q:"De acordo com a definição da OMS apresentada na aula, o que significa ter saúde?",
 o:["Não possuir nenhuma doença ou enfermidade.","Estar fisicamente preparado para realizar as atividades profissionais.","Ter boas condições físicas e conseguir realizar normalmente as atividades do trabalho.","Ter um estado de completo bem-estar físico, mental e social, e não somente a ausência de afecções e enfermidades."],
 c:"D",
 e:"Para a OMS, saúde é o completo bem-estar físico, mental e social, e não apenas a ausência de doenças."},
{g:"Pelotão Alpha · Grupo 2",
 q:"Com base na Portaria do Comando-Geral Nº 256/2023, que regulamenta as atribuições funcionais da Diretoria de Pessoal do Corpo de Bombeiros Militar do Paraná (CBMPR), assinale a alternativa CORRETA:",
 o:["A execução dos atos de movimentação do pessoal militar é realizada pela Diretoria de Pessoal de forma autônoma, sem necessidade de alinhamento com as ordens do Comandante-Geral.","A preparação dos atos relativos à transição funcional (como exclusão, agregação, licenças ou transferência para a reserva e reforma) compete à Diretoria de Pessoal, sendo esses atos editados pelo Comandante-Geral.","As atividades relativas ao recrutamento e à seleção abrangem apenas a fase posterior ao ingresso, ficando a publicação de editais sob responsabilidade exclusiva de órgãos externos.","O controle de militares estaduais cedidos à disposição de outros órgãos ou autoridades fica suspenso enquanto
