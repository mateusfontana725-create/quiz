<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questões de SCI – CFP BM 2026</title>
<meta name="description" content="Questões objetivas e de V ou F sobre o Sistema de Controle de Incidentes (SCI).">
<style>
:root{--bg:#fff;--txt:#1c1c1c;--mut:#666;--line:#d9d9d9;--soft:#f5f5f5;--ok:#1b7f3b;--bad:#b3261e;--acc:#1c1c1c;--r:8px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161616;--txt:#eee;--mut:#aaa;--line:#3a3a3a;--soft:#222;--ok:#6fcf8a;--bad:#ff8a80;--acc:#eee}
}
:root[data-theme="dark"]{--bg:#161616;--txt:#eee;--mut:#aaa;--line:#3a3a3a;--soft:#222;--ok:#6fcf8a;--bad:#ff8a80;--acc:#eee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:22px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--mut);font-size:14px}
.box{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{display:inline-block;padding:9px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);cursor:pointer;text-decoration:none;color:var(--txt)}
.btn.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.btn.link{border:none;padding:4px 0;color:var(--mut);text-decoration:underline;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp label{display:block;padding:3px 0;cursor:pointer}
.grp input{margin-right:8px}
.grp.inline label{display:inline-block;margin-right:14px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
.tag{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-right:6px}
.enun{font-size:17px;margin:8px 0 14px}
.alt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.alt.ok{border-color:var(--ok);color:var(--ok)}
.alt.bad{border-color:var(--bad);color:var(--bad)}
.alt.sel{border-color:var(--acc);border-width:2px}
.alt .let{font-weight:700;min-width:18px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.tf{display:flex;gap:8px;margin-top:6px}
.tf button{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.tf button.on{border-color:var(--acc);border-width:2px}
select,textarea,input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:90px}
input[type=text].campo{width:100%;margin-top:4px}
.fb{margin-top:6px;font-size:15px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.expl{margin-top:14px;padding:12px 14px;background:var(--soft);border-radius:var(--r)}
.step{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.msg{color:var(--bad)}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.st-ok{color:var(--ok)} .st-bad{color:var(--bad)} .st-no{color:var(--mut)}
.gab td:first-child{width:38%;color:var(--mut)}
@media (max-width:520px){ .gab td:first-child{width:auto} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Questões de SCI</h1>
</header>
<main id="app" aria-live="polite"></main>
</div>
<script>
/* Banco de questões de SCI (CFP BM 2026): objetivas (a–d) e V ou F. Fonte: slides do curso "Sistema de Controle de Incidentes". */
const ASSUNTOS = [
  {id:"orig",  nome:"Origem, linha do tempo e legislação"},
  {id:"conc",  nome:"Conceitos, princípios e características"},
  {id:"staff", nome:"Comando, staff e títulos"},
  {id:"area",  nome:"Instalações, áreas e símbolos"},
  {id:"recu",  nome:"Recursos e formulários"},
  {id:"sicoe", nome:"SICOE, Defesa Civil e hora de ouro"},
  {id:"oper",  nome:"Operação: PAI, implantação e transferência"}
];
const NIVEIS = {1:"Fácil", 2:"Intermediário", 3:"Difícil"};
const TIPOS = {vf:"V ou F", mc:"Múltipla escolha"};

const V = (t, e) => ({t, v:true, e});
const F = (t, e) => ({t, v:false, e});
const VF = (id, sub, nivel, itens, expl) => ({id, sub, tipo:"vf", nivel, enun:"Julgue cada item como verdadeiro (V) ou falso (F).", itens, expl: expl || ""});
const MC = (id, sub, nivel, enun, alts, correta, expl) => ({id, sub, tipo:"mc", nivel, enun, alts, correta, expl: expl || ""});

const QUESTOES = [
/* ===== ORIGEM E LEGISLAÇÃO ===== */
MC("o01","orig",1,"Em que contexto surgiu o SCI nos Estados Unidos?",["Crise financeira de 1929","Incêndios devastadores na Califórnia (1970–71)","Terremoto de São Francisco","Enchentes no Mississippi"],1,"Os incêndios devastadores na Califórnia (1970–71) levaram à criação do FIRESCOPE e da 1ª versão do SCI, em 1973."),
MC("o02","orig",1,"Qual programa criado na Califórnia deu origem à 1ª versão do SCI, em 1973?",["NIMS","FEMA","FIRESCOPE","HSPD-5"],2,"O FIRESCOPE (California Organized for Potential Emergencies) foi criado na Califórnia e produziu a 1ª versão do SCI."),
MC("o03","orig",2,"Após os atentados de 11/09/2001, qual documento consolidou o SCI como padrão nos EUA?",["NIMS","HSPD-5","Decreto Estadual nº 6.416/2002","Lei Kiss"],1,"A HSPD-5 (2003) consolidou o SCI. A primeira edição do NIMS é de 2004."),
MC("o04","orig",1,"Qual acordo deu início ao SCI no Brasil?",["Acordo de cooperação técnica do Ibama com o USFS (1990)","Acordo do CBMPR com a FEMA (2005)","Acordo da SENASP com a Petrobras (2002)","Acordo do CBMDF com o Ibama (1979)"],0,"Em 1990, o USFS apoiou o Ibama por meio de um acordo de cooperação técnica."),
MC("o05","orig",2,"Os bombeiros brasileiros treinaram, a partir de 1991, em qual modalidade de brigada?",["Smokejumpers","Hotshot Crew","Rescue Squad","Golden Team"],1,"Bombeiros militares e servidores do Ibama treinaram em brigadas Hotshot Crew, incorporando conceitos do SCI."),
MC("o06","orig",2,"Como o Paraná denomina o SCI?",["SCO","SICOE","ICS","IMS"],1,"No Paraná, o SCI é chamado de SICOE (Sistema Integrado de Comando e Operações em Emergência, pelo Decreto 6.416/2002)."),
MC("o07","orig",1,"Como o setor de petróleo e gás costuma chamar o SCI?",["SICOE","SCO","ICS ou IMS","SINDEC"],2,"O setor de petróleo e gás mantém a sigla ICS ou usa IMS (Incident Management System)."),
MC("o08","orig",2,"Qual nome a Defesa Civil Nacional passou a usar para o SCI no início dos anos 2000?",["SICOE","SCO","SINDEC","IMS"],1,"A Defesa Civil Nacional renomeou o SCI como Sistema de Comando em Operações (SCO)."),
VF("o09","orig",2,[
  V("O Decreto Estadual nº 1.343/1999 aprovou o regulamento do Sistema Estadual de Defesa Civil.","Verdadeiro. O Dec. 1.343/1999 aprova o regulamento do SEDEC."),
  F("O Decreto Estadual nº 6.416/2002 criou o Sistema Estadual de Defesa Civil.","Falso. O Dec. 6.416/2002 institui o SICOE; o SEDEC vem do Dec. 1.343/1999."),
  V("O Decreto Estadual nº 6.416, de 11/10/2002, institui o SICOE.","Verdadeiro."),
  F("O Decreto Estadual nº 9.557/2013 tornou o SCI obrigatório em emergências ambientais.","Falso. Quem torna o SCI obrigatório são os decretos federais 10.950/2022 e 12.173/2024; o 9.557/2013 reconfigura o modelo no Paraná.")
]),
MC("o10","orig",2,"Quais decretos federais estabeleceram o SCI como ferramenta obrigatória de gestão?",["6.416/2002 e 9.557/2013","10.950/2022 e 12.173/2024","1.343/1999 e 6.416/2002","13.425/2017 e 9.557/2013"],1,"Os decretos federais 10.950/2022 e 12.173/2024 tornaram o SCI obrigatório."),
MC("o11","orig",1,"Qual é a base doutrinária do SICOE?",["Corpo de Bombeiros Militar","Estado-Maior da Escola Superior de Guerra","FEMA","SENASP"],1,"A base doutrinária do SICOE vem do Estado-Maior da ESG."),
MC("o12","orig",2,"O que foi o \"Paraná em Flagelo\"?",["Incêndio urbano dos anos 2000","Maior incêndio florestal registrado no Paraná, na década de 1960, no qual já se aplicava metodologia semelhante ao ICS","Enchente de 2011","Terremoto no litoral"],1,"Na década de 1960, durante o maior incêndio florestal registrado, já se aplicava no Paraná uma metodologia semelhante ao ICS."),
MC("o13","orig",2,"Qual lei ou decreto aprova o regulamento do Sistema Estadual de Defesa Civil no Paraná?",["Decreto 9.557/2013","Decreto 1.343/1999","Decreto 6.416/2002","Decreto 10.950/2022"],1,"O Decreto Estadual 1.343/1999 aprova o regulamento do SEDEC."),

/* ===== CONCEITOS, PRINCÍPIOS E CARACTERÍSTICAS ===== */
MC("c01","conc",1,"Segundo a ABNT (2005), o que é um incidente?",["Qualquer evento de rotina","Evento cuja ocorrência resulta em dano à saúde de pessoas, à propriedade ou ao meio ambiente","Somente incêndios","Somente acidentes de trânsito"],1,"Incidente é o evento cuja ocorrência resulta em dano à saúde, à propriedade ou ao meio ambiente (ABNT, 2005)."),
MC("c02","conc",1,"Quais são as três finalidades centrais do SCI?",["Lucro, controle e prazo","Segurança, objetivos táticos e eficiência no uso dos recursos","Velocidade, custo e mídia","Hierarquia, disciplina e sigilo"],1,"O SCI garante segurança das equipes, alcance de objetivos táticos e uso eficiente dos recursos."),
MC("c03","conc",2,"Na hierarquia do gerenciamento por objetivos, qual é a ordem correta?",["Táticas, estratégias e objetivos","Objetivos, estratégias e táticas","Estratégias, objetivos e táticas","Táticas, objetivos e estratégias"],1,"A hierarquia é: objetivos → estratégias → táticas."),
MC("c04","conc",1,"Quantas características de gerenciamento de incidentes compõem o NIMS/SCI?",["10","12","14","16"],2,"São 14 características do NIMS, agrupadas em 6 categorias."),
MC("c05","conc",2,"As 14 características do NIMS/SCI estão agrupadas em quantas categorias?",["3","4","6","8"],2,"As 14 características são organizadas em 6 categorias."),
VF("c06","conc",2,[
  V("A terminologia comum padroniza nomes de funções, cargos, instalações e recursos.","Verdadeiro. É a característica 1."),
  F("Na organização modular, a estrutura é definida pelo cargo do responsável, e não pela função.","Falso. Na organização modular, a forma segue a função."),
  V("Quando um supervisor passa a ter mais de 7 subordinados, criam-se equipes, divisões, grupos ou seções.","Verdadeiro. Acima de 7 subordinados, reorganiza-se a estrutura."),
  F("A amplitude de controle ideal no SCI é de 7 subordinados por supervisor.","Falso. O ideal é 5; o máximo é 7.")
]),
MC("c07","conc",2,"Qual é a amplitude de controle no SCI?",["De 2 a 5 subordinados","Mínimo 3, ideal 5 e máximo 7 subordinados por supervisor","De 5 a 10 subordinados","De 1 a 3 subordinados"],1,"A amplitude de controle no SCI é de 3 (mínimo), 5 (ideal) e 7 (máximo)."),
MC("c08","conc",2,"Quem é responsável por monitorar a amplitude de controle?",["Chefe de Logística","Comandante do Incidente","Oficial de Ligação","Oficial de Informação Pública"],1,"Monitorar a amplitude de controle é uma das principais responsabilidades do Comandante do Incidente."),
MC("c09","conc",2,"Na cadeia de comando, cada pessoa responde e informa a quantas pessoas?",["Somente a uma pessoa","De uma a sete pessoas","De duas a três pessoas","No máximo cinco pessoas"],0,"Pela unidade de comando, cada pessoa responde a um único supervisor."),
MC("c10","conc",3,"Qual princípio de responsabilização exige check-in e check-out de todo o pessoal, independentemente do órgão?",["Plano de Ação do Incidente","Check-in/Check-out","Amplitude de controle","Unidade de comando"],1,"Check-in e check-out são o primeiro princípio de accountability."),
MC("c11","conc",2,"Quais são as duas formas de comunicação no SCI?",["Verbal e escrita","Formal e informal","Rádio e telefone","Interna e externa"],1,"A comunicação formal serve para receber tarefas, pedir recursos e relatar progresso. A informal troca informações sem pedido de tarefa."),
MC("c12","conc",2,"Qual destas ocorrências é típica de aplicação do SCI?",["Furto de veículo isolado","Rompimento de barragens","Trânsito leve sem vítimas","Vazamento doméstico de gás de cozinha"],1,"Rompimento de barragens, desastres naturais e incidentes com produtos perigosos são exemplos de aplicação do SCI."),
MC("c13","conc",2,"Qual é a principal razão para o SCI servir a todos os tipos de incidentes?",["Porque substitui as leis locais","Porque integra várias instituições e assegura o uso e o gerenciamento corretos dos recursos","Porque dispensa treinamento","Porque é aplicado apenas em grandes cidades"],1,"O SCI integra instituições e assegura o gerenciamento correto dos recursos."),

/* ===== COMANDO, STAFF E TÍTULOS ===== */
MC("s01","staff",1,"Quantas funções compõem o Staff de Comando?",["2","3","4","5"],1,"O Staff de Comando tem 3 funções: Segurança, Informação Pública e Ligação."),
MC("s02","staff",2,"Qual é o título dado aos integrantes do Staff de Comando?",["Chefes","Oficiais","Líderes","Encarregados"],1,"Os integrantes do Staff de Comando são Oficiais."),
MC("s03","staff",2,"Qual Oficial é o único porta-voz do incidente?",["Oficial de Segurança","Oficial de Ligação","Oficial de Informação Pública","Chefe de Logística"],2,"O OIP é o único porta-voz. Toda informação é aprovada pelo CI."),
MC("s04","staff",2,"Quem integra as instituições que atuam no incidente ou podem ser convocadas?",["Oficial de Segurança","Oficial de Informação Pública","Oficial de Ligação","Chefe de Planejamento"],2,"O Oficial de Ligação integra as instituições."),
MC("s05","staff",1,"Quantas seções compõem o Staff Geral?",["3","4","5","6"],1,"O Staff Geral tem 4 seções: Planejamento, Operações, Logística e Administração/Finanças."),
MC("s06","staff",2,"Qual seção é responsável por elaborar o PAI?",["Operações","Logística","Administração/Finanças","Planejamento"],3,"O Planejamento elabora o PAI e mantém o controle dos recursos."),
MC("s07","staff",2,"Quais são as unidades da Logística?",["Recursos, Situação e Documentação","Comunicações, Médica, Alimentação, Materiais, Instalações e Apoio Terrestre","Tempo, Provedoria e Custos","Setores e divisões"],1,"As unidades da Logística são: Comunicações, Médica, Alimentação, Materiais, Instalações e Apoio Terrestre."),
MC("s08","staff",2,"Quais são as unidades da Administração/Finanças?",["Recursos, Situação e Documentação","Comunicações e Médica","Setores e divisões","Tempo, Provedoria e Custos"],3,"As unidades são Tempo, Provedoria e Custos."),
MC("s09","staff",2,"Em incidentes pequenos, quem pode acumular todas as funções?",["Oficial de Ligação","Comandante do Incidente","Chefe de Operações","Encarregado da Base"],1,"Em incidentes pequenos, o CI pode acumular todas as funções."),
MC("s10","staff",2,"Quem assume o comando quando o incidente começa?",["Quem tiver o maior cargo, sempre","O primeiro a chegar com capacidade de resposta, mesmo sem usar a terminologia","O Oficial de Segurança","O Chefe de Logística"],1,"O primeiro a chegar com capacidade de resposta age como CI."),
MC("s11","staff",1,"Qual é a única função do SCI sempre ativa, em qualquer resposta?",["Comando","Oficial de Segurança","Planejamento","Logística"],0,"O Comandante do Incidente é a única função sempre ativa."),
MC("s12","staff",2,"Qual título é dado a quem está à frente de acampamento, base, PC, ACV ou área de espera?",["Coordenador","Supervisor","Líder","Encarregado"],3,"O título de Encarregado é usado para ACV, Área de Espera, Base, Acampamento e PC."),
MC("s13","staff",2,"Qual é o título dado ao responsável por uma divisão ou grupo?",["Supervisor","Chefe","Oficial","Comandante"],0,"Supervisor é o título de quem responde por divisão ou grupo."),
VF("s14","staff",2,[
  V("O Oficial de Segurança pode agir com autonomia em risco iminente e deve informar o CI.","Verdadeiro. O OS pode corrigir condições inseguras e informa o CI."),
  F("O Chefe de Operações é um Oficial do Staff de Comando.","Falso. O Chefe de Operações é do Staff Geral, e o título é Chefe."),
  V("Em incidentes pequenos, o CI pode acumular todas as funções.","Verdadeiro."),
  F("A Seção de Logística registra gastos e mantém a documentação para indenizações.","Falso. Essa é a função da Administração/Finanças.")
]),

/* ===== INSTALAÇÕES, ÁREAS E SÍMBOLOS ===== */
MC("a01","area",1,"Qual é o símbolo do PC?",["Círculo amarelo com \"PC\"","Retângulo laranja com \"PC\"","Triângulo verde com \"PC\"","Círculo azul com \"PC\""],1,"O PC é sinalizado com um retângulo laranja, com as letras PC em preto."),
MC("a02","area",1,"Um círculo amarelo de 90 cm com a letra \"E\" identifica:",["Área de Espera","ACV","Base","Helibase"],0,"O E é a Área de Espera."),
MC("a03","area",1,"Quantas Bases pode haver por incidente?",["Uma","Duas","Três","Uma por seção"],0,"Há apenas uma Base por incidente."),
MC("a04","area",2,"O que é uma base?",["Local de pouso de helicópteros","Instalação de onde se coordenam as funções logísticas do incidente","Área de triagem de vítimas","Abrigo de vítimas"],1,"A Base coordena e administra as funções logísticas."),
MC("a05","area",2,"O que é um heliponto?",["Estacionamento e manutenção de helicópteros","Local de pouso, decolagem e carga/descarga de pessoas, equipamentos e materiais","Área de triagem","Área médica"],1,"O heliponto é usado para pouso, decolagem e carga e descarga."),
MC("a06","area",2,"Qual instalação é o local de estacionamento, abastecimento e manutenção de helicópteros?",["Pouso e decolagem","Reunião de equipes","Triagem de vítimas","Helibase"],3,"A Helibase é o estacionamento, o abastecimento e a manutenção de helicópteros."),
MC("a07","area",2,"Quantas divisões de atendimento pré-hospitalar atuam dentro da ACV?",["2","3","4","5"],2,"Há 4 divisões: transporte, triagem, estabilização e monitoramento, e manejo de mortos."),
MC("a08","area",2,"Quais são as divisões de atendimento dentro da ACV?",["Transporte, triagem, estabilização e monitoramento, e manejo de mortos","Resgate, combate, apoio e comando","Planejamento, operações e logística","Recepção, alta, internação e óbito"],0,"São as 4 divisões da ACV."),
MC("a09","area",2,"Como deve ser a Área de Espera quanto às rotas?",["Rotas iguais de entrada e saída","Rotas diferentes de entrada e saída","Apenas uma entrada","Nenhuma rota"],1,"A Área de Espera deve ter rotas diferentes de entrada e saída."),
MC("a10","area",2,"Qual característica NÃO se espera do PC?",["Visão integral da cena","Localização na zona de risco","Comunicação adequada","Capacidade de expansão"],1,"O PC deve ficar em local seguro, fora da zona de risco."),
VF("a11","area",2,[
  V("A ACV deve estar em área segura, ampliável e próxima ao incidente.","Verdadeiro."),
  F("O PC deve ser instalado na zona de risco, para acompanhar a cena de perto.","Falso. O PC deve ficar em local seguro, fora da zona de risco."),
  V("Pode haver mais de um Acampamento no incidente, cada um com um encarregado.","Verdadeiro."),
  F("Helibase e heliponto são a mesma instalação.","Falso. A helibase é para estacionamento e manutenção; o heliponto, para pouso e carga.")
]),

/* ===== RECURSOS E FORMULÁRIOS ===== */
MC("r01","recu",1,"A classe de um recurso define:",["Sua capacidade de carga","A natureza da missão ou função","O número de pessoas","A cor do veículo"],1,"Classe é a natureza da missão ou função (salvamento, transporte, combate a incêndio)."),
MC("r02","recu",2,"O tipo de um recurso define:",["Natureza da missão","Nome do recurso","Capacidade operacional, de carga e número de pessoas","Cor da placa"],2,"Tipo define a capacidade operacional, a capacidade de carga e o número de pessoas."),
MC("r03","recu",2,"Um equipamento e seu complemento de pessoal, com líder responsável pela missão, é classificado como:",["Recurso único","Força-tarefa","Equipe de intervenção","Instalação"],0,"É um recurso único (R.U.), como 1 AA ou 1 ABTR."),
MC("r04","recu",2,"Pela classificação, 2 AA + 1 ABTR formam:",["Recurso único","Equipe de intervenção","Força-tarefa","Instalação"],2,"Força-tarefa é a combinação de recursos de classes e tipos diferentes, com um só líder."),
MC("r05","recu",2,"Qual é a diferença entre equipe de intervenção e força-tarefa?",["Equipe tem classes diferentes; força-tarefa, a mesma classe e tipo","Equipe tem mesma classe e tipo; força-tarefa combina classes e tipos diferentes","Não há diferença","Força-tarefa exige dois líderes"],1,"Equipe de intervenção: recursos únicos da mesma classe e tipo. Força-tarefa: recursos de classes e tipos diferentes."),
MC("r06","recu",2,"Um recurso danificado ou em manutenção é classificado como:",["Disponível","Designado","Indisponível","Desmobilizado"],2,"Os estados são: disponível, designado e indisponível."),
MC("r07","recu",2,"Quem pode solicitar recursos no incidente?",["O CI e os chefes de Planejamento, Operações e Logística","Qualquer bombeiro","Somente o Chefe de Logística","Apenas o Oficial de Ligação"],0,"Podem solicitar o CI e os chefes de Planejamento, Operações e Logística."),
MC("r08","recu",2,"Pedir um helicóptero de fora do incidente é:",["Solicitação","Requisição","Designação","Desmobilização"],1,"Solicitação é para recursos internos; requisição é para recursos de fora do incidente."),
VF("r09","recu",2,[
  V("O CI pode recusar recursos enviados sem solicitação ou sem aplicação no incidente.","Verdadeiro. É o direito de recusa."),
  F("Um recurso designado está disponível para ser mobilizado a qualquer momento.","Falso. Designado é o recurso em uso; disponível é o que está pronto para ser mobilizado."),
  V("A desmobilização de recursos é feita por ordem do CI.","Verdadeiro."),

/* ===== SICOE, DEFESA CIVIL E HORA DE OURO ===== */
MC("p01","sicoe",1,"Quais são as 4 fases da Defesa Civil, na ordem?",["Resposta, prevenção, preparação e reconstrução","Preparação, prevenção, resposta e reconstrução","Prevenção, preparação, resposta e reconstrução","Prevenção, resposta, preparação e reconstrução"],2,"Prevenção, preparação, resposta e reconstrução."),
MC("p02","sicoe",1,"Em qual fase da Defesa Civil se mobiliza o SINDEC a partir da COMDEC?",["Prevenção","Preparação","Resposta","Reconstrução"],2,"Na resposta, a COMDEC aciona o SINDEC e a escalada vai para o estado e a União."),

MC("p04","sicoe",2,"No SICOE, o Nível III corresponde a:",["Equipe interna com recursos próprios","Rotina operacional","Acionamento de equipe externa","Desastre com Comando Unificado de múltiplos órgãos do SINDEC"],3,"Nível I: equipe interna. Nível II: equipe externa. Nível III: desastre, com Comando Unificado."),
MC("p05","sicoe",2,"Qual é a 1ª prioridade do SICOE?",["Proteger propriedades","Preservar vidas","Estabilizar o evento","Preservar o meio ambiente"],1,"As prioridades são: vidas, estabilizar o evento, sistemas essenciais e meio ambiente, e propriedades."),
MC("p06","sicoe",2,"Quantas fases operacionais o SICOE tem, executadas de forma simultânea?",["5","6","7","8"],2,"São 7 fases operacionais simultâneas."),

MC("g02","oper",2,"No período proativo, o PAI é:",["Mental","Escrito e formalizado, com múltiplos períodos operacionais","Dispensado","Restrito ao primeiro período"],1,"No período proativo, o PAI é escrito e pode durar de horas a semanas."),

MC("g09","oper",2,"O PAI comunica:",["Somente custos","Estratégia, atribuições e objetivos","Somente mapas","Somente a carga de incêndio"],1,"O PAI comunica estratégia, atribuições e objetivos."),
VF("g10","oper",2,[
  V("O PAI deve ser atualizado a cada período operacional.","Verdadeiro."),
  F("O período reativo exige PAI escrito e formalizado.","Falso. No período reativo, o PAI é mental ou verbal."),

</script>
<script>
(() => {
"use strict";
const KEY = "sci-questoes-v1";
const LET = "ABCDE";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BY = Object.fromEntries(QUESTOES.map(q => [q.id, q]));
const SUBS = Object.fromEntries(ASSUNTOS.map(a => [a.id, a]));
const TIPOS_ROTULO = TIPOS;

/* ---------- armazenamento local, com proteção ---------- */
function loadStore(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
  return Object.assign({ answers:{}, fav:[], session:null }, s && typeof s === "object" ? s : {});
}
let store = loadStore();
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* sem armazenamento: segue sem salvar */ } }

/* ---------- utilidades ---------- */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function perm(key, n){
  const s = store.session;
  if (!s.perms[key] || s.perms[key].length !== n){ s.perms[key] = shuffle([...Array(n).keys()]); persist(); }
  return s.perms[key];
}
function curQ(){ return BY[store.session.ids[store.session.idx]]; }
function setResp(q, v){ store.session.resp[q.id] = v; persist(); }
function defaultResp(q){
  switch (q.tipo){
    case "mc": case "ac": return null;
    case "vf": return q.itens.map(() => null);
    case "assoc": return q.pares.map(() => null);
    case "lac": return q.lacunas.map(() => null);
    case "prat": return q.etapas.map(() => null);
    case "disc": return { texto: "", marks: null };
    case "tab": return q.campos.map(() => "");
  }
}
function getResp(q){ const s = store.session; if (s.resp[q.id] === undefined) s.resp[q.id] = defaultResp(q); return s.resp[q.id]; }

/* ---------- avaliação ---------- */
function evaluate(q){
  const s = store.session, r = getResp(q);
  switch (q.tipo){
    case "mc": case "ac": { const ok = r !== null && perm(q.id, q.alts.length)[r] === q.correta; return { ok, parts:[ok] }; }
    case "vf": { const parts = q.itens.map((it, i) => r[i] === it.v); return { ok: parts.every(Boolean), parts }; }
    case "assoc": { const p = perm(q.id, q.pares.length); const parts = q.pares.map((_, i) => r[i] !== null && p[r[i]] === i); return { ok: parts.every(Boolean), parts }; }
    case "lac": { const parts = q.lacunas.map((L, k) => r[k] !== null && perm(q.id + "#" + k, L.opcoes.length)[r[k]] === L.correta); return { ok: parts.every(Boolean), parts }; }
    case "prat": { const parts = q.etapas.map((E, i) => r[i] !== null && perm(q.id + "#" + i, E.alts.length)[r[i]] === E.correta); return { ok: parts.every(Boolean), parts }; }
    case "disc": { const m = r.marks || []; return { ok: m.length === q.criterios.length && m.every(Boolean), parts: m }; }
    case "tab": { const m = (s.marks && s.marks[q.id]) || []; const ok = m.length === q.campos.length && m.every(Boolean); return { ok, parts: m }; }
  }
}
function gabaritoHTML(q){
  switch (q.tipo){
    case "mc": case "ac": return `<p><strong>Resposta correta:</strong> ${esc(LET[perm(q.id, q.alts.length).indexOf(q.correta)])}) ${esc(q.alts[q.correta])}</p>`;
    case "vf": return "<ul>" + q.itens.map(it => `<li>${it.v ? "V" : "F"}: ${esc(it.t)}</li>`).join("") + "</ul>";
    case "assoc": return "<ul>" + q.pares.map(([a, b]) => `<li>${esc(a)} → ${esc(b)}</li>`).join("") + "</ul>";
    case "lac": return "<ul>" + q.lacunas.map((L, k) => `<li>Lacuna ${k + 1}: ${esc(L.opcoes[L.correta])}</li>`).join("") + "</ul>";
    case "prat": return "<ol>" + q.etapas.map(E => `<li>${esc(E.alts[E.correta])}</li>`).join("") + "</ol>";
    case "disc": return `<p><strong>Modelo de resposta:</strong> ${esc(q.modelo)}</p><p><strong>Critérios:</strong></p><ul>${q.criterios.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;
    case "tab": return `<table class="gab">${q.campos.map((c, i) => `<tr><td>${esc(c)}</td><td>${esc(q.gab[i])}</td></tr>`).join("")}</table>`;
  }
}
function explHTML(q){ return q.expl ? `<div class="expl"><strong>Resolução</strong><p>${esc(q.expl)}</p></div>` : ""; }

/* ---------- sessões ---------- */
function newSession(kind, ids, title){
  store.session = { kind, title, ids, idx:0, resp:{}, checked:{}, revealed:{}, perms:{}, marks:{}, done:false };
  persist();
}
function poolFor(st){
  let ids = QUESTOES.filter(q => st.subs.includes(q.sub) && st.tipos.includes(q.tipo) && st.niveis.includes(q.nivel)).map(q => q.id);
  if (st.mode === "sim") ids = ids.filter(id => BY[id].tipo !== "disc");
  if (st.onlyNew) ids = ids.filter(id => !store.answers[id]);
  if (st.onlyFav) ids = ids.filter(id => store.fav.includes(id));
  if (st.onlyWrong) ids = ids.filter(id => store.answers[id] && !store.answers[id].ok);
  return ids;
}
function startFromSetup(st){
  if (st.mode === "sim" && st.count === "prova"){
    const pick = (f, n) => shuffle(QUESTOES.filter(f).map(q => q.id)).slice(0, n);
    const ids = [...pick(q => q.tipo === "vf", 8), ...pick(q => q.tipo === "mc", 12)];
    newSession("sim", ids, "Prova modelo: 8 itens de V ou F e 12 questões de múltipla escolha");
    ui.view = "quiz"; ui.msg = ""; render(); return;
  }
  let ids = poolFor(st);
  if (!ids.length){ ui.msg = "Nenhuma questão com esses filtros."; render(); return; }
  if (st.mode === "sim"){
    ids = shuffle(ids);
    if (st.count !== "all") ids = ids.slice(0, Math.min(+st.count, ids.length));
    newSession("sim", ids, `Simulado com ${ids.length} questões`);
  } else {
    if (st.shuffle) ids = shuffle(ids);
    newSession("practice", ids, "Questões");
  }
  ui.view = "quiz"; ui.msg = ""; render();
}
function startFromIds(kind, ids, title){
  if (!ids.length) return;
  newSession(kind, ids, title); ui.view = "quiz"; render();
}
function submit(q){
  const s = store.session;
  if (s.checked[q.id]) return;
  const ev = evaluate(q);
  s.checked[q.id] = true;
  if (s.kind === "practice") store.answers[q.id] = { ok: ev.ok && !s.revealed[q.id], consulted: !!s.revealed[q.id], ts: Date.now() };
  persist(); render();
}
function next(){
  const s = store.session, q = curQ();
  if (s.kind === "sim" && q.tipo === "tab" && !s.checked[q.id] && getResp(q).some(v => v.trim() !== "")) s.checked[q.id] = true;
  s.idx++;
  if (s.idx >= s.ids.length) finish();
  persist(); render();
}
function finish(){
  const s = store.session;
  if (s.done) return;
  s.done = true;
  if (s.kind === "sim") for (const id of s.ids) if (s.checked[id]) store.answers[id] = { ok: evaluate(BY[id]).ok, ts: Date.now(), mode:"sim" };
  persist();
  ui.view = "result";
}

/* ---------- interface ---------- */
const ui = { view:"setup", st: freshSetup("practice"), msg:"", resetAsk:false };
function freshSetup(mode){
  return { mode, subs: ASSUNTOS.map(a => a.id), tipos: Object.keys(TIPOS_ROTULO).filter(t => mode !== "sim" || t !== "disc"),
    niveis:[1,2,3], onlyNew:false, onlyFav:false, onlyWrong:false, shuffle:true, count: mode === "sim" ? "prova" : "20" };
}
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

function optionList(q){
  const s = store.session, r = getResp(q), checked = !!s.checked[q.id];
  const showFb = s.kind === "practice" && (checked || s.revealed[q.id]);
  const p = perm(q.id, q.alts.length);
  return p.map((orig, d) => {
    let cls = "";
    if (showFb){ if (orig === q.correta) cls = "ok"; else if (r === d) cls = "bad"; }
    else if (r === d) cls = "sel";
    return `<label class="alt ${cls}"><input type="radio" name="q-${esc(q.id)}" data-act="pick" data-q="${q.id}" data-v="${d}" ${r === d ? "checked" : ""} ${checked ? "disabled" : ""}><span class="let">${LET[d]})</span><span>${esc(q.alts[orig])}</span></label>`;
  }).join("");
}
function bodyHTML(q){
  const s = store.session, r = getResp(q), checked = !!s.checked[q.id], rev = !!s.revealed[q.id];
  const prac = s.kind === "practice";
  const showFb = prac && (checked || rev);
  switch (q.tipo){
    case "mc": return `<p class="enun">${esc(q.enun)}</p>` + optionList(q);
    case "ac": return `<p class="enun">Julgue as duas afirmações.</p>
      <div class="item"><strong>I.</strong> ${esc(q.afirm)}</div><div class="item"><strong>II.</strong> ${esc(q.just)}</div>` + optionList(q);
    case "vf": return `<p class="enun">${esc(q.enun)}</p>` + q.itens.map((it, i) => {
        const fb = showFb ? `<div class="fb ${r[i] === it.v ? "ok" : "bad"}">${r[i] === it.v ? "✓ Correto." : "✗ Incorreto."} ${esc(it.e)}</div>` : "";
        return `<div class="item"><p>${esc(it.t)}</p><div class="tf">
          <button data-act="vf" data-q="${q.id}" data-i="${i}" data-v="1" class="${r[i] === true ? "on" : ""}" ${checked ? "disabled" : ""}>Verdadeiro</button>
          <button data-act="vf" data-q="${q.id}" data-i="${i}" data-v="0" class="${r[i] === false ? "on" : ""}" ${checked ? "disabled" : ""}>Falso</button></div>${fb}</div>`;
      }).join("");
    case "assoc": {
      const p = perm(q.id, q.pares.length);
      return `<p class="enun">${esc(q.enun)}</p>` + q.pares.map(([a], i) => {
        const ok = showFb && r[i] !== null && p[r[i]] === i;
        const opts = p.map((pi, d) => `<option value="${d}" ${r[i] === d ? "selected" : ""}>${esc(q.pares[pi][1])}</option>`).join("");
        const fb = showFb ? `<div class="fb ${ok ? "ok" : "bad"}">${ok ? "✓ Correto." : "✗ Correto: " + esc(q.pares[i][1])}</div>` : "";
        return `<div class="item"><p><strong>${esc(a)}</strong></p><select data-act="assoc" data-q="${q.id}" data-i="${i}" ${checked ? "disabled" : ""}><option value="">Escolha…</option>${opts}</select>${fb}</div>`;
      }).join("");
    }
    case "lac": {
      const parts = q.enun.split(/\{(\d)\}/);
      let txt = "";
      parts.forEach((t, idx) => {
        if (idx % 2 === 0){ txt += esc(t); return; }
        const k = +t, L = q.lacunas[k], p = perm(q.id + "#" + k, L.opcoes.length);
        const opts = p.map((oi, d) => `<option value="${d}" ${r[k] === d ? "selected" : ""}>${esc(L.opcoes[oi])}</option>`).join("");
        txt += `<select data-act="lac" data-q="${q.id}" data-k="${k}" ${checked ? "disabled" : ""}><option value="">…</option>${opts}</select>`;
      });
      const ev = showFb ? evaluate(q) : null;
      const fb = showFb ? `<div class="fb ${ev.ok ? "ok" : "bad"}">${ev.ok ? "✓ Todas as lacunas corretas." : "✗ Há lacuna incorreta."}</div>` : "";
      return `<p class="enun">${txt}</p>${fb}`;
    }
    case "prat": return `<p class="enun">${esc(q.enun)}</p>` + q.etapas.map((E, i) => {
        const p = perm(q.id + "#" + i, E.alts.length);
        const opts = p.map((orig, d) => {
          let cls = "";
          if (showFb){ if (orig === E.correta) cls = "ok"; else if (r[i] === d) cls = "bad"; }
          else if (r[i] === d) cls = "sel";
          return `<label class="alt ${cls}"><input type="radio" name="p-${q.id}-${i}" data-act="step" data-q="${q.id}" data-i="${i}" data-v="${d}" ${r[i] === d ? "checked" : ""} ${checked ? "disabled" : ""}><span class="let">${LET[d]})</span><span>${esc(E.alts[orig])}</span></label>`;
        }).join("");
        const fb = showFb ? `<div class="fb ${r[i] !== null && p[r[i]] === E.correta ? "ok" : "bad"}">${esc(E.expl)}</div>` : "";
        return `<div class="step"><strong>Etapa ${i + 1}.</strong> ${esc(E.enun)}${opts}${fb}</div>`;
      }).join("");
    case "disc": {
      const marks = r.marks;
      let h = `<p class="enun">${esc(q.enun)}</p>
        <textarea data-act="texto" data-q="${q.id}" placeholder="Escreva sua resposta aqui." ${checked ? "disabled" : ""}>${esc(r.texto)}</textarea>`;
      if (prac && rev){
        h += `<div class="expl"><strong>Critérios</strong><ul>${q.criterios.map(c => `<li>${esc(c)}</li>`).join("")}</ul><strong>Modelo de resposta</strong><p>${esc(q.modelo)}</p></div>`;
        if (!checked) h += `<p class="muted" style="margin-top:10px">Marque os critérios que sua resposta atende:</p>` + q.criterios.map((c, i) =>
          `<label class="alt"><input type="checkbox" data-act="mark" data-q="${q.id}" data-i="${i}" ${marks && marks[i] ? "checked" : ""}><span>${esc(c)}</span></label>`).join("");
      }
      return h;
    }
    case "tab": {
      const m = s.marks[q.id];
      const showGab = (prac && rev) || (checked && prac);
      let h = `<p class="enun">${esc(q.enun)}</p>` + q.campos.map((c, i) =>
        `<div class="item"><label><strong>${esc(c)}</strong><input type="text" class="campo" data-act="tabtxt" data-q="${q.id}" data-i="${i}" value="${esc(r[i])}" ${checked ? "disabled" : ""}></label></div>`).join("");
      if (showGab){
        h += `<p class="muted" style="margin-top:12px">Compare com o gabarito e marque o que você acertou:</p>` + q.campos.map((c, i) =>
          `<div class="item"><label class="row"><input type="checkbox" data-act="tabmark" data-q="${q.id}" data-i="${i}" ${m && m[i] ? "checked" : ""} ${checked ? "disabled" : ""}><span><strong>${esc(c)}${/[?:]$/.test(c) ? "" : ":"}</strong> ${esc(q.gab[i])}</span></label></div>`).join("");
      }
      return h;
    }
  }
}

function viewSetup(){
  const st = ui.st, isSim = st.mode === "sim";
  const pool = poolFor(st).length;
  const total = Object.keys(store.answers).filter(id => BY[id]).length;
  const correct = Object.keys(store.answers).filter(id => BY[id] && store.answers[id].ok).length;
  const resume = store.session && !store.session.done ? `<p><button class="btn" data-act="resume">Continuar onde parei (${store.session.idx + 1}/${store.session.ids.length})</button></p>` : "";
  const tipos = Object.keys(TIPOS_ROTULO).filter(t => !(isSim && t === "disc"));
  return `
  <div class="box">
    <div class="row" style="justify-content:space-between">
      <div><button class="btn ${isSim ? "" : "pri"}" data-act="mode" data-mode="practice">Questões</button>
      <button class="btn ${isSim ? "pri" : ""}" data-act="mode" data-mode="sim">Simulado</button></div>
    </div>
    <p class="muted" style="margin-top:10px">${isSim ? "No simulado, as respostas e o gabarito só aparecem no final." : "Você vê a resolução logo depois de cada resposta."}</p>
    <p class="muted">A VA terá V ou F sobre todo o conteúdo e questões abertas: altura da edificação, classificação pela Portaria 476/2025 e classificação geral (ocupação, carga, risco, altura, área, medidas, hidrante, brigada e extintores da central de GLP). Nas abertas, escreva sua resposta, veja o gabarito e marque o que acertou.</p>
  </div>
  ${resume}
  ${ui.msg ? `<p class="msg">${esc(ui.msg)}</p>` : ""}
  <div class="box grp">
    <h2 style="margin-top:0">Assuntos</h2>
    ${ASSUNTOS.map(a => `<label><input type="checkbox" data-act="sf" data-f="subs" data-v="${a.id}" ${st.subs.includes(a.id) ? "checked" : ""}>${esc(a.nome)}</label>`).join("")}
  </div>
  <div class="box grp inline">
    <h2 style="margin-top:0">Tipos</h2>
    ${tipos.map(t => `<label><input type="checkbox" data-act="sf" data-f="tipos" data-v="${t}" ${st.tipos.includes(t) ? "checked" : ""}>${esc(TIPOS_ROTULO[t])}</label>`).join("")}
    <h2>Dificuldade</h2>
    ${[1,2,3].map(n => `<label><input type="checkbox" data-act="sf" data-f="niveis" data-v="${n}" ${st.niveis.includes(n) ? "checked" : ""}>${NIVEIS[n]}</label>`).join("")}
  </div>
  <div class="box grp">
    <h2 style="margin-top:0">Mostrar só</h2>
    <label><input type="checkbox" data-act="sf" data-f="onlyNew" ${st.onlyNew ? "checked" : ""}>Não respondidas</label>
    <label><input type="checkbox" data-act="sf" data-f="onlyWrong" ${st.onlyWrong ? "checked" : ""}>Erradas antes</label>
    <label><input type="checkbox" data-act="sf" data-f="onlyFav" ${st.onlyFav ? "checked" : ""}>Favoritas</label>
    ${isSim
      ? `<h2>Tamanho do simulado</h2>${["prova","10","20","30","all"].map(c => `<label><input type="radio" name="cnt" data-act="sf" data-f="count" data-v="${c}" ${st.count === c ? "checked" : ""}>${c === "prova" ? "Prova modelo (8 blocos de V ou F + altura + Portaria 476 + classificação geral)" : c === "all" ? "Todas disponíveis" : c + " questões"}</label>`).join("")}`
      : `<label style="margin-top:8px"><input type="checkbox" data-act="sf" data-f="shuffle" ${st.shuffle ? "checked" : ""}>Embaralhar a ordem</label>`}
  </div>
  <div class="row">
    <button class="btn pri" data-act="start" ${pool || (isSim && st.count === "prova") ? "" : "disabled"}>${isSim && st.count === "prova" ? "Começar prova modelo (20 questões)" : `Começar (${pool} questões)`}</button>
  </div>
  <p class="muted" style="margin-top:22px">Respondidas: ${total} de ${QUESTOES.length}${total ? ` · acerto ${pct(correct, total)}%` : ""}.
    ${ui.resetAsk
      ? `Tem certeza? <button class="btn link danger" data-act="resetOk">Sim, apagar</button> <button class="btn link" data-act="resetNo">Cancelar</button>`
      : `<button class="btn link" data-act="resetAsk">Apagar meu progresso</button>`}</p>`;
}

function viewQuiz(){
  const s = store.session;
  const q = curQ(), n = s.ids.length, cur = s.idx + 1;
  const prac = s.kind === "practice";
  const checked = !!s.checked[q.id], rev = !!s.revealed[q.id];
  const fav = store.fav.includes(q.id);
  const isLast = s.idx === n - 1;
  let acts = "";
  if (!checked){
    if (q.tipo === "disc"){
      const canSubmit = rev && Array.isArray(getResp(q).marks);
      acts += `<button class="btn pri" data-act="submit" data-q="${q.id}" ${canSubmit ? "" : "disabled"}>Registrar autoavaliação</button>`;
      if (prac && !rev) acts += `<button class="btn" data-act="reveal" data-q="${q.id}">Ver critérios e modelo</button>`;
    } else if (q.tipo === "tab"){
      if (prac && !rev) acts += `<button class="btn" data-act="reveal" data-q="${q.id}">Ver gabarito</button>`;
      if (prac && rev) acts += `<button class="btn pri" data-act="submit" data-q="${q.id}">Registrar conferência</button>`;
    } else {
      acts += `<button class="btn pri" data-act="submit" data-q="${q.id}" ${complete(q) ? "" : "disabled"}>Responder</button>`;
      if (prac && !rev) acts += `<button class="btn" data-act="reveal" data-q="${q.id}">Ver resolução</button>`;
    }
  }
  acts += `<button class="btn" data-act="next">${isLast ? "Finalizar" : (checked ? "Próxima" : "Pular")}</button>`;
  acts += `<button class="btn link" data-act="finish">Encerrar agora</button>`;
  const showExpl = prac && (checked || rev) && q.tipo !== "disc" && q.tipo !== "tab";
  const showTabExpl = prac && rev && q.tipo === "tab";
  let status = "";
  if (checked && prac){
    const ok = store.answers[q.id] && store.answers[q.id].ok;
    const vfInfo = q.tipo === "vf" ? ` ${evaluate(q).parts.filter(Boolean).length} de ${q.itens.length} itens certos.` : "";
    status = `<p class="fb ${ok ? "ok" : "bad"}">${ok ? "Acertou." : (rev ? "Resolução consultada: não conta como acerto." : "Errou.")}${vfInfo}</p>`;
  } else if (checked){
    status = `<p class="muted">Resposta registrada.</p>`;
  }
  return `
  <p class="muted"><span class="tag">${esc(SUBS[q.sub].nome)}</span><span class="tag">${esc(TIPOS_ROTULO[q.tipo])}</span><span class="tag">${esc(NIVEIS[q.nivel])}</span>${q.origem ? `<span class="tag">${esc(q.origem)}</span>` : ""}</p>
  <div class="row" style="justify-content:space-between"><span class="muted">${s.kind === "sim" ? "Simulado" : "Questões"} · ${cur} de ${n}</span>
    <button class="btn link" data-act="fav" data-q="${q.id}">${fav ? "★ Favorita" : "☆ Favoritar"}</button></div>
  <div class="bar"><i style="width:${pct(s.idx, n)}%"></i></div>
  <div class="box">
    ${bodyHTML(q)}
    ${showExpl ? explHTML(q) : ""}
    ${showTabExpl ? explHTML(q) : ""}
    ${status}
    <div class="actions">${acts}</div>
  </div>`;
}
function complete(q){
  const r = getResp(q);
  if (q.tipo === "mc" || q.tipo === "ac") return r !== null;
  return r.every(x => x !== null);
}

function viewResult(){
  const s = store.session;
  const checkedIds = s.ids.filter(id => s.checked[id]);
  const oks = checkedIds.filter(id => evaluate(BY[id]).ok);
  const wrong = checkedIds.filter(id => !evaluate(BY[id]).ok);
  const bySub = ASSUNTOS.map(a => {
    const ids = s.ids.filter(id => BY[id].sub === a.id); if (!ids.length) return "";
    const c = ids.filter(id => s.checked[id]), ok = c.filter(id => evaluate(BY[id]).ok);
    return `<tr><td>${esc(a.nome)}</td><td>${ok.length}/${c.length}</td><td>${pct(ok.length, c.length)}%</td></tr>`;
  }).join("");
  const rows = s.ids.map((id, i) => {
    const q = BY[id];
    const st = !s.checked[id] ? `<span class="st-no">não respondida</span>` : evaluate(q).ok ? `<span class="st-ok">certa</span>` : `<span class="st-bad">errada</span>`;
    const txt = (q.enun || q.afirm).replace(/\{\d\}/g, "___");
    let extra = "";
    if (q.tipo === "tab" && s.kind === "sim"){
      const m = s.marks[id] || [];
      extra = `<p class="muted">Sua resposta: ${q.campos.map((c, k) => `<br><b>${esc(c)}</b> ${esc((getResp(q)[k] || "—"))}`).join("")}</p>
        <p class="muted">Marque o que você acertou:</p>` + q.campos.map((c, k) =>
          `<label class="row"><input type="checkbox" data-act="tabmark" data-q="${id}" data-i="${k}" ${m[k] ? "checked" : ""}><span>${esc(c)}</span></label>`).join("");
    }
    return `<details><summary>${i + 1}. ${esc(txt.slice(0, 120))}${txt.length > 120 ? "…" : ""} — ${st}</summary>
      <div style="margin-top:8px">${gabaritoHTML(q)}${explHTML(q)}${extra}</div></details>`;
  }).join("");
  const scored = checkedIds.length;
  const vfIds = checkedIds.filter(id => BY[id].tipo === "vf");
  const vfTot = vfIds.reduce((n, id) => n + BY[id].itens.length, 0);
  const vfOk = vfIds.reduce((n, id) => n + evaluate(BY[id]).parts.filter(Boolean).length, 0);
  return `
  <h2 style="margin-top:0">Resultado: ${pct(oks.length, scored)}% de acerto</h2>
  <p class="muted">${esc(s.title)} · ${oks.length} certas, ${wrong.length} erradas, ${s.ids.length - scored} não respondidas.</p>
  ${vfTot ? `<p><strong>Itens de V ou F:</strong> ${vfOk} de ${vfTot} certos (${pct(vfOk, vfTot)}%). Um bloco só conta como certo se todos os itens estiverem certos.</p>` : ""}
  ${s.kind === "sim" ? `<p class="muted">Confira cada exercício de tabela com o gabarito, marcando os campos que você acertou. Os campos não marcados contam como erro.</p>` : ""}
  <div class="box"><table><thead><tr><th>Assunto</th><th>Certas</th><th>%</th></tr></thead><tbody>${bySub}</tbody></table></div>
  <h2>Questões</h2>
  ${rows}
  <div class="row" style="margin-top:18px">
    ${wrong.length ? `<button class="btn pri" data-act="revisar" data-ids="${esc(wrong.join(","))}">Revisar as ${wrong.length} erradas</button>` : ""}
    <button class="btn" data-act="retry">Refazer estas questões</button>
    <button class="btn" data-act="home">Voltar ao início</button>
  </div>`;
}

function render(){
  let html;
  if (ui.view === "quiz" && store.session && !store.session.done) html = viewQuiz();
  else if (ui.view === "result" && store.session) html = viewResult();
  else { ui.view = "setup"; html = viewSetup(); }
  $("#app").innerHTML = html;
}

/* ---------- eventos ---------- */
function act(a, el){
  switch (a){
    case "mode": ui.st = freshSetup(el.dataset.mode); ui.msg = ""; render(); break;
    case "sf": {
      const st = ui.st, f = el.dataset.f, v = el.dataset.v;
      if (["onlyNew","onlyFav","onlyWrong","shuffle"].includes(f)) st[f] = el.checked;
      else if (f === "count") st.count = v;
      else {
        const val = f === "niveis" ? +v : v, arr = st[f], i = arr.indexOf(val);
        if (el.checked && i < 0) arr.push(val);
        if (!el.checked && i >= 0) arr.splice(i, 1);
      }
      render(); break;
    }
    case "start": startFromSetup(ui.st); break;
    case "resume": ui.view = "quiz"; render(); break;
    case "home": ui.view = "setup"; render(); break;
    case "pick": setResp(BY[el.dataset.q], +el.dataset.v); render(); break;
    case "step": { const q = BY[el.dataset.q], i = +el.dataset.i, r = getResp(q).slice(); r[i] = +el.dataset.v; setResp(q, r); render(); break; }
    case "vf": { const q = BY[el.dataset.q], i = +el.dataset.i, r = getResp(q).slice(); r[i] = el.dataset.v === "1"; setResp(q, r); render(); break; }
    case "assoc": case "lac": {
      const q = BY[el.dataset.q], i = +(el.dataset.i ?? el.dataset.k), r = getResp(q).slice();
      r[i] = el.value === "" ? null : +el.value; setResp(q, r); render(); break;
    }
    case "texto": getResp(BY[el.dataset.q]).texto = el.value; persist(); break;
    case "tabtxt": { const q = BY[el.dataset.q], r = getResp(q).slice(); r[+el.dataset.i] = el.value; setResp(q, r); break; }
    case "mark": {
      const q = BY[el.dataset.q], r = getResp(q);
      const marks = r.marks ? r.marks.slice() : q.criterios.map(() => false);
      marks[+el.dataset.i] = el.checked; r.marks = marks; persist(); render(); break;
    }
    case "tabmark": {
      const s = store.session, q = BY[el.dataset.q];
      const m = (s.marks[q.id] || q.campos.map(() => false)).slice();
      m[+el.dataset.i] = el.checked; s.marks[q.id] = m;
      if (s.kind === "sim" || !s.checked[q.id]) {
        if (s.kind === "sim") store.answers[q.id] = { ok: evaluate(q).ok, ts: Date.now(), mode:"sim" };
      }
      persist(); render(); break;
    }
    case "reveal": store.session.revealed[el.dataset.q] = true; if (BY[el.dataset.q].tipo === "tab") store.session.marks[el.dataset.q] = store.session.marks[el.dataset.q] || BY[el.dataset.q].campos.map(() => false); persist(); render(); break;
    case "submit": submit(BY[el.dataset.q]); break;
    case "next": next(); break;
    case "finish": finish(); render(); break;
    case "fav": {
      const id = el.dataset.q, i = store.fav.indexOf(id);
      if (i < 0) store.fav.push(id); else store.fav.splice(i, 1);
      persist(); render(); break;
    }
    case "revisar": startFromIds("practice", el.dataset.ids.split(",").filter(Boolean), "Revisão das erradas"); break;
    case "retry": { const s = store.session; startFromIds(s.kind, s.ids.slice(), s.title); break; }
    case "resetAsk": ui.resetAsk = true; render(); break;
    case "resetNo": ui.resetAsk = false; render(); break;
    case "resetOk": store = { answers:{}, fav:[], session:null }; persist(); ui.resetAsk = false; ui.view = "setup"; render(); break;
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || ["INPUT","SELECT","TEXTAREA"].includes(el.tagName)) return;
  act(el.dataset.act, el);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type === "text")) return;
  act(el.dataset.act, el);
});
document.addEventListener("input", e => {
  const el = e.target.closest('[data-act="texto"], [data-act="tabtxt"]');
  if (el) act(el.dataset.act, el);
});
render();
})();
</script>
</body>
</html>
