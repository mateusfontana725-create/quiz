<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questões de SCI – Fontana</title>
<meta name="description" content="Questões objetivas e de V ou F sobre o Sistema de Controle de Incidentes (SCI), com explicação em cada resposta.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1b1e23;--mut:#5f6772;--line:#dde1e6;--acc:#1f5fa8;--accsoft:#e8f0fa;--ok:#1b7f3b;--oksoft:#e6f4ea;--bad:#b3261e;--badsoft:#fdecea;--warn:#8a5a00;--warnsoft:#fff4de;--r:12px}
@media (prefers-color-scheme: dark){
  :root{--bg:#121417;--card:#1b1f24;--txt:#eceef1;--mut:#a3abb5;--line:#323840;--acc:#7fb2ee;--accsoft:#1e2d40;--ok:#6fcf8a;--oksoft:#16301f;--bad:#ff8a80;--badsoft:#3a1c1a;--warn:#f0c36a;--warnsoft:#33290f}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:740px;margin:0 auto;padding:18px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme: dark){.btn.pri{color:#0d1722}}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--mut)}
.chip b{color:var(--txt)}
.chip.rev{background:var(--warnsoft);border-color:transparent;color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
details.map{margin-bottom:14px}
details.map summary{cursor:pointer;color:var(--mut);font-size:14px;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.cell{border:1px solid var(--line);background:var(--card);border-radius:8px;height:34px;font-size:13px}
.cell.ok{background:var(--oksoft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.tag.t{background:var(--accsoft);border-color:transparent;color:var(--acc)}
.q{font-size:19px;line-height:1.45;margin:6px 0 16px;font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.opt:hover:not(.done){border-color:var(--acc);background:var(--accsoft)}
.opt .let{font-weight:700;min-width:22px;color:var(--mut)}
.opt .st{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.done{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}
.opt.ok .let,.opt.ok .st{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badsoft)}
.opt.bad .let,.opt.bad .st{color:var(--bad)}
.opt.dim{opacity:.55}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-weight:600;font-size:17px;padding:16px 10px;margin:0}
.vf .opt .st{margin-left:8px;padding:0}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:6px solid var(--line)}
.fb.ok{background:var(--oksoft);border-left-color:var(--ok)}
.fb.bad{background:var(--badsoft);border-left-color:var(--bad)}
.verdict{font-size:18px;font-weight:700;margin-bottom:6px}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.fb p{margin:0 0 6px}
.fb ul{margin:4px 0 0;padding-left:20px}
.fb li{margin-bottom:6px}
.fb li.mine strong{color:var(--bad)}
.muted{color:var(--mut)}
.dica{margin-top:12px;padding:9px 12px;background:var(--warnsoft);color:var(--warn);border-radius:8px;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.hint{margin-top:18px;font-size:13px;color:var(--mut);text-align:center}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-size:56px;font-weight:800;line-height:1}
.score p{margin:6px 0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0;font-size:14px}
.row .track{grid-column:1 / -1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.row .track i{display:block;height:100%;background:var(--ok)}
.err{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.err summary{cursor:pointer;font-weight:600}
.err .ans{color:var(--ok);font-weight:600;margin:8px 0 4px}
.act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
h2.sec{font-size:15px;margin:22px 0 6px}
@media (max-width:520px){.q{font-size:18px}.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap" id="top">
  <header><h1>Questões de SCI</h1><button class="btn small" id="restart" type="button">Recomeçar</button></header>
  <main id="app" aria-live="polite"></main>
  <p class="hint">Atalhos: A–D ou 1–4 respondem · V e F nas afirmações · → próxima · ← anterior</p>
</div>
<script>
const DATA = {"subs": [{"id": "orig", "n": "Origem e história"}, {"id": "aplic", "n": "Aplicabilidade e ocorrências"}, {"id": "def", "n": "Defesa Civil, SICOE e hora de ouro"}, {"id": "conc", "n": "Princípios e características"}, {"id": "staff", "n": "Comando e staff"}, {"id": "area", "n": "Instalações e áreas"}, {"id": "recu", "n": "Recursos"}, {"id": "form", "n": "Formulários e cores"}, {"id": "oper", "n": "Operação do incidente"}], "q": [{"id": "m01", "sub": "orig", "t": "mc", "q": "Qual situação levou à criação do SCI nos Estados Unidos?", "alts": ["Um terremoto que destruiu a estrutura de defesa civil americana", "Incêndios florestais na Califórnia, nos quais a falta de coordenação entre as instituições dificultou a resposta", "Uma guerra em que os militares precisavam de comando único", "Um acidente industrial com produtos perigosos"], "c": 1, "why": ["O gatilho foi o fogo, não um terremoto.", null, "A origem não é militar. Veio da gestão de incêndios civis.", "Esse tipo de acidente é uma aplicação do SCI, não a sua origem."], "e": "O SCI nasceu nos anos 1970, depois de incêndios devastadores na Califórnia. Vários órgãos atuavam no mesmo cenário, mas cada um com seus termos, suas comunicações e suas prioridades. Isso atrapalhou a resposta. A solução foi criar um modelo comum de comando: primeiro o FIRESCOPE, com a 1ª versão do SCI.", "d": "SCI nasceu do fogo: Califórnia, anos 70."}, {"id": "m02", "sub": "orig", "t": "mc", "q": "Como o SCI chegou ao Brasil?", "alts": ["Por cooperação técnica com o serviço florestal dos EUA, ligada ao combate a incêndios florestais", "Por um decreto federal que o importou logo depois da criação nos EUA", "Por iniciativa de empresas de petróleo, que o repassaram aos bombeiros", "Por intercâmbio com um país europeu de proteção civil"], "c": 0, "why": [null, "Os decretos federais vieram muito depois, para tornar o SCI obrigatório.", "As empresas de petróleo usam o sistema (ICS ou IMS), mas não foram a porta de entrada.", "A influência veio dos EUA, pelo serviço florestal (USFS)."], "e": "O caminho foi o fogo: o serviço florestal dos EUA apoiou o Ibama por cooperação técnica, e bombeiros militares passaram a ser treinados em brigadas Hotshot Crew. Os conceitos do SCI foram entrando nas instituições aos poucos. Só nos anos 2000 o sistema ganhou nomes próprios e se espalhou.", "d": "Brasil: USFS + Ibama + incêndio florestal."}, {"id": "m03", "sub": "orig", "t": "mc", "q": "Por que o mesmo modelo aparece com nomes diferentes (SCI, SICOE, SCO, ICS)?", "alts": ["Porque são modelos diferentes, com regras incompatíveis", "Porque só o SCI é oficial e os outros nomes foram extintos", "Porque cada instituição adotou a sua própria denominação para o mesmo modelo", "Porque cada nome se aplica a um tipo diferente de incidente"], "c": 2, "why": ["São o mesmo modelo, com a mesma base filosófica.", "Todos continuam em uso: SICOE (SP e PR), SCO (Defesa Civil), ICS ou IMS (petróleo e gás).", null, "O nome não muda o tipo de incidente. Todos servem a qualquer incidente."], "e": "SCI (CBMDF e SENASP), SICOE (CBMs de São Paulo e do Paraná), SCO (Defesa Civil nacional e Santa Catarina) e ICS ou IMS (setor de petróleo e gás) são denominações do mesmo modelo de comando. Muda a sigla, não o sistema.", "d": "Muda a sigla, não o sistema."}, {"id": "m04", "sub": "aplic", "t": "mc", "q": "Qual destes incidentes se encaixa na aplicabilidade do SCI segundo o curso?", "alts": ["Ocorrência de trânsito simples, sem vítimas e sem risco", "Rompimento de barragem", "Atendimento de rotina a um único paciente em casa", "Fiscalização de rotina em edificações"], "c": 1, "why": ["Não exige várias instituições nem estrutura de comando.", null, "É uma ocorrência rotineira, resolvida com recursos próprios.", "É atividade administrativa, não um incidente."], "e": "A lista de aplicabilidade do curso reúne incidentes grandes ou complexos: produtos perigosos, rompimento de barragens, inundações, deslizamentos, explosões, acidentes de transporte, incêndios florestais fora de controle e até pânico em eventos planejados. O ponto em comum é a necessidade de coordenar muitas pessoas e instituições.", "d": "SCI é para o que é grande, complexo ou multi-instituição."}, {"id": "m05", "sub": "aplic", "t": "mc", "q": "O que mais caracteriza os incidentes em que o SCI faz diferença?", "alts": ["Acontecem sempre em área rural", "Envolvem sempre fogo", "Envolvem várias instituições e muitos recursos, exigindo coordenação", "Têm apenas uma equipe atuando"], "c": 2, "why": ["Aplicam-se a qualquer lugar, urbano ou rural.", "A lista inclui inundações, explosões, atentados, fugas em presídios e muitos outros.", null, "Com uma só equipe o comando é simples. O SCI faz diferença quando há muitos atores."], "e": "Na lista de aplicabilidade do curso, o SCI vale para qualquer tipo de incidente. Ele ajuda mais quando há várias instituições e muitos recursos, porque proporciona a interação entre as instituições e o gerenciamento correto dos recursos.", "d": "Muitas instituições + muitos recursos = SCI."}, {"id": "m06", "sub": "def", "t": "mc", "q": "Qual é a sequência das 4 fases de atuação da Defesa Civil?", "alts": ["Preparação, prevenção, resposta e reconstrução", "Prevenção, resposta, preparação e reconstrução", "Prevenção, preparação, resposta e reconstrução", "Resposta, reconstrução, prevenção e preparação"], "c": 2, "why": ["Primeiro se previne, depois se prepara. A ordem estava trocada.", "A preparação (treinos, planos) vem antes da resposta, e não depois.", null, "Começa na prevenção e termina na reconstrução."], "e": "A administração de desastres atua em quatro fases: prevenção (evitar ou minimizar acidentes e danos), preparação (capacitação, simulados e planos de contingência), resposta (socorro à comunidade e redução dos danos) e reconstrução (retorno à normalidade).", "d": "P-P-R-R: Prevenção, Preparação, Resposta, Reconstrução."}, {"id": "m07", "sub": "def", "t": "mc", "q": "Em qual fase da Defesa Civil a COMDEC mobiliza o SINDEC e a ação pode escalar para o estado e a União?", "alts": ["Resposta", "Prevenção", "Preparação", "Reconstrução"], "c": 0, "why": [null, "Na prevenção se evitam ou se reduzem danos, sem mobilizar o sistema.", "A preparação capacita e treina antes do evento.", "A reconstrução é o retorno à normalidade, depois do socorro."], "e": "Na fase de resposta, a ação parte da base municipal (a COMDEC), que aciona o SINDEC. Se o município não dá conta, a mobilização escala para as esferas estadual e federal.", "d": "Resposta = socorro: começa na COMDEC e sobe."}, {"id": "m08", "sub": "def", "t": "mc", "q": "Quais são as prioridades do SICOE, na ordem?", "alts": ["Propriedades, vidas, meio ambiente e estabilizar o evento", "Vidas, estabilizar o evento, sistemas essenciais e meio ambiente, e propriedades", "Estabilizar o evento, vidas, propriedades e meio ambiente", "Meio ambiente, propriedades, vidas e estabilizar o evento"], "c": 1, "why": ["Propriedade é a última prioridade, não a primeira.", null, "A vida vem antes da estabilização do evento.", "O meio ambiente vem em terceiro lugar, junto com os sistemas essenciais."], "e": "A ordem é: 1º preservar vidas; 2º estabilizar o evento (impedir o agravamento e novos riscos); 3º preservar sistemas essenciais e o meio ambiente; 4º proteger propriedades.", "d": "Gente primeiro, bens por último."}, {"id": "m09", "sub": "def", "t": "mc", "q": "A que se refere a hora de ouro (Golden Hour)?", "alts": ["Ao tempo máximo para elaborar o PAI", "Ao período máximo em que o CI pode ficar no comando", "Ao atendimento a trauma: chegar ao pronto-socorro em até 1 hora aumenta muito a chance de sobreviver", "Ao prazo para desmobilizar os recursos"], "c": 2, "why": ["O PAI não tem relação com a hora de ouro.", "Não há esse limite associado à hora de ouro.", null, "A desmobilização é decidida pelo CI, e não por esse prazo."], "e": "Hora de ouro é o conceito de que, no atendimento a trauma, levar a vítima ao pronto-socorro em até 1 hora garante até 60% de chance de sobrevivência. Depois da primeira hora, cada minuto de atraso reduz as chances. Por isso o fator tempo é crítico em todas as fases do SICOE.", "d": "1 hora, até 60%."}, {"id": "m10", "sub": "def", "t": "mc", "q": "O que diferencia o Nível III dos níveis I e II no SICOE?", "alts": ["É o nível resolvido só com recursos do próprio local", "É o nível que não exige estrutura de comando", "É desastre, com Comando Unificado de vários órgãos do SINDEC", "É o nível exclusivo de incêndios florestais"], "c": 2, "why": ["Isso descreve o Nível I (equipe interna, recursos próprios).", "Todos os níveis usam a mesma estrutura básica, que é escalável.", null, "O nível indica a dimensão do evento, e não o tipo."], "e": "Nível I: equipe interna do local, com recursos próprios. Nível II: exige equipe externa e acionamento do SICOE. Nível III: desastre, com Comando Unificado de múltiplos órgãos do SINDEC. Os procedimentos básicos são os mesmos nos três níveis, e é isso que torna o SICOE escalável.", "d": "I = local, II = ajuda de fora, III = desastre."}, {"id": "m11", "sub": "conc", "t": "mc", "q": "Quais são as três grandes finalidades do SCI?", "alts": ["Rapidez, economia e visibilidade na imprensa", "Hierarquia, disciplina e responsabilização", "Padronização de uniformes, rádios e viaturas", "Segurança das equipes, objetivos táticos definidos e uso eficiente dos recursos"], "c": 3, "why": ["A imprensa não é finalidade do SCI. O foco é segurança, objetivos e recursos.", "São características da corporação, mas não as finalidades do SCI.", "A padronização do SCI é de termos, funções e processos, não de equipamentos.", null], "e": "O SCI busca garantir três pontos: segurança das equipes e demais envolvidos, alcance dos objetivos táticos previamente estabelecidos e uso eficiente e eficaz dos recursos (humanos, materiais, financeiros, tecnológicos e de informação).", "d": "Segurança, objetivos, eficiência."}, {"id": "m12", "sub": "conc", "t": "mc", "q": "Em qual categoria das 14 características ficam o estabelecimento e a transferência de comando, a cadeia e unidade de comando e o comando unificado?", "alts": ["Planejamento", "Comando", "Profissionalismo", "Instalações e Recursos"], "c": 1, "why": ["Planejamento reúne objetivos, PAI, organização modular e amplitude de controle.", null, "Profissionalismo reúne responsabilização, despacho e mobilização.", "Essa categoria reúne instalações do incidente e gerenciamento de recursos."], "e": "As 14 características do NIMS/SCI são agrupadas em 6 categorias: Padronização, Comando, Planejamento, Instalações e Recursos, Gerenciamento de Informações e Comunicações, e Profissionalismo. As três características de comando (transferência, cadeia e unidade, comando unificado) ficam na categoria Comando.", "d": "6 categorias: a de Comando tem 3 características."}, {"id": "m13", "sub": "conc", "t": "mc", "q": "Qual característica diz que a estrutura cresce e diminui conforme a necessidade, e que a forma segue a função?", "alts": ["Comando unificado", "Amplitude de controle", "Cadeia de comando", "Organização modular"], "c": 3, "why": ["Trata de atuação conjunta de várias instituições, e não do tamanho da estrutura.", "Define quantos subordinados cada supervisor comanda.", "Define a linha de autoridade, sem tratar do crescimento da estrutura.", null], "e": "Na organização modular só se ativam as funções necessárias, e cada uma tem um responsável. A estrutura se expande quando um supervisor passa de 7 subordinados (criam-se equipes, divisões, grupos ou seções) e é desmobilizada quando os objetivos são atingidos.", "d": "Módulos: liga o que precisa, desliga o que acabou."}, {"id": "m14", "sub": "conc", "t": "mc", "q": "Qual é a amplitude de controle ideal no SCI?", "alts": ["5 subordinados por supervisor, com variação de 3 a 7", "2 subordinados por supervisor", "10 subordinados por supervisor", "Sem limite fixo"], "c": 0, "why": [null, "Menos de 3 é pouco. O mínimo recomendado é 3.", "Acima de 7 o supervisor perde o controle. A estrutura deve ser expandida.", "O limite existe, e monitorá-lo é responsabilidade do CI."], "e": "A amplitude de controle no SCI é de 3 (mínimo), 5 (ideal) e 7 (máximo) subordinados por supervisor. Se passa de 7, expande-se a estrutura. Se a relação cai abaixo de 3, os elementos são desmobilizados. Quem monitora isso é o Comandante do Incidente. No SICOE o limite é de 30.", "d": "3 – 5 – 7."}, {"id": "m15", "sub": "conc", "t": "mc", "q": "O que significa unidade de comando?", "alts": ["Existe um único comandante, sem staff", "Cada pessoa tem apenas um supervisor, a quem se reporta", "Todas as instituições obedecem a um único órgão", "O comandante atua sozinho, sem delegar"], "c": 1, "why": ["O CI pode ter staff de comando e de seções.", null, "Isso é o oposto do comando unificado, em que as agências mantêm a autoridade.", "O SCI incentiva delegar funções conforme o incidente cresce."], "e": "Unidade de comando: cada indivíduo que participa das operações tem um supervisor designado na cena. Já a cadeia de comando é a linha hierárquica de autoridade, com comunicação com quem está imediatamente acima ou abaixo.", "d": "Um chefe só, para cada pessoa."}, {"id": "m16", "sub": "conc", "t": "mc", "q": "O que a terminologia comum evita durante uma crise?", "alts": ["Perda de tempo e mal-entendidos entre instituições que usam termos diferentes", "A necessidade de formulários", "A atuação de várias instituições", "O uso de rádio"], "c": 0, "why": [null, "Os formulários continuam sendo usados.", "O objetivo é permitir que várias atuem juntas, e não evitá-las.", "A terminologia comum melhora o uso do rádio, mas não o elimina."], "e": "Em uma crise não há tempo para aprender termos novos. Por isso funções, cargos, instalações e recursos recebem nomes padronizados, e instituições diferentes se entendem de forma clara e concisa.", "d": "Mesmo nome para a mesma coisa, em qualquer órgão."}, {"id": "m17", "sub": "staff", "t": "mc", "q": "Qual é a diferença básica entre Staff de Comando e Staff Geral?", "alts": ["O Staff de Comando é operacional e o Staff Geral é administrativo", "O Staff Geral assessora o CI e o Staff de Comando executa as operações", "O Staff de Comando assessora o CI (Oficiais). O Staff Geral conduz as seções funcionais (Chefes)", "Não há diferença: os dois usam os mesmos cargos"], "c": 2, "why": ["As duas coisas estão invertidas: o Staff Geral inclui Operações.", "Quem executa a resposta é a seção de Operações, do Staff Geral.", null, "Os títulos são diferentes: Oficial no Staff de Comando e Chefe no Staff Geral."], "e": "O Staff de Comando tem 3 funções de assessoria ao CI (Segurança, Informação Pública e Ligação), e os integrantes são chamados de Oficiais. O Staff Geral tem 4 seções funcionais (Planejamento, Operações, Logística e Administração/Finanças), e os integrantes são chamados de Chefes.", "d": "Comando: 3 Oficiais. Geral: 4 Chefes."}, {"id": "m18", "sub": "staff", "t": "mc", "q": "Quais são os Oficiais do Staff de Comando?", "alts": ["Planejamento, Operações e Logística", "Segurança, Operações e Finanças", "Informação Pública, Logística e Ligação", "Segurança, Informação Pública e Ligação"], "c": 3, "why": ["São seções do Staff Geral, lideradas por Chefes.", "Operações e Finanças são do Staff Geral.", "Logística é seção do Staff Geral.", null], "e": "O Staff de Comando tem três funções: Oficial de Segurança, Oficial de Informação Pública e Oficial de Ligação. Dependendo do incidente, o CI pode exercer essas funções ou delegá-las.", "d": "Segurança, Informação, Ligação."}, {"id": "m19", "sub": "staff", "t": "mc", "q": "Quais são as quatro seções do Staff Geral?", "alts": ["Segurança, Informação Pública, Ligação e Operações", "Comando, Planejamento, Logística e Finanças", "Operações, Logística, Comunicação e Imprensa", "Planejamento, Operações, Logística e Administração/Finanças"], "c": 3, "why": ["As três primeiras são do Staff de Comando.", "O comando é uma função própria, fora das seções.", "Comunicação e imprensa não são seções do Staff Geral.", null], "e": "O Staff Geral divide-se em Planejamento (informação, PAI, controle de recursos), Operações (execução da resposta), Logística (instalações, serviços e materiais) e Administração/Finanças (gastos, contratos e documentação).", "d": "P-O-L-A: Planejamento, Operações, Logística, Administração."}, {"id": "m20", "sub": "staff", "t": "mc", "q": "Quem fala oficialmente com a imprensa em nome do incidente?", "alts": ["Oficial de Informação Pública", "Qualquer bombeiro presente na cena", "Oficial de Ligação", "Chefe de Operações"], "c": 0, "why": [null, "Só o OIP, para evitar informações desencontradas.", "Ele integra as instituições, e não fala com a imprensa.", "Ele conduz a execução da resposta, e não a comunicação pública."], "e": "O Oficial de Informação Pública é o único porta-voz do incidente. Ele centraliza as informações, responde à imprensa e ao público, e toda a informação precisa ser aprovada pelo CI.", "d": "Uma só voz: o OIP."}, {"id": "m21", "sub": "staff", "t": "mc", "q": "Qual seção elabora o PAI e mantém o controle da situação e dos recursos?", "alts": ["Operações", "Logística", "Administração/Finanças", "Planejamento"], "c": 3, "why": ["Executa o PAI, mas quem o elabora é o Planejamento.", "Provê instalações, serviços e materiais.", "Controla gastos e documentação para indenizações.", null], "e": "Planejamento coleta, avalia e difunde as informações, elabora o PAI e mantém o controle dos recursos. Suas unidades são Recursos, Situação, Documentação e Desmobilização.", "d": "Plano = Planejamento."}, {"id": "m22", "sub": "staff", "t": "mc", "q": "Qual função do SCI está sempre ativa, em qualquer incidente?", "alts": ["Oficial de Segurança", "Comandante do Incidente", "Chefe de Operações", "Chefe de Planejamento"], "c": 1, "why": ["Pode ser exercida pelo CI em incidentes pequenos.", null, "Só é ativado quando a complexidade exige.", "Só é ativado conforme a necessidade."], "e": "O Comandante do Incidente é a única função que estará ativa em qualquer resposta, independentemente do tipo, tamanho, complexidade ou duração. O primeiro a chegar à cena com capacidade de resposta já age como CI, mesmo sem usar a terminologia.", "d": "Sem CI não há incidente: é a única função fixa."}, {"id": "m23", "sub": "area", "t": "mc", "q": "Como o PC é identificado?", "alts": ["Retângulo laranja com as letras PC", "Círculo amarelo com a letra P", "Quadrado vermelho com uma cruz", "Triângulo azul com as letras CI"], "c": 0, "why": [null, "O círculo amarelo é das instalações de apoio, como E, ACV e B.", "Não é o padrão do SCI.", "Não é o padrão do SCI."], "e": "O PC é sinalizado com um retângulo laranja com as letras PC em preto. As demais instalações de apoio (Área de Espera, ACV, Base, Acampamento, Helibase e Heliponto) usam círculo amarelo de 90 cm com a letra ou sigla em preto.", "d": "PC = retângulo laranja. Todo o resto = círculo amarelo."}, {"id": "m24", "sub": "area", "t": "mc", "q": "Onde deve ser instalado o PC?", "alts": ["Em local seguro, fora da zona de risco, com visão da cena e possibilidade de expansão", "O mais próximo possível do foco, para ver tudo de perto", "Na área de espera, junto com os recursos", "Qualquer local, desde que tenha sombra"], "c": 0, "why": [null, "Perto demais expõe o comando ao risco.", "A Área de Espera é uma instalação separada, com outra função.", "Há critérios: segurança, visibilidade, acesso, comunicação e expansão."], "e": "O PC deve ser seguro, ficar fora da zona de risco, ter visão integral da cena, boa comunicação, acesso e capacidade de expansão. Também precisa ficar longe de ruído e confusão. Usa-se comumente a viatura do Oficial de Área.", "d": "Seguro, longe do risco, com visão."}, {"id": "m25", "sub": "area", "t": "mc", "q": "Qual é a função da Base?", "alts": ["Coordenar e administrar as funções logísticas do incidente", "Pouso e abastecimento de helicópteros", "Triagem de vítimas", "Alimentação e repouso do pessoal"], "c": 0, "why": [null, "Isso é a helibase e o heliponto.", "Isso é a ACV.", "Isso é o Acampamento."], "e": "A Base é a instalação de onde as funções logísticas são coordenadas e administradas. É gerenciada pelo Chefe da Seção de Logística, identificada por um círculo amarelo com a letra B, e pode funcionar junto ao PC.", "d": "Base = Logística."}, {"id": "m26", "sub": "area", "t": "mc", "q": "Qual é a diferença entre helibase e heliponto?", "alts": ["Helibase: pouso e decolagem. Heliponto: estacionamento e manutenção", "Helibase: estacionamento, abastecimento e manutenção. Heliponto: pouso, decolagem e carga/descarga", "Helibase é para aeronaves de asa fixa e heliponto para helicópteros", "São a mesma instalação, com nomes diferentes"], "c": 1, "why": ["Estão invertidos.", null, "Ambas tratam de helicópteros.", "São instalações distintas, com siglas diferentes (H e H1, H2…)."], "e": "A Helibase (H) é um lugar de estacionamento, abastecimento e manutenção de helicópteros. O Heliponto (H1, H2…) é onde as aeronaves pousam, decolam e fazem carga e descarga de pessoas, equipamentos e materiais.", "d": "Heli-BASE = base de apoio. Heli-PONTO = ponto de pouso."}, {"id": "m27", "sub": "area", "t": "mc", "q": "Para que serve a Área de Concentração de Vítimas (ACV)?", "alts": ["Concentrar vítimas para triagem, estabilização e transporte ao hospital de referência", "Guardar equipamentos de resgate", "Abrigar a imprensa e os familiares", "Reunir os recursos que aguardam designação"], "c": 0, "why": [null, "A ACV é para vítimas, e não para material.", "Isso é tratado pelo Oficial de Informação Pública.", "Isso é a Área de Espera."], "e": "A ACV é o local do incidente onde as vítimas ficam concentradas, aguardando o momento exato do transporte ao hospital de referência. Ela precisa estar em área segura, ampliável e próxima ao incidente, com acesso para as equipes de socorro.", "d": "ACV = vítimas. Espera = recursos."}, {"id": "m28", "sub": "area", "t": "mc", "q": "Como a equipe de atendimento pré-hospitalar se divide dentro da ACV?", "alts": ["Em quatro divisões: transporte, triagem, estabilização e monitoramento, e manejo de mortos", "Em três divisões: triagem, tratamento e alta", "Em duas divisões: vítimas leves e graves", "Em cinco divisões, uma por cor de triagem"], "c": 0, "why": [null, "Não existe 'alta' na ACV, e são quatro divisões.", "A classificação por gravidade é parte da triagem, e não uma divisão.", "As divisões são por função."], "e": "Dentro da ACV as vítimas são constantemente monitoradas e reclassificadas pela equipe de atendimento pré-hospitalar, que atua em 4 divisões: transporte, triagem, estabilização e monitoramento, e manejo de mortos.", "d": "4 divisões: transporte, triagem, estabilização, mortos."}, {"id": "m29", "sub": "recu", "t": "mc", "q": "O que a classe de um recurso informa?", "alts": ["A capacidade de carga e o número de pessoas", "O estado atual do recurso", "A natureza da missão ou função do recurso, como salvamento, transporte ou combate a incêndio", "A cor do cartão no quadro de status"], "c": 2, "why": ["Isso é o tipo.", "Estado é disponível, designado ou indisponível.", null, "Cor é padrão dos T-Cards, e não classificação do recurso."], "e": "Classe define a natureza da missão ou função (ex.: salvamento, transporte, combate a incêndio). Tipo define a capacidade operacional (capacidade de trabalho, de carga e número de pessoas). A categoria diz se é recurso único, equipe de intervenção ou força-tarefa.", "d": "Classe = para quê. Tipo = quanto."}, {"id": "m30", "sub": "recu", "t": "mc", "q": "O que o tipo de um recurso informa?", "alts": ["A natureza da missão que o recurso cumpre", "A capacidade operacional: de trabalho, de carga e número de pessoas", "Se é recurso único ou força-tarefa", "O órgão ao qual ele pertence"], "c": 1, "why": ["Isso é a classe.", null, "Isso é a categoria.", "A instituição aparece no registro, mas não define o tipo."], "e": "O tipo mede a capacidade do recurso. Ex.: uma ambulância e outra de maior capacidade podem ser da mesma classe (transporte), mas de tipos diferentes.", "d": "Classe = para quê. Tipo = quanto."}, {"id": "m31", "sub": "recu", "t": "mc", "q": "O que é uma força-tarefa?", "alts": ["Conjunto de recursos da mesma classe e tipo", "Um equipamento com sua guarnição", "Combinação de recursos de classes e tipos diferentes, com um só líder", "Equipe do Staff de Comando"], "c": 2, "why": ["Isso é a equipe de intervenção.", "Isso é o recurso único.", null, "Staff de Comando é assessoria ao CI, e não categoria de recurso."], "e": "Existem três categorias: recurso único (um equipamento com seu pessoal, ex.: 1 AA), equipe de intervenção (recursos únicos da mesma classe e tipo, ex.: 2 AA) e força-tarefa (classes e tipos diferentes, ex.: 2 AA + 1 ABTR). Nas duas últimas há um só líder e comunicações integradas.", "d": "Mesmo = equipe. Misturado = força-tarefa."}, {"id": "m32", "sub": "recu", "t": "mc", "q": "Duas ambulâncias iguais atuando juntas na mesma área, com um líder, formam o quê?", "alts": ["Um recurso único", "Uma força-tarefa", "Uma base auxiliar", "Uma equipe de intervenção"], "c": 3, "why": ["Recurso único é uma ambulância sozinha.", "Força-tarefa mistura classes e tipos diferentes, e aqui são iguais.", "Base é instalação, e não categoria de recurso.", null], "e": "Uma ambulância atuando é um recurso único. Quando outra da mesma classe e tipo chega em apoio, passa a existir uma equipe de intervenção, com um só líder e comunicações integradas, na mesma área geográfica.", "d": "1 = único. 2 iguais = equipe."}, {"id": "m33", "sub": "recu", "t": "mc", "q": "Quais são os estados possíveis de um recurso no incidente?", "alts": ["Ativo, passivo e reserva", "Solicitado, enviado e recebido", "Pronto, em trânsito e extinto", "Disponível, designado e indisponível"], "c": 3, "why": ["Não são os estados do SCI.", "Descrevem o pedido, e não o estado do recurso.", "Não são os estados do SCI.", null], "e": "Disponível é o recurso pronto para ser mobilizado. Designado é o que está em uso ou em apoio direto ao incidente. Indisponível é o danificado, em manutenção ou sem condições. A posição do T-Card no quadro mostra esse estado.", "d": "Disponível, designado, indisponível."}, {"id": "m34", "sub": "form", "t": "mc", "q": "Qual formulário apresenta o resumo do incidente ao CI e ao staff (briefing)?", "alts": ["SCI-211", "SCI-201", "SCI-219", "SCI-221"], "c": 1, "why": ["É a lista de registro de chegada (check-in).", null, "É o cartão individual de cada recurso.", "É o checkout de desmobilização."], "e": "O SCI-201 (briefing do incidente) tem 4 páginas: croqui da cena (que pode virar o mapa de situação), resumo das ações, organização atual e resumo dos recursos. Deve ser preenchido em todo incidente.", "d": "201 = visão geral."}, {"id": "m35", "sub": "form", "t": "mc", "q": "Para que serve o SCI-211?", "alts": ["Desenhar o croqui da cena", "Registrar a chegada dos recursos ao incidente (check-in)", "Descrever o plano médico", "Listar apenas as vítimas atendidas"], "c": 1, "why": ["O croqui fica na primeira página do SCI-201.", null, "O plano médico é outro formulário (SCI-206).", "O SCI-211 lista recursos, e não vítimas."], "e": "O SCI-211 é a lista de registro. Mostra os recursos solicitados (a caminho), disponíveis, indisponíveis e designados. Traz instituição, identificação do recurso, data e hora de registro, nome do chefe, número de pessoas e contato por telefone ou rádio. É preenchido inicialmente no PC.", "d": "211 = chegou? registra."}, {"id": "m36", "sub": "form", "t": "mc", "q": "Como funciona o SCI-219 (T-Card)?", "alts": ["Há um único cartão para todo o incidente", "É usado apenas ao final, para o relatório", "Serve só para registrar vítimas", "Há um cartão para cada recurso, e a posição dele no quadro mostra o estado"], "c": 3, "why": ["É um cartão por recurso.", "Ele é usado durante o incidente, para controle em tempo real.", "Registra recursos, pessoal e equipamentos.", null], "e": "O SCI-219 é um formulário individual para cada recurso, esteja disponível ou não. Na frente ficam instituição, tipo, local de registro, chegada, líder e designação. No verso, o local designado, a hora e a situação (até 3 designações). No quadro, a posição do cartão indica o estado.", "d": "Um recurso, um cartão."}, {"id": "m37", "sub": "form", "t": "mc", "q": "Qual é a cor do T-Card usado para funções (pessoal)?", "alts": ["Amarelo", "Laranja", "Vermelho", "Branco"], "c": 3, "why": ["O amarelo é de equipamentos e viaturas.", "Laranja é a cor do PC, e não do T-Card.", "Não é padrão do curso.", null], "e": "O padrão adotado é: T-Card branco para funções (recursos humanos) e T-Card amarelo para equipamentos e viaturas.", "d": "Branco = gente. Amarelo = máquina."}, {"id": "m38", "sub": "form", "t": "mc", "q": "Em qual formulário constam o contato por telefone ou rádio do efetivo empregado?", "alts": ["SCI-201", "SCI-219", "SCI-211", "SCI-209"], "c": 2, "why": ["Traz a visão geral do incidente.", "Traz dados do recurso, mas o contato aparece na lista de registro.", null, "É o resumo das ações do incidente."], "e": "O SCI-211 reúne, para cada recurso registrado, o contato por telefone ou rádio, junto do número de pessoas e do estado do recurso.", "d": "Contato = lista de registro (211)."}, {"id": "m39", "sub": "oper", "t": "mc", "q": "Como deve ser feita a transferência de comando?", "alts": ["Por e-mail, para ficar registrada", "Por rádio, sem apresentar o staff", "Por ordem escrita, sem encontro", "Cara a cara, com briefing de quem sai para quem entra"], "c": 3, "why": ["O curso exige o contato direto.", "O comandante que sai deve apresentar o staff e os chefes de seção.", "É necessário o briefing presencial.", null], "e": "A transferência de comando deve ser feita cara a cara. O comandante que sai apresenta o staff e os chefes de seção e informa o estado do incidente, a situação de segurança, os objetivos, a organização, os recursos, as instalações, o plano de comunicações e a provável evolução.", "d": "Cara a cara + briefing."}, {"id": "m40", "sub": "oper", "t": "mc", "q": "Como costuma ser o PAI no período reativo?", "alts": ["Escrito e aprovado por todas as instituições", "Inexistente: o PAI só vale depois da desmobilização", "Mental ou verbal, numa resposta imediata e sob pressão de tempo", "Elaborado por uma instituição externa"], "c": 2, "why": ["Isso é típico do período proativo.", "Existe PAI, mesmo que mental.", null, "Quem decide é o comando do incidente."], "e": "O período reativo (cerca de 4 horas) é o da resposta imediata, com decisões rápidas e PAI mental ou verbal. No período proativo há planejamento detalhado, PAI escrito e formalizado e vários períodos operacionais.", "d": "Reativo = verbal. Proativo = escrito."}, {"id": "v01", "sub": "orig", "t": "vf", "q": "A experiência do Paraná com o grande incêndio florestal da década de 1960 é citada como origem empírica do SICOE.", "v": true, "e": "O material descreve o \"Paraná em Flagelo\" como o grande incêndio em que já se aplicava, na prática, uma metodologia parecida com a do ICS. Mais tarde isso foi formalizado no SICOE.", "d": "Prática antiga, formalizada depois."}, {"id": "v02", "sub": "orig", "t": "vf", "q": "O SCI foi criado no Brasil e depois adotado pelos Estados Unidos.", "v": false, "e": "O caminho foi o inverso: o SCI nasceu nos EUA, nos anos 1970, e chegou ao Brasil por cooperação técnica. O Paraná tinha uma prática parecida, mas o SCI como sistema é de origem americana.", "d": "EUA primeiro, Brasil depois."}, {"id": "v03", "sub": "aplic", "t": "vf", "q": "O SCI é útil também em eventos planejados com grande aglomeração, como desfiles e competições esportivas.", "v": true, "e": "O pânico em eventos planejados (celebrações, desfiles, concertos, competições) está na lista de aplicabilidade. O SCI serve a incidentes de qualquer origem.", "d": "Planejado ou não, serve."}, {"id": "v04", "sub": "aplic", "t": "vf", "q": "O SCI só deve ser usado em desastres naturais.", "v": false, "e": "A lista inclui produtos perigosos, explosões, atentados, fugas em presídios, acidentes de transporte e muito mais. O SCI é útil na administração de todos os tipos de incidentes.", "d": "Qualquer tipo de incidente."}, {"id": "v05", "sub": "def", "t": "vf", "q": "A capacitação, o treinamento e os simulados fazem parte da fase de preparação da Defesa Civil.", "v": true, "e": "A preparação é a fase em que os integrantes são capacitados e treinados, e em que são feitos simulados e planos de contingência antes de qualquer evento crítico.", "d": "Preparação = treino."}, {"id": "v06", "sub": "def", "t": "vf", "q": "A reconstrução é a primeira fase da Defesa Civil.", "v": false, "e": "A sequência é prevenção, preparação, resposta e reconstrução. A reconstrução é a última e consiste no retorno à normalidade.", "d": "Começa na prevenção, termina na reconstrução."}, {"id": "v07", "sub": "def", "t": "vf", "q": "No SICOE, preservar vidas é a 1ª prioridade e proteger propriedades é a última.", "v": true, "e": "As prioridades são: vidas, estabilizar o evento, sistemas essenciais e meio ambiente, e propriedades.", "d": "Gente primeiro, bens por último."}, {"id": "v08", "sub": "def", "t": "vf", "q": "A hora de ouro garante 100% de sobrevivência se a vítima chegar ao pronto-socorro em até 1 hora.", "v": false, "e": "A hora de ouro está associada a até 60% de chance de sobrevivência, e não a 100%. Depois da primeira hora, cada minuto de atraso reduz ainda mais as chances.", "d": "Até 60%, não 100%."}, {"id": "v09", "sub": "def", "t": "vf", "q": "As fases operacionais do SICOE ocorrem uma de cada vez, e a seguinte só começa quando a anterior termina.", "v": false, "e": "As 7 fases operacionais do SICOE (detecção, comunicação, mobilização, chegada ao local, estudo de situação, operacionalização e desmobilização) ocorrem simultaneamente.", "d": "Sete fases, todas ao mesmo tempo."}, {"id": "v10", "sub": "conc", "t": "vf", "q": "Em accountability, todo o pess camento da cena.", "v": true, "e": "A Área de Espera deve ficar afastada da cena a uma distância não superior a cinco minutos de deslocamento, longe de qualquer zona perigosa, com rotas diferentes de entrada e saída e espaço para expandir.", "d": "Perto o bastante, longe do perigo."}, {"id": "v22", "sub": "area", "t": "vf", "q": "A ACV deve ficar em área segura, ampliável e próxima ao incidente.", "v": true, "e": "A ACV precisa estar em área segura, com possibilidade de ampliação, próxima ao incidente e com acesso para as equipes de socorro e evacuação organizada.", "d": "Segura, ampliável, próxima."}, {"id": "v23", "sub": "area", "t": "vf", "q": "O Acampamento é a instalação que coordena as funções logísticas do incidente.", "v": false, "e": "Quem coordena a logística é a Base. O Acampamento oferece alimentação, hidratação, repouso e serviços sanitários, e pode haver vários, cada um com um encarregado.", "d": "Base coordena. Acampamento descansa."}, {"id": "v24", "sub": "area", "t": "vf", "q": "As instalações de apoio, como E, ACV, B, A e H, são identificadas por círculos amarelos de 90 cm.", "v": true, "e": "O PC é o retângulo laranja. As demais instalações usam círculos amarelos de 90 cm com a letra ou sigla em preto no centro.", "d": "Círculo amarelo para tudo, menos o PC."}, {"id": "v25", "sub": "area", "t": "vf", "q": "O PC pode ficar dentro da zona de risco se isso permitir ver melhor a cena.", "v": false, "e": "O PC deve ficar em local seguro, fora da zona de risco, e ainda assim ter boa visão da cena. A segurança do comando vem primeiro.", "d": "PC fora do risco."}, {"id": "v26", "sub": "area", "t": "vf", "q": "A Área de Espera é o local onde as vítimas aguardam o transporte ao hospital.", "v": false, "e": "Isso é a ACV. Na Área de Espera ficam os recursos que fizeram check-in e aguardam a designação para uma missão.", "d": "Espera = recursos. ACV = vítimas."}, {"id": "v27", "sub": "recu", "t": "vf", "q": "Recurso único é um equipamento e seu complemento de d": "v34", "sub": "form", "t": "vf", "q": "O SCI-211 mostra apenas os recursos que já estão designados a uma missão.", "v": false, "e": "O SCI-211 mostra os recursos a caminho, disponíveis, indisponíveis e designados. É o registro completo de chegada.", "d": "211 mostra todos os estados."}, {"id": "v35", "sub": "form", "t": "vf", "q": "O SCI-211 é preenchido no final do incidente, só para compor o relatório.", "v": false, "e": "O SCI-211 é o check-in, preenchido inicialmente no PC, conforme os recursos chegam. Serve ao controle em tempo real.", "d": "Check-in é na chegada."}, {"id": "v36", "sub": "oper", "t": "vf", "q": "A chegada de alguém mais qualificado ao local transfere o comando automaticamente.", "v": false, "e": "A chegada de pessoa mais qualificada não implica troca de comando. A troca só ocorre por transferência, cara a cara, com briefing.", "d": "Mais qualificado ≠ comando automático."}, {"id": "v37", "sub": "oper", "t": "vf", "q": "A Tarjeta de Campo é um check-list de apoio ao primeiro respondedor.", "v": true, "e": "É um cartão impermeável e resistente, portado pelos chefes de equipe, que orienta o estabelecimento do SCI, o manejo de recursos, a instalação das estruturas e a primeira transferência de comando.", "d": "Check-list de bolso."}, {"id": "v38", "sub": "oper", "t": "vf", "q": "No período proativo, o PAI é escrito e pode abranger vários períodos operacionais.", "v": true, "e": "O período proativo tem planejamento detalhado, PAI escrito e formalizado e múltiplos períodos operacionais, podendo durar de horas a semanas.", "d": "Proativo = por escrito."}, {"id": "v39", "sub": "oper", "t": "vf", "q": "Os recursos podem se deslocar ao incidente mesmo sem solicitação ou designação.", "v": false, "e": "Nenhum recurso se desloca sem solicitação ou designação. O despacho e a mobilização seguem passos: solicitação, autorização, despacho, check-in, emprego e desmobilização.", "d": "Sem pedido, ninguém se desloca."}, {"id": "v40", "sub": "oper", "t": "vf", "q": "O PAI comunica a estratégia, as atribuições e os objetivos do incidente.", "v": true, "e": "É a ferramenta que comunica o que se vai fazer, quem faz o quê e onde, e é atualizada a cada período operacional.", "d": "PAI = plano que todo mundo entende."}]};
(() => {
"use strict";
const Q = DATA.q, BY = Object.fromEntries(Q.map(q => [q.id, q])), SUB = Object.fromEntries(DATA.subs.map(s => [s.id, s.n]));
const KEY = "sci-quiz-v2", LET = "ABCD";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fresh(ids){ return { order: shuffle(ids || Q.map(q => q.id)), idx: 0, ans: {}, streak: 0, best: 0, review: !!ids }; }
function load(){
  try {
    const j = JSON.parse(localStorage.getItem(KEY));
    if (j && Array.isArray(j.order) && j.order.length && j.order.every(id => BY[id]) && j.ans && typeof j.idx === "number"
        && (j.review || j.order.length === Q.length)) return j;
  } catch (e) { /* sem armazenamento: segue sem salvar */ }
  return fresh();
}
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignora */ } }
const answered = () => S.order.filter(id => S.ans[id]).length;
const rights = () => S.order.filter(id => S.ans[id] && S.ans[id].ok).length;
const cur = () => BY[S.order[S.idx]];
let view = (answered() === S.order.length) ? "result" : "quiz";
let askRestart = false, askTimer = null;

function optMC(q, i, a){
  let cls = "", st = "";
  if (a){
    if (i === q.c){ cls = "ok"; st = "✓ Correta"; }
    else if (i === a.p){ cls = "bad"; st = "✗ Sua resposta"; }
    else cls = "dim";
  }
  return `<button type="button" class="opt ${cls} ${a ? "done" : ""}" data-act="ans" data-v="${i}" ${a ? 'aria-disabled="true"' : ""}><span class="let">${LET[i]}</span><span>${esc(q.alts[i])}</span>${st ? `<span class="st">${st}</span>` : ""}</button>`;
}
function optVF(q, v, a){
  let cls = "", st = "";
  if (a){
    if (v === q.v){ cls = "ok"; st = "✓"; }
    else if (v === a.p){ cls = "bad"; st = "✗"; }
    else cls = "dim";
  }
  return `<button type="button" class="opt ${cls} ${a ? "done" : ""}" data-act="ans" data-v="${v}" ${a ? 'aria-disabled="true"' : ""}><span>${v ? "Verdadeiro" : "Falso"}</span>${st ? `<span class="st">${st}</span>` : ""}</button>`;
}
function feedback(q, a){
  const head = a.ok ? "✓ Acertou!" : "✗ Errou.";
  const correto = q.t === "mc" ? `${LET[q.c]}) ${esc(q.alts[q.c])}` : (q.v ? "Verdadeiro" : "Falso");
  let h = `<section class="fb ${a.ok ? "ok" : "bad"}"><div class="verdict">${head}</div>
    <p><strong>Resposta correta:</strong> ${correto}</p>
    <h3>Explicação</h3><p>${esc(q.e)}</p>`;
  if (q.t === "mc"){
    h += `<h3>Por que as outras estão erradas</h3><ul>` + q.alts.map((t, i) => i === q.c ? "" :
      `<li class="${i === a.p ? "mine" : ""}"><strong>${LET[i]})</strong> ${esc(t)}<br><span class="muted">${esc(q.why[i])}${i === a.p ? " (foi a sua escolha)" : ""}</span></li>`).join("") + `</ul>`;
  }
  if (q.d) h += `<div class="dica">Para memorizar: ${esc(q.d)}</div>`;
  return h + `</section>`;
}
function quizView(){
  const q = cur(), a = S.ans[q.id], n = S.order.length, isLast = S.idx === n - 1;
  const cells = S.order.map((id, i) => { const x = S.ans[id]; return `<button type="button" class="cell ${x ? (x.ok ? "ok" : "bad") : ""} ${i === S.idx ? "cur" : ""}" data-act="go" data-i="${i}" aria-label="Questão ${i + 1}">${i + 1}</button>`; }).join("");
  return `
  <div class="stats">
    ${S.review ? '<span class="chip rev">Revisão de erros</span>' : ""}
    <span class="chip">Questão <b>${S.idx + 1}</b> de ${n}</span>
    <span class="chip">Acertos <b>${rights()}</b> de ${answered()}</span>
    <span class="chip">Sequência <b>${S.streak}</b></span>
  </div>
  <div class="bar"><i style="width:${Math.round(answered() / n * 100)}%"></i></div>
  <details class="map"><summary>Mapa de questões</summary><div class="grid">${cells}</div></details>
  <article class="card">
    <p class="tags"><span class="tag">${esc(SUB[q.sub])}</span><span class="tag t">${q.t === "mc" ? "Múltipla escolha" : "Verdadeiro ou falso"}</span></p>
    <h2 class="q">${esc(q.q)}</h2>
    ${q.t === "mc" ? [0,1,2,3].map(i => optMC(q, i, a)).join("") : `<div class="vf">${optVF(q, true, a)}${optVF(q, false, a)}</div>`}
    ${a ? feedback(q, a) : ""}
    <div class="nav">
      <button type="button" class="btn" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← Anterior</button>
      <button type="button" class="btn ${a ? "pri" : ""}" data-act="next">${isLast ? "Ver resultado" : (a ? "Próxima →" : "Pular →")}</button>
    </div>
  </article>`;
}
function resultView(){
  const n = S.order.length, ans = answered(), ok = rights(), p = ans ? Math.round(ok / n * 100) : 0;
  const msg = p >= 90 ? "Excelente! Você domina o conteúdo." : p >= 70 ? "Bom desempenho. Revise os erros abaixo." : p >= 50 ? "Está no caminho. Releia as explicações dos erros." : "Releia o resumo e tente de novo.";
  const bySub = DATA.subs.map(s => {
    const ids = S.order.filter(id => BY[id].sub === s.id); if (!ids.length) return "";
    const r = ids.filter(id => S.ans[id] && S.ans[id].ok).length;
    return `<div class="row"><span>${esc(s.n)}</span><span>${r}/${ids.length}</span><div class="track"><i style="width:${Math.round(r / ids.length * 100)}%"></i></div></div>`;
  }).join("");
  const wrong = S.order.filter(id => S.ans[id] && !S.ans[id].ok);
  const list = wrong.map(id => { const q = BY[id];
    const c = q.t === "mc" ? `${LET[q.c]}) ${q.alts[q.c]}` : (q.v ? "Verdadeiro" : "Falso");
    return `<details class="err"><summary>${esc(q.q)}</summary><p class="ans">Resposta correta: ${esc(c)}</p><p>${esc(q.e)}</p>${q.d ? `<div class="dica">Para memorizar: ${esc(q.d)}</div>` : ""}</details>`; }).join("");
  return `
  <article class="card">
    <div class="score"><div class="big">${p}%</div><p><strong>${ok} de ${n}</strong> acertos${S.review ? " (revisão de erros)" : ""}</p><p class="muted">${msg}</p>
    ${ans < n ? `<p class="muted">${n - ans} questão(ões) sem resposta.</p>` : ""}
    ${S.best ? `<p class="muted">Maior sequência de acertos: ${S.best}</p>` : ""}</div>
    <h2 class="sec">Por assunto</h2>${bySub}
    ${wrong.length ? `<h2 class="sec">Questões que você errou (${wrong.length})</h2>${list}` : ""}
    <div class="act">
      ${wrong.length ? `<button type="button" class="btn pri" data-act="review">Refazer só os erros</button>` : ""}
      ${ans < n ? `<button type="button" class="btn" data-act="back">Voltar às questões</button>` : ""}
      <button type="button" class="btn" data-act="again">Recomeçar tudo</button>
    </div>
  </article>`;
}
function render(){
  $("#app").innerHTML = view === "result" ? resultView() : quizView();
  const r = $("#restart"); r.textContent = askRestart ? "Confirmar?" : "Recomeçar";
}
function scrollTop(){ $("#top").scrollIntoView({ behavior:"smooth", block:"start" }); }
function answer(v){
  const q = cur(); if (view !== "quiz" || S.ans[q.id]) return;
  const ok = q.t === "mc" ? v === q.c : v === q.v;
  S.ans[q.id] = { p: v, ok };
  S.streak = ok ? S.streak + 1 : 0; S.best = Math.max(S.best, S.streak);
  save(); render();
  const f = document.querySelector(".fb"); if (f) f.scrollIntoView({ behavior:"smooth", block:"nearest" });
}
function go(i){ S.idx = Math.max(0, Math.min(S.order.length - 1, i)); view = "quiz"; save(); render(); scrollTop(); }
function next(){ if (S.idx === S.order.length - 1) { view = "result"; render(); scrollTop(); } else go(S.idx + 1); }
function prev(){ if (S.idx > 0) go(S.idx - 1); }
function restartAll(){ S = fresh(); view = "quiz"; askRestart = false; save(); render(); scrollTop(); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (e.target.id === "restart"){
    if (askRestart){ clearTimeout(askTimer); restartAll(); }
    else { askRestart = true; render(); askTimer = setTimeout(() => { askRestart = false; render(); }, 3000); }
    return;
  }
  if (!el) return;
  const act = el.dataset.act;
  if (act === "ans") answer(el.dataset.v === "true" ? true : el.dataset.v === "false" ? false : +el.dataset.v);
  else if (act === "next") next();
  else if (act === "prev") prev();
  else if (act === "go") go(+el.dataset.i);
  else if (act === "again") restartAll();
  else if (act === "back"){ const i = S.order.findIndex(id => !S.ans[id]); view = "quiz"; S.idx = i < 0 ? 0 : i; save(); render(); scrollTop(); }
  else if (act === "review"){ const ids = S.order.filter(id => S.ans[id] && !S.ans[id].ok); S = fresh(ids); view = "quiz"; save(); render(); scrollTop(); }
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (view === "quiz"){
    const q = cur(), a = S.ans[q.id];
    if (!a){
      if (q.t === "mc"){ const i = "abcd".indexOf(k); const j = ["1","2","3","4"].indexOf(k); const x = i >= 0 ? i : j; if (x >= 0){ answer(x); return; } }
      else { if (k === "v") { answer(true); return; } if (k === "f") { answer(false); return; } }
    }
    if (k === "arrowright" || (k === "enter" && a)) { if (document.activeElement && document.activeElement.tagName === "BUTTON" && k === "enter") return; e.preventDefault(); next(); }
    else if (k === "arrowleft") { e.preventDefault(); prev(); }
  }
});
render();
})();
</script>
</body>
</html>
