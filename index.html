<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de Direito Administrativo — 150 questões</title>
<style>
/* ===================== INTERFACE ===================== */
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#1c2733; --muted:#5d6b7a; --line:#d7e0ea;
  --main:#16365c; --accent:#2a6f97; --accent-soft:#e8f1f8;
  --ok:#14694f; --ok-bg:#e6f4ee; --ok-line:#8fcdb5;
  --bad:#b3261e; --bad-bg:#fbeceb; --bad-line:#e9a8a3;
  --sel:#dbe9f6; --expl-bg:#fff7e6; --expl-line:#e8c880;
  --shadow:0 1px 2px rgba(20,40,70,.06),0 6px 18px rgba(20,40,70,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f161e;--card:#17212c;--ink:#e6edf4;--muted:#9aabbc;--line:#2b3947;--main:#9cc4ea;--accent:#6fb0dd;--accent-soft:#1c2c3b;
    --ok:#6fd1ab;--ok-bg:#12302a;--ok-line:#2e7b62;--bad:#ff9a92;--bad-bg:#37191a;--bad-line:#8d3b38;--sel:#22405c;--expl-bg:#2c2616;--expl-line:#7d6a2d;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
header.top h1{font-size:1.05rem;margin:0;color:var(--main);letter-spacing:.2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}
.chip.ok b{color:var(--ok)} .chip.bad b{color:var(--bad)}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.88rem;color:var(--muted);margin:6px 0 5px}
.progress-row strong{color:var(--ink);font-size:1rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 20px 18px;margin-top:14px}
.tag{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;margin-bottom:10px}
.qtype{font-size:.76rem;color:var(--muted);margin-left:8px}
.enun{font-size:1.1rem;font-weight:600;margin:0 0 16px;line-height:1.45}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:11px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.9rem;margin-top:1px}
.opt.vf .l{border-radius:8px;width:auto;padding:0 10px;flex:0 0 auto}
.opt.selected{border-color:var(--accent);background:var(--sel)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)} .opt.correct .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .l{background:var(--bad);color:#fff}
.opt .t{flex:1}
.mark{font-weight:700;margin-left:auto;align-self:center}
.feedback{margin-top:16px;border-radius:11px;padding:14px 16px;border:1px solid}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok-line)} .feedback.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.feedback .verdict{font-weight:700;font-size:1.05rem}
.feedback.ok .verdict{color:var(--ok)} .feedback.bad .verdict{color:var(--bad)}
.feedback .right{margin-top:4px}
.explain{margin-top:10px;background:var(--expl-bg);border:1px solid var(--expl-line);border-radius:9px;padding:11px 14px}
.explain b{display:block;margin-bottom:2px}
.hidden{display:none!important}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{font:inherit;font-weight:600;border-radius:11px;border:2px solid var(--accent);padding:12px 20px;min-height:48px;cursor:pointer;background:var(--card);color:var(--accent);flex:0 0 auto}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.grow{flex:1}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;font-size:.9rem;color:var(--muted)}
.tools button.link{font:inherit;background:none;border:none;color:var(--accent);cursor:pointer;padding:6px 2px;text-decoration:underline}
.tools input{width:74px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.map button{font:inherit;font-size:.82rem;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.map button.c{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.map button.w{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.map button.cur{outline:2px solid var(--accent);outline-offset:1px}
.result{text-align:center}
.result h2{font-size:1.7rem;margin:.2em 0 .1em;color:var(--main)}
.pct{font-size:3.2rem;font-weight:800;color:var(--accent);line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.grid3>div{background:var(--accent-soft);border-radius:11px;padding:12px 6px}
.grid3 b{display:block;font-size:1.6rem}
.grid3 .a b{color:var(--ok)} .grid3 .e b{color:var(--bad)}
.byaula{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem;text-align:left}
.byaula td,.byaula th{padding:6px 8px;border-bottom:1px solid var(--line)}
.byaula th{color:var(--muted);font-weight:600}
.result .actions{justify-content:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:.9rem}
/* barra fixa no celular */
@media (max-width:640px){
  .wrap{padding:12px 12px 130px}
  .card{padding:16px 14px}
  .enun{font-size:1.03rem}
  .actions{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);flex-wrap:wrap;z-index:5}
  .actions .btn{padding:12px 10px}
  .actions .confirm{flex:1 0 100%;order:-1}
  .result .actions{position:static;border:none;padding:0;background:none}
  .grid3 b{font-size:1.3rem}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1>Direito Administrativo · Quiz de revisão</h1>
    <div class="stats" aria-live="polite">
      <span class="chip ok">Acertos: <b id="sOk">0</b></span>
      <span class="chip bad">Erros: <b id="sBad">0</b></span>
      <span class="chip">Aproveitamento: <b id="sPct">0%</b></span>
    </div>
  </header>

  <div class="progress-row"><span>Questão <strong id="qNum">1</strong> de <span id="qTot">150</span></span><span><span id="sAns">0</span> de <span class="tot">150</span> respondidas</span></div>
  <div class="bar" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="150"><i id="barFill"></i></div>

  <main id="quizView">
    <section class="card">
      <div><span class="tag" id="qAula"></span><span class="qtype" id="qType"></span></div>
      <p class="enun" id="qText"></p>
      <div class="opts" id="qOpts" role="radiogroup" aria-label="Alternativas"></div>
      <div id="qFeedback" class="feedback hidden" aria-live="polite">
        <div class="verdict" id="fVerdict"></div>
        <div class="right" id="fRight"></div>
        <div class="explain"><b>Explicação:</b><span id="fExplain"></span></div>
      </div>
      <div class="actions">
        <button class="btn" id="btnPrev" type="button">← Anterior</button>
        <button class="btn primary grow confirm" id="btnConfirm" type="button">Confirmar resposta</button>
        <button class="btn" id="btnNext" type="button">Próxima →</button>
      </div>
    </section>
    <div class="tools">
      <span>Ir para a questão <input id="goto" type="number" min="1" max="150" inputmode="numeric" aria-label="Número da questão"> <button class="link" id="btnGo" type="button">ir</button></span>
      <span><button class="link" id="btnMap" type="button">Mapa de questões</button> · <button class="link" id="btnFinish" type="button">Ver resultado</button> · <button class="link" id="btnRestartTop" type="button">Refazer quiz</button></span>
    </div>
    <div class="map hidden" id="map"></div>
  </main>

  <section class="card result hidden" id="resultView">
    <div class="note" id="rNote"></div>
    <h2>Quiz concluído!</h2>
    <div class="pct" id="rPct">0%</div>
    <div class="note">de aproveitamento</div>
    <div class="grid3">
      <div><b id="rTot">150</b>Total de questões</div>
      <div class="a"><b id="rOk">0</b>Acertos</div>
      <div class="e"><b id="rBad">0</b>Erros</div>
    </div>
    <table class="byaula" id="rTable"></table>
    <div class="actions">
      <button class="btn" id="btnBack" type="button">Rever questões</button>
      <button class="btn primary" id="btnRestart" type="button">Refazer quiz</button>
    </div>
  </section>
</div>

<script>
/* ===================== 1) DADOS DAS QUESTÕES =====================
   t: "mc" (múltipla escolha A–D) ou "vf" (verdadeiro/falso)
   a: aula · q: enunciado · o: alternativas · k: índice da correta · x: explicação */
const QUESTOES = [{"t": "mc", "a": "Aula 1 · Conceito de Direito Administrativo", "q": "Segundo Di Pietro, o Direito Administrativo tem por objeto uma atividade jurídica da Administração que é:", "x": "Na definição de Di Pietro, o Direito Administrativo tem por objeto a atividade jurídica não contenciosa, que é a função administrativa. O que é contencioso pertence à função judicial.", "o": ["Jurídica e contenciosa", "Normativa e legislativa", "Política e discricionária", "Jurídica e não contenciosa"], "k": 3}, {"t": "mc", "a": "Aula 1 · Conceito de Direito Administrativo", "q": "Segundo o quadro comparativo estudado, as regras do direito público aplicáveis à Administração são, em regra:", "x": "No direito público as regras são indisponíveis: não se negociam livremente, pois protegem o interesse público. As regras supletivas, que cedem ao acordo das partes, são do direito privado, onde vigora a autonomia da vontade.", "o": ["Supletivas, cedendo ao acordo das partes", "Dispositivas, ajustáveis pela autonomia da vontade", "Indisponíveis, não se negociam livremente", "Facultativas, aplicadas conforme a conveniência do agente"], "k": 2}, {"t": "mc", "a": "Aula 1 · Conceito de Direito Administrativo", "q": "Um bombeiro militar de serviço vistoria um salão de festas, constata risco iminente e propõe a interdição. Em que regime ele atua?", "x": "Ao vistoriar, o militar não negocia: aplica a norma, e o particular fica sujeito à decisão. Em contrapartida, só pode agir nos limites da norma, deve motivar o ato por escrito e responde por excessos. Prerrogativa e sujeição vêm juntas.", "o": ["Direito público, com prerrogativas e sujeições", "Direito privado, com autonomia da vontade das partes", "Direito privado, em pé de igualdade com o proprietário", "Regime misto, negociando as exigências com o dono"], "k": 0}, {"t": "vf", "a": "Aula 1 · Conceito de Direito Administrativo", "q": "Na definição de Di Pietro, a expressão “órgãos, agentes e pessoas jurídicas administrativas” indica a Administração Pública em sentido objetivo.", "x": "Falso. Essa parte da definição corresponde à Administração em sentido subjetivo, que responde à pergunta “quem administra”.", "o": ["Verdadeiro", "Falso"], "k": 1}, {"t": "mc", "a": "Aula 1 · Conceito de Direito Administrativo", "q": "Qual das opções abaixo é uma sujeição da Administração, e não uma prerrogativa?", "x": "Decidir unilateralmente, executar sem autorização judicial e contar com presunção de legitimidade são prerrogativas. Agir só dentro da competência, motivar, dar publicidade, assegurar contraditório e ampla defesa e se submeter a controle são sujeições.", "o": ["Contar com a presunção de legitimidade dos atos", "Assegurar contraditório e ampla defesa", "Decidir unilateralmente e impor a decisão", "Executar o ato sem autorização judicial prévia"], "k": 1}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "O Estado, no conceito estudado, é:", "x": "Estado é a nação politicamente organizada e é pessoa jurídica. Não se confunde com o prédio, com o governante nem com o partido: permanece o mesmo quando os governantes mudam.", "o": ["A nação politicamente organizada, pessoa jurídica", "O conjunto de prédios públicos e órgãos do governo", "O partido que venceu a eleição e administra o território", "O governante que ocupa o cargo em determinado período"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Segundo a doutrina majoritária, quais são os elementos do Estado?", "x": "A doutrina majoritária trabalha com três elementos: povo (humano), território (físico) e soberania (político). Parte dos autores, como Dallari, acrescenta a finalidade (bem comum) como quarto elemento.", "o": ["Nação, território e Constituição", "Povo, território e governo", "População, governo e finalidade", "Povo, território e soberania"], "k": 3}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "O elemento do Estado definido como poder supremo na ordem interna e independente na ordem externa é:", "x": "A soberania é o elemento político: poder supremo no plano interno e independente no plano externo, exercido por meio do governo.", "o": ["O povo", "O governo", "A soberania", "O território"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Um estrangeiro residente no Paraná, quanto aos conceitos de povo e população, integra:", "x": "Povo é conceito jurídico: conjunto dos nacionais. População é conceito demográfico: todos os que estão no território, inclusive estrangeiros residentes e visitantes.", "o": ["A população, mas não o povo", "O povo, mas não a população", "O povo e a população, simultaneamente", "Nem o povo nem a população"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Qual dos itens abaixo NÃO é território do Estado em sentido próprio?", "x": "A plataforma continental e a zona econômica exclusiva (200 milhas) não são território em sentido próprio: sobre elas o Brasil exerce apenas direitos de soberania para exploração de recursos.", "o": ["O mar territorial de 12 milhas náuticas", "A zona econômica exclusiva", "O espaço aéreo acima do território", "Os navios e aeronaves públicas, por extensão"], "k": 1}, {"t": "vf", "a": "Aula 2 · Estado e Administração Pública", "q": "Todo cidadão integra o povo, mas nem todo integrante do povo é cidadão.", "x": "Verdadeiro. Cidadão é o nacional no gozo dos direitos políticos (conceito político); povo é o conjunto dos nacionais (conceito jurídico).", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "No Brasil, a soberania pertence:", "x": "A soberania é da República Federativa do Brasil. Estados, DF e Municípios são autônomos (autoadministração, autogoverno e auto-organização), mas não soberanos.", "o": ["À República Federativa do Brasil", "Aos Municípios, em matéria local", "Ao Estado do Paraná, em seu território", "A cada Estado-membro, em sua esfera"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "A função típica do Poder Legislativo é:", "x": "O Legislativo tem como função típica legislar (normas gerais e abstratas) e fiscalizar, com auxílio do Tribunal de Contas. Administrar é função típica do Executivo e julgar, do Judiciário.", "o": ["Regulamentar a lei para fiel execução", "Administrar de ofício", "Legislar e fiscalizar", "Julgar mediante provocação"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "O que separa a atividade administrativa da atividade jurisdicional?", "x": "O Executivo age de ofício e sua decisão não é definitiva. O Judiciário depende de provocação e sua decisão é definitiva (coisa julgada).", "o": ["A Administração depende de provocação e sua decisão é definitiva", "A Administração age de ofício e sua decisão não é definitiva", "Ambas agem de ofício e decidem em caráter definitivo", "Ambas dependem de provocação e geram coisa julgada"], "k": 1}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Quando o Poder Judiciário organiza seus serviços e seu quadro de pessoal, ele exerce função:", "x": "Cada Poder exerce funções atípicas. O Judiciário administra (organiza serviços e pessoal) e legisla (regimentos internos dos tribunais), além de sua função típica de julgar.", "o": ["Administrativa, típica para ele", "Legislativa, atípica para ele", "Jurisdicional, típica para ele", "Administrativa, atípica para ele"], "k": 3}, {"t": "vf", "a": "Aula 2 · Estado e Administração Pública", "q": "O poder do Estado é uno; o que a Constituição reparte entre os Poderes são as funções de legislar, administrar e julgar.", "x": "Verdadeiro. A soberania é uma só, por isso o poder é uno. A separação dos Poderes divide as funções, e os Poderes são independentes e harmônicos entre si.", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Na definição de Hely Lopes Meirelles, a Administração Pública é:", "x": "Administração Pública é todo o aparelhamento do Estado preordenado à realização de seus serviços, visando à satisfação das necessidades coletivas. A fixação de diretrizes políticas é atividade de governo.", "o": ["A função de resolver conflitos com caráter definitivo", "O aparelhamento do Estado voltado a realizar seus serviços", "A atividade política que fixa as diretrizes e as metas do Estado", "O conjunto das leis que regem a atuação dos agentes públicos"], "k": 1}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "A Administração Pública em sentido subjetivo responde à pergunta:", "x": "No sentido subjetivo (formal ou orgânico), a Administração é o conjunto de órgãos, pessoas jurídicas e agentes públicos: responde a “quem administra”. O sentido objetivo responde a “o que se administra”.", "o": ["Por que se administra", "O que se administra", "Como se administra", "Quem administra"], "k": 3}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Combater incêndio, vistoriar edificações e socorrer vítimas representam a Administração em sentido:", "x": "No sentido objetivo (material ou funcional) a Administração é a própria atividade administrativa: serviço público, polícia administrativa, fomento e intervenção. O CBMPR como conjunto de órgãos e agentes é sentido subjetivo.", "o": ["Subjetivo, pois indicam os agentes envolvidos", "Subjetivo, pois indicam os órgãos que a exercem", "Objetivo, pois indicam a atividade exercida", "Político, pois indicam a vontade do governo"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Na síntese de Hely Lopes Meirelles sobre Governo e Administração:", "x": "O Governo é atividade política e discricionária, que fixa diretrizes e políticas públicas. A Administração é atividade instrumental, normalmente vinculada à lei ou à norma técnica: Governo comanda; Administração executa.", "o": ["O Governo comanda, em atividade política; a Administração executa", "Ambos exercem a mesma função política e discricionária", "O Governo é vinculado à lei; a Administração decide livremente", "O Governo executa a lei; a Administração fixa diretrizes políticas"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Segundo Di Pietro, quais são as quatro modalidades da função administrativa?", "x": "A função administrativa se decompõe em serviço público, polícia administrativa, fomento e intervenção. As duas primeiras concentram a atividade do CBMPR.", "o": ["Serviço público, polícia administrativa, fomento e intervenção", "Fomento, intervenção, tributação e prestação de serviço público", "Polícia administrativa, polícia judiciária, fomento e serviço social", "Serviço público, poder de polícia, função legislativa e jurisdição"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "A transferência de competência para outra pessoa jurídica, criada ou autorizada por lei, denomina-se:", "x": "Na descentralização a competência é transferida a outra pessoa. Na desconcentração ela é apenas distribuída internamente, dentro da mesma pessoa jurídica.", "o": ["Avocação de competência", "Desconcentração interna", "Descentralização", "Hierarquia funcional"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "A distribuição de competências entre a Secretaria da Segurança Pública, o CBMPR e seus batalhões é exemplo de:", "x": "Trata-se de distribuição interna de competências, dentro da mesma pessoa jurídica (Estado do Paraná). É desconcentração, e nela há hierarquia e subordinação.", "o": ["Descentralização, sem hierarquia", "Desconcentração, sem hierarquia", "Desconcentração, com hierarquia", "Descentralização, com hierarquia"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "A relação entre o Estado do Paraná e uma autarquia estadual, como a UEL, caracteriza:", "x": "São pessoas jurídicas distintas, sem hierarquia entre elas: há apenas controle finalístico. É descentralização.", "o": ["Desconcentração, com controle finalístico do ente", "Descentralização, com hierarquia e subordinação", "Desconcentração, com hierarquia funcional", "Descentralização, com controle finalístico"], "k": 3}, {"t": "vf", "a": "Aula 2 · Estado e Administração Pública", "q": "Na desconcentração há hierarquia e subordinação, pois a competência é distribuída dentro da mesma pessoa jurídica.", "x": "Verdadeiro. Na desconcentração as competências ficam na mesma pessoa jurídica e há hierarquia. Na descentralização não há hierarquia, apenas controle finalístico.", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Quanto à delegação de serviço público a particular, é correto afirmar que ela:", "x": "Na delegação o particular, já existente no mercado, recebe só a execução, por contrato. A titularidade fica com o Estado, que fiscaliza e pode retomar o serviço. Transferir titularidade e criar entidade por lei é a outorga.", "o": ["Transfere apenas a execução; o Estado mantém a titularidade", "Cria pessoa jurídica integrante da Administração Indireta, por lei", "Exige lei específica para criar a entidade que executará o serviço", "Transfere a titularidade do serviço por prazo indeterminado, por lei"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Ação de indenização por dano causado em ocorrência do CBMPR deve ser proposta, em regra, contra:", "x": "O CBMPR é órgão da Administração Direta e não tem personalidade jurídica: o órgão age, a pessoa jurídica responde. Por isso a ação é proposta contra o Estado do Paraná.", "o": ["O comandante da unidade, pessoalmente", "O Estado do Paraná, pessoa jurídica", "A Secretaria de Segurança Pública", "O CBMPR, que tem personalidade própria"], "k": 1}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Qual das entidades abaixo integra a Administração Indireta?", "x": "A Administração Indireta é composta por autarquias, fundações públicas, empresas públicas e sociedades de economia mista. Secretarias são órgãos da Direta; Sistema S e terceiro setor são paraestatais, fora da Administração.", "o": ["A Secretaria de Estado da Fazenda", "A organização da sociedade civil", "A sociedade de economia mista", "O serviço social autônomo do Sistema S"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Segundo o art. 37, XIX, da CF, qual entidade é CRIADA por lei específica (e não apenas autorizada)?", "x": "A lei cria a autarquia (e a fundação pública de direito público) e apenas autoriza a criação de empresa pública, sociedade de economia mista e fundação de direito privado. É a distinção que mais cai em prova.", "o": ["A autarquia", "A empresa pública", "A sociedade de economia mista", "A fundação de direito privado"], "k": 0}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Qual característica pertence à sociedade de economia mista?", "x": "A sociedade de economia mista tem capital misto, com controle acionário do Poder Público, regime de direito privado e é obrigatoriamente sociedade anônima. A lei apenas autoriza sua criação.", "o": ["Criação por lei específica e bens públicos impenhoráveis", "Personalidade de direito público e pessoal estatutário", "Capital misto, controle do Poder Público e forma de S.A.", "Capital exclusivamente público e qualquer forma societária"], "k": 2}, {"t": "mc", "a": "Aula 2 · Estado e Administração Pública", "q": "Capital exclusivamente público, regime de direito privado e qualquer forma societária caracterizam:", "x": "Empresa pública: capital 100% público, direito privado, qualquer forma societária admitida em direito (ex.: Caixa, Correios, Cohapar).", "o": ["A empresa pública", "A sociedade de economia mista", "A autarquia", "A fundação pública de direito público"], "k": 0}, {"t": "vf", "a": "Aula 2 · Estado e Administração Pública", "q": "As entidades do Sistema S, como Sesi e Senai, integram a Administração Indireta.", "x": "Falso. São entidades paraestatais (serviços sociais autônomos): pessoas de direito privado, sem fins lucrativos, que cooperam com o Estado sem integrar a Administração.", "o": ["Verdadeiro", "Falso"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Cargo público, na definição estudada, é:", "x": "Cargo é a unidade mais simples de atribuições e responsabilidades, criada por lei, com denominação própria e remuneração fixada, em vínculo estatutário. O vínculo celetista é emprego; atribuições sem cargo são função.", "o": ["Vínculo contratual regido pela CLT, com ingresso por concurso público", "Encargo designado pelo comando, passível de troca a qualquer tempo", "Unidade de atribuições criada por lei, com vínculo estatutário", "Conjunto de atribuições e responsabilidades sem cargo correspondente"], "k": 2}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "O emprego público caracteriza-se por:", "x": "Emprego público é vínculo contratual sob a CLT, típico de estatais, com concurso, mas sem a estabilidade do art. 41. Quem o ocupa é empregado público.", "o": ["Unidade de atribuições criada por lei, com denominação própria", "Vínculo contratual pela CLT, sem a estabilidade do art. 41", "Vínculo estatutário, com estabilidade após três anos de exercício", "Atribuições sem cargo, exercidas por prazo certo e sem concurso"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "A função pública de confiança só pode ser exercida por quem:", "x": "Pelo art. 37, V, da CF, as funções de confiança são exercidas exclusivamente por servidores ocupantes de cargo efetivo. O servidor temporário exerce função por prazo certo (art. 37, IX).", "o": ["É contratado sem concurso por prazo certo", "Ocupa cargo em comissão de livre exoneração", "Já ocupa cargo efetivo", "Ocupa emprego público celetista"], "k": 2}, {"t": "vf", "a": "Aula 3 · Agentes Públicos", "q": "Todo cargo tem função, mas nem toda função tem cargo.", "x": "Verdadeiro. A função é o que se faz; o cargo é o lugar criado por lei para que alguém o faça. Existem funções sem cargo, como a do servidor temporário.", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "No CBMPR, o cargo militar corresponde ao:", "x": "O militar ocupa cargo: o grau hierárquico (posto ou graduação), conferido por promoção e fixado em lei. Chefe de socorro, condutor e instrutor são funções, designadas pelo comando.", "o": ["Vínculo celetista com a Corporação, por contrato", "Grau hierárquico, posto ou graduação", "Encargo de instrutor do CFP, por designação do comando", "Encargo de chefe de socorro do SIATE, por designação"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Um Cabo é designado chefe de guarnição. Em relação ao cargo e ao subsídio:", "x": "A graduação é conquistada e levada consigo; a função é designada e pode ser trocada pelo comando. A designação dá atribuições e responsabilidade, mas não altera o grau hierárquico nem o subsídio.", "o": ["Adquire o grau hierárquico correspondente à chefia", "Passa a ocupar cargo superior e recebe novo subsídio", "Continua Cabo; não muda o grau hierárquico nem o subsídio", "Perde a graduação enquanto durar a designação"], "k": 2}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Segundo Hely Lopes Meirelles, agentes públicos são:", "x": "O conceito é amplo: todas as pessoas físicas incumbidas, definitiva ou transitoriamente, do exercício de alguma função estatal. Não importa o vínculo, a permanência nem a remuneração.", "o": ["Exclusivamente os ocupantes de cargo provido por concurso", "Pessoas físicas incumbidas de função estatal, ainda que transitoriamente", "Apenas quem recebe remuneração dos cofres públicos", "Somente os servidores de vínculo estatutário permanente"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Qual é a classificação de agentes públicos de Celso Antônio Bandeira de Mello, ajustada após a EC 18/1998?", "x": "A classificação tem quatro categorias: agentes políticos, servidores públicos (estatutários, empregados públicos e temporários), militares e particulares em colaboração.", "o": ["Agentes políticos, servidores públicos, empregados e temporários", "Políticos, servidores, militares e particulares em colaboração", "Servidores, militares, magistrados e membros do Ministério Público", "Agentes políticos, estatutários, celetistas e militares estaduais"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Desde a EC 18/1998, o bombeiro militar integra a categoria de:", "x": "A EC 18/1998 retirou os militares da categoria de servidores públicos. Eles formam categoria própria, regida pelo art. 42 da CF.", "o": ["Servidores públicos estatutários, com estabilidade do art. 41", "Empregados públicos celetistas, admitidos por concurso", "Militares, categoria própria do art. 42 da CF", "Agentes políticos, eleitos ou nomeados para cargos de governo"], "k": 2}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Na cadeia de comando do CBMPR, o agente político é:", "x": "Agente político é quem forma a vontade superior do Estado, como o Governador, a quem o CBMPR é subordinado. O Comandante-Geral é militar de carreira em função de direção, e não agente político.", "o": ["O Subcomandante-Geral", "O Corregedor-Geral", "O Comandante-Geral da Corporação", "O Governador do Estado"], "k": 3}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Quanto ao ente federativo, o bombeiro militar do Paraná é:", "x": "O art. 42 estabelece que os membros das PMs e dos Corpos de Bombeiros Militares são militares dos Estados, do DF e dos Territórios. Os militares das Forças Armadas têm regime distinto (art. 142).", "o": ["Militar estadual, previsto no art. 42 da CF", "Militar federal, integrante das Forças Armadas", "Agente político estadual", "Servidor público estadual estatutário"], "k": 0}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Quem socorre uma vítima ou combate um princípio de incêndio antes da chegada da guarnição colabora com o Poder Público por:", "x": "Na gestão de negócios o particular assume espontaneamente a função pública diante de emergência, sem convocação nem delegação prévia. Na requisição há convocação compulsória (jurado, mesário); na delegação, transferência por ato ou contrato.", "o": ["Delegação", "Gestão de negócios", "Concurso público", "Requisição"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Qual afirmação sobre o militar estadual em comparação com o servidor civil estatutário está correta?", "x": "O militar estadual tem regime próprio: subsídio em parcela única (Lei 17.169/2012), garantias previstas em lei específica em lugar da estabilidade do art. 41, regime disciplinar militar e inatividade por reserva remunerada ou reforma.", "o": ["O militar tem o regime disciplinar do estatuto civil", "O militar adquire a estabilidade do art. 41 após três anos", "O militar se aposenta como o servidor civil, sem reserva ou reforma", "O militar recebe subsídio e não tem a estabilidade do art. 41"], "k": 3}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "A inatividade do militar estadual ocorre por meio de:", "x": "A carreira militar não usa o vocabulário da aposentadoria comum: a inatividade se dá por reserva remunerada (não definitiva, o militar pode ser convocado) ou por reforma (definitiva).", "o": ["Aposentadoria pelo regime geral", "Disponibilidade com remuneração proporcional", "Exoneração a pedido, com proventos", "Reserva remunerada ou reforma"], "k": 3}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Investidura é:", "x": "Investidura é o ato formal pelo qual se estabelece o vínculo jurídico entre o Estado e o agente público. Antes dela há candidato; depois, há agente. A nomeação é o provimento; o exercício é o início do desempenho.", "o": ["O ato formal que estabelece o vínculo entre o Estado e o agente", "A aprovação em concurso, pré-requisito do provimento", "O ato que preenche o cargo, por meio da nomeação", "O início efetivo do desempenho das atribuições"], "k": 0}, {"t": "vf", "a": "Aula 3 · Agentes Públicos", "q": "Provimento e investidura são sinônimos: ambos ocorrem com a nomeação.", "x": "Falso. Provimento é o ato que preenche o cargo e ocorre com a nomeação. Investidura é o momento em que o agente assume e o vínculo nasce: ocorre com a posse.", "o": ["Verdadeiro", "Falso"], "k": 1}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "Na investidura do empregado público, o vínculo nasce com:", "x": "Para o empregado público, a investidura ocorre com a assinatura do contrato de trabalho e a anotação na carteira de trabalho. Para o cargo, ocorre com a posse.", "o": ["A posse no cargo, perante a autoridade competente", "A nomeação para cargo em comissão de livre exoneração", "A eleição, seguida da diplomação pela Justiça Eleitoral", "A assinatura do contrato de trabalho"], "k": 3}, {"t": "mc", "a": "Aula 3 · Agentes Públicos", "q": "A ordem correta das fases do ingresso no CBMPR é:", "x": "O ingresso segue concurso, nomeação (provimento), posse (quando nasce o vínculo militar) e exercício (início do desempenho, de onde surgem direitos e deveres da condição militar).", "o": ["Concurso, nomeação, posse e exercício", "Concurso, posse, nomeação e exercício", "Concurso, nomeação, exercício e posse", "Nomeação, concurso, exercício e posse"], "k": 0}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Pelo princípio da legalidade, a Administração Pública:", "x": "Ao particular é permitido fazer tudo o que a lei não proíbe; ao administrador só é permitido fazer o que a lei autoriza (Di Pietro). A atuação está sempre subordinada à lei.", "o": ["Pode fazer tudo o que a lei não proíbe", "Pode inovar quando a lei for omissa", "Pode agir sempre que houver conveniência pública", "Só pode fazer o que a lei autoriza"], "k": 3}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Um vistoriador exige uma instalação que nenhuma norma técnica prevê. Qual princípio foi violado?", "x": "A vistoria só exige o que a lei e as normas técnicas preveem. Exigir o que a norma não pede é ato nulo e pode configurar abuso de autoridade.", "o": ["Publicidade", "Legalidade", "Impessoalidade", "Eficiência"], "k": 1}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "O princípio da impessoalidade impõe que o ato administrativo seja:", "x": "Na impessoalidade o ato é imputado ao órgão e à pessoa jurídica, não ao agente. Ela também exige tratamento sem favorecimento (isonomia), voltado ao interesse público (finalidade).", "o": ["Imputado ao órgão, e não ao agente", "Dirigido aos destinatários escolhidos pela autoridade", "Atribuído pessoalmente ao agente que o pratica", "Divulgado com o nome da autoridade responsável"], "k": 0}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Qual conduta viola a impessoalidade?", "x": "O art. 37, § 1º, veda nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades na publicidade oficial. A campanha de prevenção é do CBMPR, e não do comandante que a assina.", "o": ["Atender a ocorrência sem distinguir a vítima", "Publicar o edital antes da disputa", "Campanha oficial com a imagem do comandante", "Analisar projetos pela ordem do protocolo"], "k": 2}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Uma empresa vistoriada oferece um brinde ao vistoriador. Aceitá-lo viola, principalmente, o princípio da:", "x": "A moralidade exige conduta honesta, proba e leal. Aceitar cortesia ou brinde de empresa vistoriada, ou pedir vantagem para agilizar o devido, viola a moralidade e pode configurar improbidade e crime.", "o": ["Eficiência", "Segurança jurídica", "Publicidade", "Moralidade"], "k": 3}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Sem cientificação do interessado, o ato administrativo existe, mas:", "x": "Em regra, a publicidade é requisito de eficácia do ato: é dela que correm os prazos. O prazo para o particular recorrer só começa quando ele é cientificado.", "o": ["É nulo de pleno direito", "Perde a presunção de legitimidade", "Ainda não produz efeito, e o prazo para recorrer não corre", "Produz efeitos retroativos à data da assinatura"], "k": 2}, {"t": "vf", "a": "Aula 4 · Princípios da Administração Pública", "q": "A publicidade admite exceções: o sigilo é cabível, por exemplo, para dados de saúde da vítima socorrida.", "x": "Verdadeiro. A regra é a transparência; o sigilo é exceção justificada, necessária à segurança e à intimidade, como os dados de saúde de vítima atendida pelo SIATE.", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Sobre o princípio da eficiência, é correto afirmar que ele:", "x": "Eficiência é resultado bom obtido pelo meio correto. Se o meio é irregular, não há eficiência, há pressa. Ela alcança o modo de agir do agente e o modo de organizar a Administração, e convive com os demais princípios.", "o": ["Dispensa o procedimento padrão da Corporação em situações críticas", "Não autoriza atalho ilegal: resultado bom exige meio correto", "Limita-se ao modo de agir do agente, sem alcançar a organização", "Prevalece sobre a legalidade quando há urgência na ocorrência"], "k": 1}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "A entrada em casa alheia, sem consentimento, para prestar socorro tem como fundamento o princípio da:", "x": "A supremacia do interesse público fundamenta as prerrogativas da Administração, como a entrada em casa alheia em caso de desastre ou para prestar socorro (CF, art. 5º, XI).", "o": ["Indisponibilidade do interesse público", "Autotutela", "Segurança jurídica", "Supremacia do interesse público"], "k": 3}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Deixar de interditar o que oferece risco porque o morador é conhecido contraria o princípio da:", "x": "O agente não dispõe do interesse público: apenas o administra. Por isso não se perdoa multa por simpatia nem se deixa de interditar o que oferece risco.", "o": ["Razoabilidade e proporcionalidade", "Segurança jurídica e proteção da confiança", "Indisponibilidade do interesse público", "Continuidade do serviço público"], "k": 2}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Interditar toda a edificação quando bastaria interditar um setor ofende, principalmente, a:", "x": "A proporcionalidade exige equilíbrio entre o meio empregado e o fim buscado, vedado o excesso. Havendo alternativa menos gravosa e igualmente segura, ela prevalece sobre a interdição total.", "o": ["Moralidade administrativa", "Proporcionalidade", "Publicidade dos atos", "Autotutela administrativa"], "k": 1}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Pela teoria dos motivos determinantes, se o auto declara um risco que não existia:", "x": "Se a Administração motiva o ato, fica vinculada aos motivos declarados. Sendo eles falsos ou inexistentes, a validade fica comprometida e o ato pode ser anulado, mesmo que outro risco real houvesse no local.", "o": ["O ato pode ser anulado, ainda que houvesse outro risco real", "O ato permanece válido, pois outro risco o justifica", "O ato pode ser revogado por conveniência", "O ato é convalidado pela autoridade superior"], "k": 0}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Constatado um vício no auto de vistoria, a própria Corporação pode anulá-lo sem esperar ação judicial, em razão da:", "x": "Pela autotutela, a Administração anula seus atos ilegais e revoga os inconvenientes sem recorrer ao Judiciário (Súmulas 346 e 473 do STF).", "o": ["Supremacia do interesse público", "Segurança jurídica", "Autotutela", "Continuidade do serviço"], "k": 2}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Uma norma técnica nova não alcança projeto já aprovado sob a orientação anterior. Isso decorre do princípio da:", "x": "A segurança jurídica veda a aplicação retroativa de nova interpretação e protege a confiança legítima de quem agiu conforme a orientação vigente.", "o": ["Segurança jurídica", "Eficiência administrativa", "Legalidade estrita", "Autotutela administrativa"], "k": 0}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Qual conjunto reúne princípios da Lei 14.751/2023 que não constam do art. 37 da CF?", "x": "Os seis específicos da instituição militar são hierarquia, disciplina, direitos humanos, efetividade, universalidade e participação/interação comunitária. Os demais repetem princípios já vistos, como legalidade, moralidade e eficiência.", "o": ["Hierarquia, disciplina, direitos humanos, efetividade, universalidade e interação comunitária", "Hierarquia, razoabilidade, direitos humanos, efetividade, eficiência e interação comunitária", "Hierarquia, disciplina, legalidade, efetividade, universalidade e interação comunitária", "Hierarquia, disciplina, direitos humanos, moralidade, universalidade e publicidade"], "k": 0}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "A queda do número de mortes em incêndios, e não apenas o número de atendimentos realizados, exemplifica:", "x": "Eficiência é fazer bem, aplicando corretamente os recursos. Efetividade é produzir o resultado: capacidade de gerar impacto real na proteção das pessoas e do patrimônio.", "o": ["Eficiência", "Efetividade", "Universalidade", "Interação comunitária"], "k": 1}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "Diante de uma ordem manifestamente ilegal de um superior, o militar:", "x": "O limite da hierarquia é a legalidade. Obediência hierárquica não é obediência cega: a ordem manifestamente ilegal não deve ser cumprida, e quem a cumpre responde junto com quem a deu.", "o": ["Deve cumpri-la e questioná-la depois pela via judicial", "Deve cumpri-la, e responde apenas quem ordenou", "Pode cumpri-la se houver urgência na ocorrência", "Não deve cumpri-la, e quem a cumpre responde junto com quem a deu"], "k": 3}, {"t": "mc", "a": "Aula 4 · Princípios da Administração Pública", "q": "O desrespeito à moralidade administrativa é sancionável como:", "x": "Segundo a aula, a moralidade exige boa-fé e ética no exercício da função, e o seu desrespeito é sancionável como improbidade (CF, art. 37, § 4º). Solicitar ou receber vantagem para agilizar o que é devido configura ainda crime.", "o": ["Improbidade administrativa", "Transgressão exclusivamente disciplinar", "Vício de forma convalidável", "Mera irregularidade formal, sem sanção"], "k": 0}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Serviço público, segundo Di Pietro, é atividade:", "x": "Serviço público é toda atividade material que a lei atribui ao Estado para que a exerça, direta ou indiretamente, com o fim de satisfazer concretamente necessidades coletivas, sob regime total ou parcialmente público.", "o": ["Material atribuída por lei ao Estado para satisfazer necessidades coletivas", "Jurisdicional, exercida pelo Estado para solucionar conflitos coletivos", "Normativa do Estado voltada a limitar direitos individuais em favor da coletividade", "Privada de interesse coletivo, exercida sem submissão a regime de direito público"], "k": 0}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "No serviço público, o elemento que se refere à submissão ao regime de direito público é o:", "x": "Os elementos são: subjetivo (imputado ao Estado), material (atende necessidade coletiva) e formal (submete-se, no todo ou em parte, ao regime de direito público).", "o": ["Subjetivo", "Formal", "Funcional", "Material"], "k": 1}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Qual princípio do serviço público explica a escala de serviço, a prontidão e o revezamento de guarnições?", "x": "A continuidade determina que o serviço essencial não pode parar: no socorro não há horário de fechar. Dela decorrem a escala, a prontidão e o revezamento de guarnições.", "o": ["Atualidade técnica", "Modicidade tarifária", "Generalidade", "Continuidade"], "k": 3}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Quadriciclos de resgate e reforço de contingente em áreas de alta vulnerabilidade, para igualar o tempo de resposta, exemplificam:", "x": "Equidade é a alocação proporcional à necessidade: direcionar mais recursos a quem mais precisa para equilibrar as condições. Igualdade, no sentido do slide, é oferecer os mesmos recursos a todos sem considerar vulnerabilidades distintas.", "o": ["Igualdade", "Equidade", "Desenho universal", "Desigualdade"], "k": 1}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Postos com piso tátil, rampas, sinalização visual e sonora e bombeiros capacitados em LIBRAS refletem:", "x": "O desenho universal projeta o serviço e os canais de emergência para que qualquer cidadão tenha acesso autônomo e imediato, independentemente de limitações físicas ou sensoriais.", "o": ["A igualdade padronizada", "A desigualdade de acesso", "A equidade", "O desenho universal"], "k": 3}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Serviço público uti universi é aquele:", "x": "Os serviços uti universi (gerais) são prestados à coletividade como um todo, sem que se possa individualizar o uso, e são custeados por impostos. Ex.: iluminação pública, segurança pública.", "o": ["Remunerado por tarifa de quem o utiliza", "Fruído individualmente e mensurável", "Prestado à coletividade, sem uso individualizável", "Prestado apenas a quem o requer"], "k": 2}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "O socorro público classifica-se, quanto ao destinatário, como serviço:", "x": "O socorro (combate a incêndio, busca e salvamento, APH, defesa civil) é uti universi: geral e indivisível, custeado por impostos, sem taxa nem tarifa.", "o": ["Uti universi, remunerado por tarifa", "Uti universi, geral e indivisível", "Uti singuli, remunerado por taxa", "Uti singuli, individual e mensurável"], "k": 1}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "A análise de projeto técnico e a vistoria de edificação, prestadas a interessado determinado, admitem:", "x": "São serviços administrativos específicos e divisíveis, prestados mediante requerimento, e por isso comportam taxa instituída em lei estadual. O socorro, ao contrário, nunca é condicionado a pagamento.", "o": ["Cobrança de tarifa contratual", "Cobrança apenas se o interessado aderir", "Cobrança de taxa instituída por lei", "Nenhuma cobrança, por serem uti universi"], "k": 2}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Quanto à essencialidade, o serviço prestado pelo CBMPR é:", "x": "Serviços essenciais são indispensáveis à sobrevivência do grupo social e do Estado: prestação direta, privativos e indelegáveis, com continuidade reforçada. O CBMPR é o caso típico do essencial.", "o": ["Essencial, privativo e indelegável do Estado", "Ordinário, de utilidade pública", "Ordinário, delegável por permissão", "Essencial, mas delegável por concessão"], "k": 0}, {"t": "vf", "a": "Aula 5 · Serviço Público", "q": "O socorro público pode ser interrompido por inadimplência do usuário, como ocorre com a energia elétrica.", "x": "Falso. A energia elétrica (serviço ordinário) pode ser cortada por falta de pagamento. O socorro, serviço essencial e custeado por impostos, não: ninguém verifica situação fiscal antes de entrar em edificação em chamas.", "o": ["Verdadeiro", "Falso"], "k": 1}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "A formação conduzida pela Escola de Bombeiro Militar é classificada, quanto ao objeto, como serviço:", "x": "Os serviços administrativos atendem a necessidades internas da Administração ou preparam outros serviços: são atividades-meio. A formação prepara a atividade-fim, e o socorro e a prevenção não são comerciais nem sociais.", "o": ["Administrativo, atividade-meio", "Essencial de socorro", "Social", "Comercial ou industrial"], "k": 0}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "A descentralização por outorga:", "x": "Na outorga, a lei cria ou autoriza a pessoa jurídica, que nasce do Estado e integra sua estrutura (concurso, licitação, Tribunal de Contas). Transfere-se a titularidade. A delegação transfere só a execução, por contrato.", "o": ["Transfere apenas a execução, por contrato, a particular já existente", "Exige licitação prévia e gera remuneração por tarifa ao usuário", "Mantém o Estado como titular, com possibilidade de retomada pelo poder concedente", "Transfere a titularidade, por lei, a entidade da Administração Indireta"], "k": 3}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Qual a diferença central entre descentralização e delegação?", "x": "Outorga transfere a titularidade e se faz por lei; delegação transfere apenas a execução e se faz por contrato. Uma cria estrutura estatal; a outra contrata quem já existe no mercado.", "o": ["A descentralização se faz por contrato; a delegação, por lei", "A descentralização cria estrutura estatal por lei; a delegação contrata quem já existe", "A descentralização mantém a titularidade; a delegação a transfere", "A descentralização dispensa controle; a delegação exige hierarquia"], "k": 1}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Qual forma de delegação é ato unilateral, discricionário e precário, e dispensa licitação?", "x": "A autorização é ato unilateral, discricionário e precário, que atende interesse predominante do beneficiário e fica fora do art. 175. Concessão e permissão exigem licitação.", "o": ["A concessão", "A permissão", "A outorga", "A autorização"], "k": 3}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "A permissão de serviço público caracteriza-se por ser:", "x": "A permissão é contrato de adesão, precário e revogável, aberto a pessoa física ou jurídica, com licitação obrigatória. A concessão é contrato sem precariedade; a autorização é ato unilateral.", "o": ["Contrato de adesão, precário e revogável, precedido de licitação", "Ato unilateral, discricionário e precário, que dispensa a licitação", "Lei específica que cria entidade para executar o serviço", "Contrato bilateral sem precariedade, firmado só com pessoa jurídica"], "k": 0}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "Por que não existe concessionária de socorro público?", "x": "Segundo o STF (Tema 532), atividades de império, como o núcleo do poder de polícia e a segurança pública, são indelegáveis a particular. Serviço essencial e poder de polícia não se delegam.", "o": ["O bombeiro civil já executa integralmente essa atividade", "É atividade de império, serviço essencial e, por isso, indelegável", "É serviço uti singuli, e este não pode ser delegado", "A Constituição proíbe a concessão de qualquer serviço público"], "k": 1}, {"t": "mc", "a": "Aula 5 · Serviço Público", "q": "O bombeiro civil e a brigada de incêndio podem:", "x": "Eles atuam dentro da edificação em que são contratados, com vínculo privado, e podem agir na emergência como qualquer pessoa em gestão de negócios. Analisar projeto, vistoriar, licenciar, notificar, embargar e interditar são atos de império do CBMPR.", "o": ["Colaborar na prevenção e socorrer, sem licenciar nem interditar", "Interditar edificação em risco iminente, em nome do Estado", "Vistoriar e licenciar a edificação em que atuam, no lugar do CBMPR", "Aplicar sanção administrativa ao proprietário da edificação"], "k": 0}, {"t": "vf", "a": "Aula 5 · Serviço Público", "q": "A concessão de serviço público é contrato por prazo certo, precedido de licitação, em que o concessionário explora o serviço por sua conta e risco e se remunera por tarifa paga pelo usuário.", "x": "Verdadeiro. Na concessão, a empresa privada vencedora da licitação explora o serviço por sua conta e risco, mediante contrato por prazo certo, e se remunera por tarifa paga pelo usuário. O Estado mantém a titularidade, fiscaliza e pode retomar o serviço.", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Ato administrativo, na definição de Di Pietro, é a declaração do Estado que:", "x": "Ato administrativo é a declaração do Estado, ou de quem o represente, que, no exercício de prerrogativas públicas, produz efeitos jurídicos, sob regime de direito público e sujeita a controle pelo Judiciário.", "o": ["Independe de manifestação de vontade e decorre de fato natural", "Produz efeitos jurídicos sob regime público e sujeita-se a controle judicial", "Resulta do acordo entre a Administração e o particular", "Regula relações privadas da Administração em pé de igualdade"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "A colisão de uma viatura em deslocamento e a sindicância instaurada para apurá-la são, respectivamente:", "x": "O fato administrativo é o acontecimento que atinge a Administração sem manifestação de vontade voltada a efeito jurídico. A sindicância, a decisão que a conclui e a eventual punição são atos administrativos.", "o": ["Ato administrativo e fato administrativo", "Dois fatos administrativos", "Fato jurídico e ato político", "Fato administrativo e ato administrativo"], "k": 3}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Combater o incêndio, cortar a ferragem e transportar a vítima são:", "x": "Atos materiais são pura execução, sem manifestação de vontade dirigida a produzir efeito jurídico. Por isso nem todo ato da Administração é ato administrativo.", "o": ["Atos administrativos de império", "Atos materiais da Administração", "Atos políticos", "Atos de direito privado"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Os cinco requisitos de validade do ato administrativo são:", "x": "Os requisitos são competência, finalidade, forma, motivo e objeto. A ausência ou o vício de qualquer deles compromete a validade do ato. Mérito não é requisito, e sim a liberdade em motivo e objeto.", "o": ["Competência, finalidade, forma, motivo e mérito", "Agente, finalidade, forma, motivo e conteúdo", "Competência, finalidade, forma, motivo e objeto", "Competência, legalidade, forma, motivação e objeto"], "k": 2}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "A competência para a prática do ato administrativo é:", "x": "A competência decorre sempre de lei: é elemento vinculado, mesmo nos atos discricionários, e é irrenunciável e improrrogável. Admite delegação e avocação, salvo competência exclusiva.", "o": ["Prorrogável livremente por acordo", "Fixada pelo agente, renunciável por conveniência", "Discricionária, nos atos discricionários", "Fixada em lei, irrenunciável e vinculada"], "k": 3}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Interditar uma edificação para retaliar o proprietário que reclamou do serviço configura:", "x": "A finalidade é o fim de interesse público previsto em lei. Usá-la para retaliar é desvio de finalidade (desvio de poder), vício insanável que obriga à anulação, ainda que a irregularidade apontada exista.", "o": ["Vício de forma", "Vício de objeto", "Desvio de finalidade", "Excesso de poder"], "k": 2}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Quando a lei exige forma específica para o ato, sua inobservância acarreta:", "x": "A forma é o modo de exteriorização exigido em lei, em regra escrita e motivada. Exigida forma específica, a inobservância acarreta nulidade.", "o": ["Nulidade do ato", "Cassação do ato", "Mera irregularidade, sem efeitos", "Revogação do ato"], "k": 0}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "No termo de interdição, o elemento “motivo” corresponde:", "x": "Motivo é o pressuposto de fato (o risco constatado, como saída de emergência obstruída) e de direito (a norma que o exige). A proibição de uso é o objeto; a autoridade, a competência; proteger vidas, a finalidade.", "o": ["À autoridade com atribuição para o ato", "Ao objetivo de proteger vidas e patrimônio", "Ao risco constatado e à norma técnica que o proíbe", "À proibição de uso da edificação"], "k": 2}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "O objeto do ato administrativo é:", "x": "Objeto é o conteúdo material do ato, o efeito jurídico imediato que ele produz. Deve ser lícito, possível e determinado.", "o": ["O fim de interesse público previsto em lei para o ato", "O efeito jurídico imediato, lícito, possível e determinado", "A razão de fato e de direito que autoriza a prática do ato", "O modo de exteriorização do ato, em regra escrito e motivado"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "A exposição escrita, no documento, do pressuposto de fato e de direito que autoriza o ato chama-se:", "x": "Motivo é o pressuposto que existe no mundo dos fatos e do direito; motivação é a exposição escrita desse pressuposto. Pode haver motivo sem motivação escrita, e é aí que o ato costuma cair no controle.", "o": ["Objeto", "Motivo", "Motivação", "Finalidade"], "k": 2}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Qual vício NÃO admite convalidação?", "x": "A convalidação supre o vício com efeitos retroativos e cabe nos vícios de competência (salvo exclusiva) e de forma (se não essencial). Não se convalidam vícios de finalidade, motivo e objeto.", "o": ["Vício de finalidade", "Vício de competência não exclusiva", "Assinatura por autoridade de competência delegável", "Vício de forma não essencial"], "k": 0}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Sobre a presunção de legitimidade e veracidade, é correto afirmar que ela:", "x": "A presunção é relativa (admite prova em contrário) e está presente em todos os atos. O ônus de provar o vício é de quem o alega. Documento vago não transfere ônus ao particular.", "o": ["É relativa e inverte o ônus da prova para quem alega o vício", "Existe apenas nos atos vinculados", "Dispensa a descrição precisa dos fatos no ato", "É absoluta e impede a discussão judicial do ato"], "k": 0}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Em qual dos atos a imperatividade NÃO está presente?", "x": "A imperatividade (impor-se a terceiros independentemente de concordância) está nos atos que criam obrigação, como punição, apreensão e interdição. Está ausente na licença, na certidão e no atestado.", "o": ["Atos punitivos em geral", "Certidão e atestado", "Apreensão de bens", "Interdição de edificação"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Qual medida do CBMPR NÃO é autoexecutória?", "x": "A autoexecutoriedade existe quando a lei prevê ou a urgência impõe. Evacuar, lacrar e desobstruir são autoexecutórios. Cobrar multa não paga exige que o Estado vá ao Judiciário, por execução fiscal.", "o": ["Cobrar a multa não paga pelo proprietário", "Evacuar edificação em risco iminente", "Desobstruir rota de fuga", "Lacrar o setor interditado"], "k": 0}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Pela tipicidade, a sanção aplicada pelo CBMPR deve:", "x": "Tipicidade: o ato deve corresponder a figura definida em lei como apta a produzir determinado efeito. Veda o ato inominado; a sanção tem de ser uma das previstas na lei estadual de prevenção ou no regulamento disciplinar.", "o": ["Ser proporcional, ainda que não prevista em lei", "Ser escolhida livremente pela autoridade competente", "Estar prevista na lei ou no regulamento aplicável", "Ser sempre a mais grave em caso de reincidência"], "k": 2}, {"t": "vf", "a": "Aula 6 · Ato Administrativo", "q": "Todos os atos administrativos possuem os quatro atributos, inclusive imperatividade e autoexecutoriedade.", "x": "Falso. A presunção de legitimidade está em todos os atos; imperatividade e autoexecutoriedade estão apenas em alguns.", "o": ["Verdadeiro", "Falso"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "É exemplo de ato vinculado:", "x": "No ato vinculado a lei define todos os elementos, sem juízo de conveniência: presentes os pressupostos, o ato é obrigatório (licença-paternidade). Os demais envolvem margem de escolha.", "o": ["A licença para tratar de interesses particulares", "A priorização das vistorias programadas", "A concessão de licença-paternidade ao militar", "A definição da tática de combate na cena"], "k": 2}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Nos atos discricionários, a liberdade de escolha da Administração recai sobre:", "x": "A liberdade recai apenas sobre motivo e objeto. Competência, finalidade e forma permanecem vinculadas em qualquer ato administrativo, sem exceção.", "o": ["Motivo e objeto", "Competência e finalidade", "Finalidade e objeto", "Competência e forma"], "k": 0}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Sobre os limites da discricionariedade, é correto afirmar que:", "x": "Discricionariedade não é arbitrariedade: a escolha continua sujeita à legalidade, à finalidade e à proporcionalidade, e pode ser controlada quanto a esses limites. Não existe ato inteiramente discricionário.", "o": ["A finalidade é escolhida livremente pelo agente", "A discricionariedade afasta o controle de legalidade", "O ato discricionário dispensa motivação", "Competência, finalidade e forma permanecem sempre vinculadas"], "k": 3}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Mérito administrativo é:", "x": "Mérito é o juízo de oportunidade e conveniência sobre praticar ou não o ato previsto em lei. Só existe onde a lei confere liberdade e incide apenas sobre motivo e objeto.", "o": ["O controle judicial da forma exigida em lei para o ato", "O juízo de legalidade sobre a competência e a forma do ato", "O conjunto dos requisitos vinculados de todo ato administrativo", "O juízo de oportunidade e conveniência sobre praticar o ato"], "k": 3}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "A revogação do ato administrativo:", "x": "Revogação é a retirada de ato válido por oportunidade e conveniência (controle de mérito). Tem efeitos ex nunc e é privativa da Administração que praticou o ato. O Judiciário não revoga ato de outro Poder.", "o": ["Retira ato ilegal por vício na formação, com efeitos ex tunc", "Retira ato válido por razões de mérito, com efeitos ex nunc", "Retira ato válido por descumprimento do beneficiário, ex nunc", "Compete também ao Judiciário, por critério de conveniência"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "Um certificado de regularização emitido com base em documento falso é desfeito por:", "x": "Anulação é o desfazimento do ato por ilegalidade: controle de legalidade, com efeitos ex tunc, realizado pela Administração (autotutela) ou pelo Judiciário, com contraditório e ampla defesa.", "o": ["Revogação, com efeitos a partir do ato", "Anulação, com efeitos desde a origem", "Convalidação, com efeitos retroativos", "Cassação, com efeitos a partir do ato"], "k": 1}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "O estabelecimento deixa de manter as medidas de segurança que fundamentaram o licenciamento, e o certificado é desfeito. Trata-se de:", "x": "Cassação é a extinção do ato válido porque o beneficiário deixou de cumprir os requisitos que deveria continuar atendendo. Funciona como sanção e produz efeitos a partir do ato que a declara.", "o": ["Convalidação", "Revogação", "Anulação", "Cassação"], "k": 3}, {"t": "mc", "a": "Aula 6 · Ato Administrativo", "q": "O Judiciário, ao controlar ato administrativo de outro Poder, pode:", "x": "O Judiciário controla a legalidade e pode anular o ato viciado, sempre por provocação. A revogação é privativa da Administração que praticou o ato, porque oportunidade e conveniência (mérito) não pertencem ao juiz. Vício de finalidade não se convalida.", "o": ["Revogá-lo por oportunidade, se o considerar inconveniente", "Convalidar vício de finalidade, com efeitos retroativos", "Anulá-lo, se ilegal, mas não revogá-lo por conveniência", "Substituir o mérito da Administração pelo seu próprio juízo"], "k": 2}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Contrato administrativo é o ajuste em que a Administração, nessa qualidade:", "x": "É o ajuste que a Administração, nessa qualidade, celebra com pessoa física ou jurídica para alcançar um fim público, sob regime de direito público. O repasse por interesse comum é convênio; a locação sem prerrogativas é contrato de direito privado.", "o": ["Atua por ato unilateral, dispensando o consentimento do contratado", "Contrata em pé de igualdade, sob regime de direito privado comum", "Contrata sob regime de direito público, visando a fim público", "Repassa recursos sem preço, por interesses comuns às partes"], "k": 2}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "O que diferencia o contrato administrativo do contrato comum são:", "x": "O traço distintivo são as cláusulas exorbitantes, que colocam a Administração em posição de supremacia sobre o contratado. Encontro de vontades, obrigações recíprocas e objeto lícito existem em qualquer contrato.", "o": ["O encontro de vontades", "As cláusulas exorbitantes", "A bilateralidade das obrigações", "O objeto lícito e possível"], "k": 1}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Qual das opções abaixo é uma cláusula exorbitante do art. 104 da Lei 14.133/2021?", "x": "As prerrogativas do art. 104 são: alteração unilateral, extinção unilateral, fiscalização, sanções e ocupação provisória. Todas se sujeitam a motivação, contraditório e controle, e a alteração exige recompor o equilíbrio econômico-financeiro.", "o": ["Pagamento antecipado integral ao contratado", "Inalterabilidade do objeto durante a vigência", "Vedação de sanção ao contratado inadimplente", "Ocupação provisória de bens e serviços vinculados ao objeto"], "k": 3}, {"t": "vf", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "As cláusulas exorbitantes são implícitas: incidem ainda que não estejam escritas no contrato, porque decorrem da lei.", "x": "Verdadeiro. A prerrogativa vem da lei, e não da cláusula. Ainda que o contrato nada diga sobre fiscalização ou sanção, a Administração pode fiscalizar e sancionar.", "o": ["Verdadeiro", "Falso"], "k": 0}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "O dever de licitar para contratar tem fundamento:", "x": "O dever de licitar e contratar decorre do art. 37, XXI, da CF. A Lei 14.133/2021 é o marco atual e se aplica ao Estado do Paraná e, portanto, ao CBMPR.", "o": ["No art. 104 do Código Civil", "No art. 37, XXI, da Constituição Federal", "No art. 144, § 5º, da Constituição Federal", "No art. 9º da Lei de Improbidade"], "k": 1}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Por que a Administração, em regra, deve licitar?", "x": "O dinheiro é público e não pertence a quem decide. Sem licitação, a escolha do fornecedor seria simples preferência do administrador; a competição é o mecanismo que impede o favorecimento.", "o": ["O particular só aceita contratar após disputa formal pública", "O dinheiro é público, e a competição evita o favorecimento pessoal", "A licitação garante o menor preço em qualquer contratação", "A licitação substitui a fiscalização posterior do contrato"], "k": 1}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Licitação é o procedimento administrativo:", "x": "Licitação é o procedimento administrativo prévio pelo qual a Administração seleciona a proposta mais vantajosa e assegura igualdade de condições a todos os interessados em contratar.", "o": ["Que dispensa a competição quando o objeto ou o fornecedor é único", "Posterior à assinatura do contrato, destinado a fiscalizar a execução", "Pelo qual o particular escolhe o fornecedor da Administração pública", "Prévio, que escolhe a proposta mais vantajosa com isonomia"], "k": 3}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Qual NÃO é objetivo do processo licitatório previsto no art. 11 da Lei 14.133/2021?", "x": "Os objetivos são: proposta mais vantajosa, isonomia e justa competição, integridade do preço e inovação/sustentabilidade. Vantajoso não é sinônimo de preço de etiqueta mais baixo.", "o": ["Incentivar a inovação e o desenvolvimento sustentável", "Evitar sobrepreço e superfaturamento", "Garantir o menor preço nominal em qualquer hipótese", "Assegurar tratamento isonômico e justa competição"], "k": 2}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "A proposta mais vantajosa, objetivo da licitação, significa:", "x": "Seleciona-se a proposta apta a gerar o resultado de contratação mais vantajoso, considerado inclusive o ciclo de vida do objeto. Vantajoso não é sinônimo de preço de etiqueta mais baixo.", "o": ["O melhor resultado, considerado o ciclo de vida do objeto", "A do licitante com maior experiência no mercado", "Sempre a de menor preço de etiqueta", "A que dispensa a fase de habilitação"], "k": 0}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Evitar contratação com sobrepreço e superfaturamento na execução corresponde ao objetivo de:", "x": "O objetivo III do art. 11 é evitar contratação com sobrepreço ou preço manifestamente inexequível e evitar superfaturamento na execução.", "o": ["Governança das contratações", "Inovação e sustentabilidade", "Isonomia e justa competição", "Integridade do preço"], "k": 3}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Um edital que restringe a competição sem necessidade viola, principalmente:", "x": "A isonomia e a justa competição são o parâmetro que mede toda exigência de edital: a que restringe sem necessidade é ilegal. Preço baixo obtido com restrição indevida à disputa descumpre esse objetivo.", "o": ["A integridade do preço", "A isonomia e a justa competição", "A governança das contratações", "O desenvolvimento nacional sustentável"], "k": 1}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "A contratação direta, em relação ao dever de licitar, é:", "x": "A contratação direta é exceção ao dever de licitar e depende sempre de justificativa formal no processo. Divide-se em dispensa e inexigibilidade.", "o": ["Regra geral para compras de baixo valor e urgentes", "Faculdade livre do gestor, dispensada de motivação formal", "Exceção, sempre com justificativa formal no processo", "Modalidade própria de licitação, com rito simplificado"], "k": 2}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "A compra de peça de reposição fornecida apenas pelo fabricante da autoescada enseja:", "x": "Na inexigibilidade (art. 74) competir é inviável: o objeto ou o fornecedor são únicos (exclusividade, notória especialização). Exige prova da exclusividade nos autos.", "o": ["Dispensa, pois competir é possível", "Dispensa por valor de pequeno vulto", "Licitação na modalidade pregão", "Inexigibilidade, pois competir é inviável"], "k": 3}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Na dispensa de licitação (art. 75):", "x": "Dispensa: competir é possível, mas a lei autoriza não licitar, por valor de pequeno vulto ou por situação específica e taxativa (ex.: emergência ou calamidade). Exige pesquisa de preços e motivação.", "o": ["A pesquisa de preços é meramente facultativa ao gestor", "Competir é possível, mas a lei autoriza não licitar", "Competir é inviável, por haver fornecedor ou objeto único", "A motivação formal nos autos é dispensável em qualquer caso"], "k": 1}, {"t": "vf", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Emergência criada pela própria desídia administrativa pode justificar a dispensa emergencial de licitação.", "x": "Falso. Emergência é situação de fato imprevisível, não etiqueta para pular a licitação. Emergência criada por desídia ou falta de planejamento é falha de gestão, tratada assim pelos órgãos de controle.", "o": ["Verdadeiro", "Falso"], "k": 1}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Na dispensa emergencial (art. 75, VIII), é correto afirmar que:", "x": "A contratação alcança apenas o necessário ao atendimento da situação, com prazo máximo de um ano, vedada a prorrogação, e a lei veda a recontratação da mesma empresa com base na mesma situação emergencial.", "o": ["Fica dispensada a justificativa nos autos", "O prazo é de cinco anos, prorrogável", "É permitida a recontratação da mesma empresa pela mesma emergência", "O prazo máximo é de um ano, vedada a prorrogação"], "k": 3}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Qual órgão exerce controle interno sobre o CBMPR?", "x": "O controle interno é exercido dentro da própria estrutura: hierarquia, autotutela e Corregedoria-Geral do CBMPR (sindicância, PAD, IPM). TCE, MP, Judiciário e Assembleia exercem controle externo.", "o": ["A Corregedoria-Geral do CBMPR", "O Ministério Público", "A Assembleia Legislativa", "O Tribunal de Contas do Estado"], "k": 0}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "O Tribunal de Contas do Estado, ao julgar contas e fiscalizar licitações e contratos do CBMPR, exerce controle:", "x": "O TCE-PR atua em auxílio ao Poder Legislativo no controle externo: aprecia e julga contas, fiscaliza licitações e contratos e a legalidade das despesas, inclusive as custeadas pelo fundo próprio da Corporação.", "o": ["Hierárquico", "Externo", "Interno", "Social"], "k": 1}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Uma reclamação do proprietário sobre vistoria, registrada na Ouvidoria, exemplifica controle:", "x": "O controle social é exercido pelo cidadão, por meio da Ouvidoria, do portal da transparência e do acesso à informação. Ele não instaura processo nem julga contas, mas provoca quem pode fazê-lo.", "o": ["Externo", "Interno", "Judicial", "Social"], "k": 3}, {"t": "mc", "a": "Aula 7 · Contratos, Licitação e Controle", "q": "Sobre as três frentes de controle da Administração, é correto afirmar que:", "x": "As frentes não se excluem e respondem a perguntas diferentes: o interno apura transgressão ou crime militar; o TCE, dano ao erário; o Judiciário, lesão a direito. O controle social alimenta os demais, sem substituí-los.", "o": ["O mesmo fato pode ser apurado nas três frentes ao mesmo tempo", "A absolvição no controle interno encerra a apuração nas demais frentes", "O controle social substitui o controle externo quando há denúncia formal", "O controle externo só pode agir após a decisão do controle interno"], "k": 0}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Os poderes administrativos caracterizam-se por serem:", "x": "Poderes administrativos são instrumentais: existem para servir ao interesse público, não ao agente. Não são faculdades, não se abre mão deles e só se exercem nos limites da lei.", "o": ["Poderes autônomos, que dispensam a lei que os concedeu", "Prerrogativas pessoais do agente, sem limite legal", "Poderes-deveres, irrenunciáveis, exercidos em benefício da coletividade", "Faculdades do agente, renunciáveis por conveniência"], "k": 2}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "O poder hierárquico NÃO existe:", "x": "A hierarquia só existe dentro do mesmo órgão e do mesmo ente federado. Entre entes distintos ou entre a Administração direta e a indireta há vinculação e controle finalístico, não hierarquia.", "o": ["Entre o chefe de socorro e seu subordinado", "Entre superior e subordinado do mesmo ente", "Entre a Administração direta e a indireta", "Entre o comandante e as unidades do mesmo órgão"], "k": 2}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Multar o proprietário de uma edificação é sanção decorrente do:", "x": "Sanção disciplinar atinge quem tem vínculo especial com a Administração (agente público, contratado). Sanção de polícia atinge o particular em geral: multar o proprietário decorre do poder de polícia.", "o": ["Poder disciplinar, que atinge quem tem vínculo especial", "Poder regulamentar, que atinge os destinatários da norma", "Poder hierárquico, que atinge os subordinados", "Poder de polícia, que atinge o particular em geral"], "k": 3}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "O poder regulamentar:", "x": "Detalhar não é inovar: o regulamento vive dentro da lei, nunca acima nem ao lado dela. Onde o regulamento ultrapassa a lei, ele é ilegal e pode ser sustado pelo Legislativo e controlado pelo Judiciário.", "o": ["Revoga a lei que se mostre inconveniente", "Autoriza norma técnica acima da lei", "Cria obrigações novas ao particular por meio de portaria", "Detalha a lei para sua fiel execução, sem criar obrigação nova"], "k": 3}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Segundo o art. 78 do CTN, o poder de polícia é a atividade que:", "x": "É a atividade estatal que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou a abstenção de fato em razão do interesse público. Não destrói o direito: condiciona-o ao bem-estar coletivo.", "o": ["Limita ou disciplina direito, interesse ou liberdade por interesse público", "Incentiva, sem coerção, a iniciativa privada de utilidade pública", "Presta utilidade ou comodidade material à coletividade, sob regime de direito público", "Apura o ilícito penal já praticado, por meio de inquérito policial militar"], "k": 0}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "O poder de polícia administrativa do CBMPR na prevenção a incêndios e desastres tem fundamento:", "x": "A Constituição do Paraná (art. 48-A, EC estadual 53/2022) atribui ao CBMPR o poder de polícia administrativa referente à prevenção a incêndios e desastres, e a Lei 19.449/2018 o disciplina.", "o": ["No art. 48-A da Constituição do Paraná e na Lei 19.449/2018", "Na Lei 14.133/2021, que trata de licitações e contratos", "Exclusivamente no art. 5º, XI, da Constituição Federal e em regulamento", "Na Lei 8.429/1992, que trata da improbidade administrativa"], "k": 0}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "A ordem de evacuação que obriga o ocupante que discorda dela demonstra qual atributo do poder de polícia
