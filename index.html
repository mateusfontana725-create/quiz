<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1b1e23;--mut:#5f6772;--line:#dde1e6;--acc:#1f5fa8;--accsoft:#e8f0fa;--ok:#1b7f3b;--oksoft:#e6f4ea;--bad:#b3261e;--badsoft:#fdecea;--warn:#8a5a00;--warnsoft:#fff4de;--r:12px}
@media (prefers-color-scheme: dark){
  :root{--bg:#121417;--card:#1b1f24;--txt:#eceef1;--mut:#a3abb5;--line:#323840;--acc:#7fb2ee;--accsoft:#1e2d40;--ok:#6fcf8a;--oksoft:#16301f;--bad:#ff8a80;--badsoft:#3a1c1a;--warn:#f0c36a;--warnsoft:#33290f}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:740px;margin:0 auto;padding:18px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--acc)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.hdr{display:flex;gap:8px;align-items:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme: dark){.btn.pri{color:#0d1722}}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.cell:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--mut)}
.chip b{color:var(--txt)}
.chip.rev{background:var(--warnsoft);border-color:transparent;color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
details.map{margin-bottom:14px}
details.map summary{cursor:pointer;color:var(--mut);font-size:14px;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.cell{border:1px solid var(--line);background:var(--card);border-radius:8px;height:34px;font-size:13px}
.cell.ok{background:var(--oksoft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--badsoft);border-color:var(--bad);color:var(--bad)}
.cell.nova{position:relative}
.cell.nova::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#f59e0b}
.cell.cur{outline:2px solid var(--acc);outline-offset:1px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.tag.t{background:var(--accsoft);border-color:transparent;color:var(--acc)}
.tag.new{background:#f59e0b;border-color:transparent;color:#1b1e23;font-weight:700}
.tag.lv{background:var(--warnsoft);border-color:transparent;color:var(--warn)}
.q{font-size:19px;line-height:1.45;margin:6px 0 16px;font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.opt:hover:not(.done){border-color:var(--acc);background:var(--accsoft)}
.opt .let{font-weight:700;min-width:22px;color:var(--mut)}
.opt .st{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.done{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}
.opt.ok .let,.opt.ok .st{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badsoft)}
.opt.bad .let,.opt.bad .st{color:var(--bad)}
.opt.dim{opacity:.55}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-weight:600;font-size:17px;padding:16px 10px;margin:0}
.vf .opt .st{margin-left:8px;padding:0}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:6px solid var(--line)}
.fb.ok{background:var(--oksoft);border-left-color:var(--ok)}
.fb.bad{background:var(--badsoft);border-left-color:var(--bad)}
.verdict{font-size:18px;font-weight:700;margin-bottom:6px}
.fb.ok .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)}
.fb h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.fb p{margin:0 0 6px}
.fb ul{margin:4px 0 0;padding-left:20px}
.fb li{margin-bottom:6px}
.fb li.mine strong{color:var(--bad)}
.muted{color:var(--mut)}
.dica{margin-top:12px;padding:9px 12px;background:var(--warnsoft);color:var(--warn);border-radius:8px;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.hint{margin-top:18px;font-size:13px;color:var(--mut);text-align:center}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-size:56px;font-weight:800;line-height:1}
.score p{margin:6px 0}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0;font-size:14px}
.row .track{grid-column:1 / -1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.row .track i{display:block;height:100%;background:var(--ok)}
.err{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.err summary{cursor:pointer;font-weight:600}
.err .ans{color:var(--ok);font-weight:600;margin:8px 0 4px}
.act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
h2.sec{font-size:15px;margin:22px 0 6px}
@media (max-width:520px){.q{font-size:18px}.card{padding:14px}}
</style>

<script>
const DATA = {"subs": [{"id": "conc", "n": "Conceitos: espaço confinado, silo e engolfamento"}, {"id": "silo", "n": "Silos: tipos e riscos"}, {"id": "engol", "n": "Engolfamento por grãos"}, {"id": "atmo", "n": "Riscos, atmosferas perigosas e intoxicação"}, {"id": "fases", "n": "Fases da operação de resgate"}, {"id": "desmob", "n": "Desmobilização"}, {"id": "resg", "n": "Resgate em silo: passo a passo"}, {"id": "ctrl", "n": "Medidas de controle de riscos"}, {"id": "gerais", "n": "Riscos gerais e prevenção"}, {"id": "norm", "n": "Normas, PET e responsabilidades"}, {"id": "epi", "n": "EPR, claustrofobia e fator de queda"}], "q": [{"id": "c01", "sub": "conc", "t": "mc", "q": "Segundo a NR-33, o que define um espaço confinado?", "alts": ["Qualquer ambiente fechado e pequeno em que o trabalhador precise se abaixar, se agachar ou se contorcer para executar o serviço, independentemente da ventilação", "Área projetada para ocupação humana contínua, bem ventilada e com atmosfera normal, mas de acesso restrito apenas a pessoas autorizadas pela empresa", "Área não projetada para ocupação humana contínua, com entrada e saída limitadas e ventilação insuficiente, ou com risco de falta ou excesso de oxigênio", "Qualquer ambiente abaixo do nível do solo, como porões, galerias e valas, mesmo com amplas aberturas, boa ventilação natural e atmosfera normal"], "c": 2, "why": ["O tamanho do local e a postura do trabalhador não definem o espaço confinado.", "Se é feito para ocupação contínua e tem boa ventilação, falta a base da definição. Restringir o acesso não torna o espaço confinado.", null, "Estar abaixo do solo não basta. A definição olha o projeto, o acesso e a atmosfera."], "e": "A definição combina três ideias: o espaço não foi projetado para ocupação humana contínua, tem meios limitados de entrada e saída e a ventilação existente não remove contaminantes (ou pode haver falta ou excesso de oxigênio). Essa é a base de toda a matéria. Complemento da NR-33, pois o conceito não aparece nos slides.", "d": "Não é feito para ficar + entra e sai mal + o ar pode ser ruim.", "n": 1}, {"id": "c02", "sub": "conc", "t": "mc", "q": "Qual item faz parte da definição de espaço confinado da NR-33?", "alts": ["Meios limitados de entrada e saída", "Profundidade mínima de dois metros", "Obrigatoriedade de ser fechado por tampa ou porta", "Volume interno superior a dez metros cúbicos"], "c": 0, "why": [null, "A profundidade não é critério da definição.", "Um espaço pode ser aberto por cima e mesmo assim ser confinado. O que importa é a dificuldade de entrar e sair.", "A definição não fixa volume mínimo. O volume entra no cadastro, mas não define o espaço."], "e": "A norma fala em meios limitados de entrada e saída, ventilação insuficiente e possibilidade de atmosfera com falta ou excesso de oxigênio. Medidas como profundidade e volume não fazem parte do conceito. Complemento da NR-33.", "d": "Definição = acesso limitado, não medida em metros.", "n": 2}, {"id": "c03", "sub": "conc", "t": "mc", "q": "O que é um silo, no contexto do curso?", "alts": ["Estrutura de armazenamento de grãos, como torre, bunker ou bolsa, considerada espaço confinado", "Equipamento que separa as impurezas dos grãos logo na entrada da unidade agrícola, antes dos elevadores", "Elevador que leva os grãos até o topo da torre de armazenagem", "Ventilador que mantém a temperatura da massa de grãos"], "c": 0, "why": [null, "Isso descreve o separador, que é outro componente do sistema.", "Isso descreve os elevadores. O silo é o local de armazenagem.", "O ventilador controla a temperatura, mas é um equipamento do silo, e não o silo."], "e": "O silo é a estrutura onde os grãos ficam armazenados. O curso mostra três tipos: torre, bunker e bolsa. A aula afirma de forma direta que um silo é considerado espaço confinado, por isso as regras de entrada, PET e resgate se aplicam a ele.", "d": "Silo = armazena grãos = espaço confinado.", "n": 1}, {"id": "c04", "sub": "conc", "t": "mc", "q": "Como se define engolfamento?", "alts": ["Perda de consciência causada por atmosfera com deficiência de oxigênio dentro do espaço", "Queda do trabalhador de uma altura dentro do espaço, com trauma por impacto no fundo", "Captura da pessoa por líquido ou sólido granular que escoa, como grãos, com risco de asfixia", "Explosão de poeira em suspensão que lança o trabalhador contra a parede do espaço"], "c": 2, "why": ["Isso é asfixia por atmosfera. No engolfamento, a pessoa é capturada por um material.", "Isso é queda. No engolfamento o perigo é ser coberto e comprimido pelo material.", null, "Isso é explosão. O engolfamento não depende de ignição."], "e": "Engolfamento é a captura da pessoa por material que escoa. Em silos, o material são os grãos. A pessoa afunda, os grãos cobrem as vias aéreas e comprimem o tórax. O curso chama o aprisionamento ou engolfamento por grãos de maior risco do silo. Definição técnica de complemento.", "d": "Engolfamento = coberto pelo material que escoa.", "n": 2}, {"id": "c05", "sub": "conc", "t": "mc", "q": "O que caracteriza o encarceramento em um espaço confinado?", "alts": ["A vítima é coberta e capturada por um material que escoa, como grãos ou líquido", "Vítima presa ou imobilizada por estrutura, equipamento ou pela geometria do espaço", "A vítima perde a consciência por inalar gases tóxicos presentes na atmosfera do espaço", "A entrada do espaço é fechada e etiquetada por bloqueio de energia após a saída da equipe"], "c": 1, "why": ["Isso é engolfamento, e não encarceramento.", null, "Isso é intoxicação. Ela pode ocorrer sem que a vítima esteja presa.", "Isso é isolamento do espaço, uma medida de segurança, e não um acidente."], "e": "Encarceramento é ficar preso, seja por uma estrutura interna, por um equipamento ou pelo formato apertado do espaço. A diferença para o engolfamento é o que prende: no primeiro é algo rígido, no segundo é um material que escoa. Definição técnica de complemento.", "d": "Encarceramento = preso por algo rígido.", "n": 2}, {"id": "c06", "sub": "conc", "t": "mc", "q": "A gestão de segurança e saúde no espaço confinado deve ser:", "alts": ["Planejada e implementada, dispensando avaliação posterior", "Programada apenas depois da ocorrência de um acidente", "Implementada pelo vigia, sem planejamento prévio", "Planejada, programada, implementada e avaliada"], "c": 3, "why": ["A avaliação faz parte do ciclo e permite corrigir falhas.", "A gestão é preventiva, e não reação a um acidente.", "Planejar vem antes, e a responsabilidade é do empregador.", null], "e": "A Aula 02 apresenta quatro verbos: planejada, programada, implementada e avaliada. É um ciclo de gestão. A avaliação fecha o ciclo e mostra o que precisa melhorar.", "d": "Planejar, programar, implementar, avaliar.", "n": 1}, {"id": "c07", "sub": "conc", "t": "mc", "q": "Além das técnicas de prevenção, o que a gestão de SST em espaço confinado deve incluir?", "alts": ["Medidas administrativas, medidas pessoais (capacitação e proteção) e capacitação específica", "Apenas o fornecimento de EPI e EPR aos entrantes, com troca periódica dos equipamentos e treinamento anual", "Somente a emissão da PET antes de cada entrada e o arquivamento dela por cinco anos", "Somente a contratação de uma equipe externa de resgate para atuar nas emergências"], "c": 0, "why": [null, "EPI e EPR são só uma parte das medidas pessoais.", "A PET é uma medida administrativa importante, mas a gestão é mais ampla.", "Resgate é parte do plano de emergência. A gestão cobre prevenção, administração e pessoas."], "e": "A gestão reúne técnicas de prevenção, medidas administrativas (como a PET e os procedimentos), medidas pessoais (capacitação e proteção) e a capacitação específica para o trabalho em espaço confinado.", "d": "Prevenção + administração + pessoas + capacitação.", "n": 2}, {"id": "c08", "sub": "conc", "t": "mc", "q": "Como um silo é tratado em relação às regras de trabalho em espaços confinados?", "alts": ["Não é, pois fica ao ar livre e tem grande volume", "Só é considerado quando está vazio e fechado", "É um equipamento e por isso fica fora do alcance da NR-33", "É considerado um espaço confinado"], "c": 3, "why": ["O tamanho e o fato de ficar ao ar livre não afastam o risco. O silo tem acesso limitado e atmosfera que pode ser perigosa.", "Com grãos ou sem grãos, o silo segue sendo espaço confinado.", "A NR-33 trata de ambientes. O silo é um ambiente de trabalho com acesso limitado.", null], "e": "A Aula 08 abre a lista de riscos com a frase: um silo é considerado um espaço confinado. Por isso valem análise de risco, PET, monitoramento da atmosfera e equipe de resgate preparada.", "d": "Silo é espaço confinado, sempre.", "n": 1}, {"id": "x01", "sub": "gerais", "t": "mc", "q": "Por que o monitoramento médico inclui a pesagem dos participantes na entrada e na saída do espaço?", "alts": ["Porque o peso do trabalhador define qual EPR pode ser usado no espaço", "Porque ganho de peso durante a entrada indica risco de engolfamento", "Porque perda de mais de 2 kg, cerca de 2 litros de líquido, é sinal de alerta de calor excessivo e desidratação", "Porque o peso serve para calcular a autonomia do cilindro de ar"], "c": 2, "why": ["O peso não define o EPR. A escolha depende do ar e do espaço.", "O indicador do curso é a perda de líquido, e não o ganho de peso.", null, "A autonomia usa volume, pressão e consumo. O peso do corpo não entra no cálculo."], "e": "A Aula 06 manda pesar os participantes na entrada, antes e depois. Perda de mais de 2 kg (cerca de 2 litros) é sinal de alerta. Junto com temperatura acima de 38 °C e frequência cardíaca acima de 85% da máxima, indica calor excessivo e desidratação. Por isso a hidratação deve ser garantida.", "d": "Pesou antes e depois: perdeu 2 kg, alerta.", "n": 2}, {"id": "c10", "sub": "conc", "t": "mc", "q": "Durante a descarga de um silo, um trabalhador é coberto por grãos que escoam e não consegue respirar. Esse acidente é um caso de:", "alts": ["Encarceramento por estrutura", "Colapso da estrutura do silo", "Intoxicação por gases de fermentação", "Engolfamento"], "c": 3, "why": ["Não há estrutura prendendo a vítima. Ela foi coberta por material que escoa.", "O colapso é a falha das paredes. Aqui a estrutura continua íntegra.", "O problema descrito é a cobertura por grãos, e não um gás.", null], "e": "Ser coberto por grãos que escoam, com dificuldade de respirar, é o quadro típico do engolfamento. A principal causa de morte nesses casos é a asfixia.", "d": "Coberto por grãos = engolfamento.", "n": 1}, {"id": "s01", "sub": "silo", "t": "mc", "q": "Quais são os tipos de silo apresentados no curso?", "alts": ["Torre, poço e esfera", "Bunker, tanque elevado e duto", "Bolsa, galpão aberto e reservatório", "Torre, bunker e bolsa"], "c": 3, "why": ["Poço e esfera não foram apresentados como tipos de silo.", "Tanque elevado e duto não são tipos de silo do curso.", "O armazém graneleiro horizontal aparece no sistema da unidade, mas não como tipo de silo.", null], "e": "A Aula 08 mostra três tipos: silo torre (vertical, metálico), silo bunker (estrutura baixa e comprida) e silo bolsa (grãos dentro de uma bolsa plástica).", "d": "Torre, bunker, bolsa.", "n": 1}, {"id": "s02", "sub": "silo", "t": "mc", "q": "Na unidade agrícola mostrada no curso, qual é a ordem dos componentes numerados, do 1 ao 5?", "alts": ["Separador, descarga (moega), silo vertical, elevadores e armazém graneleiro horizontal", "Descarga (moega), separador, elevadores, silo vertical e armazém graneleiro horizontal", "Elevadores, descarga (moega), separador, armazém graneleiro horizontal e silo vertical", "Silo vertical, separador, elevadores, descarga (moega) e armazém graneleiro horizontal"], "c": 1, "why": ["A descarga na moega é o primeiro ponto, onde o grão chega.", null, "Os elevadores aparecem depois da descarga e do separador.", "O silo vertical vem depois dos elevadores, e não no início."], "e": "O esquema da Aula 08 numera: 1 descarga (moega), 2 separador, 3 elevadores, 4 silo vertical e 5 armazém graneleiro horizontal. Isso acompanha o caminho do grão: chega, é limpo, sobe e é armazenado.", "d": "Chega, limpa, sobe, guarda.", "n": 2}, {"id": "s03", "sub": "silo", "t": "mc", "q": "Por que se faz o monitoramento da temperatura e a ventilação dos grãos armazenados?", "alts": ["Para evitar que os grãos congelem e travem a descarga", "Porque a umidade nos grãos favorece pragas e fermentação", "Para reduzir o peso da massa de grãos sobre as paredes", "Para eliminar a poeira explosiva dos elevadores"], "c": 1, "why": ["O objetivo é impedir fermentação e pragas, e não congelamento.", null, "A ventilação não muda o peso. Ela controla temperatura e umidade.", "A poeira dos elevadores é outro risco, tratado por outras medidas."], "e": "Grãos úmidos esquentam, atraem pragas e fermentam, e a fermentação produz gases. Por isso se monitora a temperatura e se faz ventilação forçada.", "d": "Umidade → pragas e fermentação → gás.", "n": 1}, {"id": "s04", "sub": "silo", "t": "mc", "q": "Qual meio de controle de temperatura da massa de grãos é mostrado no curso?", "alts": ["Aspersão de água sobre a massa de grãos", "Vedação total do silo para impedir trocas de ar", "Ventilação forçada por canaletas, com ventilador", "Retirada manual periódica dos grãos por entrantes"], "c": 2, "why": ["Água aumenta a umidade e a pressão, o contrário do que se quer.", "Sem trocas de ar, o calor e a umidade ficam retidos.", null, "Isso expõe pessoas ao risco de engolfamento e não controla a temperatura."], "e": "O curso mostra ventiladores que insuflam ar pelas canaletas do piso, resfriando e secando a massa de grãos. É a ventilação forçada por canaletas.", "d": "Ar frio pelas canaletas.", "n": 2}, {"id": "s05", "sub": "silo", "t": "mc", "q": "Qual alternativa lista corretamente riscos de silos destacados no curso?", "alts": ["Gases de combustão de motores, descargas atmosféricas, afogamento e exposição constante à radiação", "Gases tóxicos de fermentação, poeira explosiva, colapso da estrutura e engolfamento por grãos", "Somente queda de altura e choque elétrico em elevadores", "Poeira explosiva e colapso, sendo o engolfamento raro e secundário"], "c": 1, "why": ["Esses riscos não são os destacados na aula de silos.", null, "Existem, mas a aula destaca outros riscos, ligados ao grão e à estrutura.", "O engolfamento é apontado como o maior risco, e não como risco raro."], "e": "A Aula 08 destaca quatro riscos: gases tóxicos pela fermentação ou decomposição, nuvem de poeira explosiva gerada na movimentação dos grãos, colapso da estrutura por pressão interna e aprisionamento ou engolfamento por grãos.", "d": "Gás, poeira, colapso, engolfamento.", "n": 1}, {"id": "s06", "sub": "silo", "t": "mc", "q": "Qual é considerado o maior risco em silos, segundo o curso?", "alts": ["Aprisionamento ou engolfamento por grãos", "Explosão da nuvem de poeira em elevadores e esteiras", "Colapso da estrutura por pressão interna dos grãos", "Intoxicação por gases da fermentação dos grãos"], "c": 0, "why": [null, "É um risco grave, mas o curso aponta o aprisionamento como o maior.", "Dá sinais antes (rachaduras e inclinação) e não é o maior risco.", "É um risco real, mas não o maior. Pode ser controlado por monitoramento e ventilação."], "e": "A frase da aula é clara: o maior risco ainda é o aprisionamento ou engolfamento por grãos. Mais da metade dos aprisionamentos é fatal.", "d": "Maior risco = ser engolido pelos grãos.", "n": 1}, {"id": "s07", "sub": "silo", "t": "mc", "q": "Qual NÃO é um dos cinco elementos necessários para a explosão em silos?", "alts": ["Dispersão da poeira no ar", "Confinamento da poeira (espaço confinado)", "Fonte de ignição", "Umidade elevada nos grãos"], "c": 3, "why": ["É um dos cinco elementos. Sem poeira em suspensão não há explosão.", "É um dos cinco elementos.", "É um dos cinco elementos.", null], "e": "O pentágono da explosão em silos reúne: combustível (poeira), oxigênio, espaço confinado, fonte de ignição e dispersão da poeira. A umidade não faz parte e, aliás, está ligada a outro problema: fermentação e pragas.", "d": "Poeira, oxigênio, confinamento, ignição, dispersão.", "n": 2}, {"id": "s08", "sub": "silo", "t": "mc", "q": "Como costuma ocorrer a explosão secundária em um silo?", "alts": ["Por ignição espontânea dos grãos úmidos no fundo do silo, horas depois da primeira explosão e da onda de choque", "A onda de choque e o calor da primeira explosão levantam e inflamam uma nuvem de poeira, como no depósito", "Pelo acúmulo de metano que escapa da primeira explosão pelo teto e se inflama em seguida", "Pelo rompimento da parede do silo devido à pressão da descarga dos grãos e da água"], "c": 1, "why": ["A explosão secundária ocorre logo depois da primária, pela nuvem de poeira.", null, "O mecanismo descrito no curso é a nuvem de poeira, e não o metano.", "Isso é colapso da estrutura, outro risco."], "e": "Normalmente ocorre uma pequena explosão em elevadores e esteiras (primária). O calor e a onda de choque dispersam e atingem uma nuvem de poeira em um depósito, causando a explosão secundária, em geral maior.", "d": "Primária no elevador, secundária no depósito.", "n": 3}, {"id": "x06", "sub": "ctrl", "t": "mc", "q": "Qual conjunto reúne medidas de prevenção de acidentes em silos destacadas no curso?", "alts": ["Uso de capacete e luvas, com entrada em dupla e sem corda de segurança", "Entrada com o equipamento em funcionamento para liberar a crosta mais rápido", "Monitoramento apenas da temperatura, dispensando o sistema de restrição", "Sistema de gestão de segurança e saúde no trabalho, com sistema de restrição com cinto de segurança e corda obrigatório"], "c": 3, "why": ["Sem corda, a dupla pode ser engolfada junta.", "Essa é a causa principal de aprisionamento, e não uma medida.", "Temperatura não previne engolfamento. A restrição é obrigatória.", null], "e": "O curso destaca dois pilares: um sistema de gestão de segurança no trabalho, que contribui para evitar acidentes, e o uso obrigatório de restrição com cinto de segurança e corda. Essas medidas reduzem o risco de aprisionamento, que é o maior risco do silo.", "d": "Gestão + cinto e corda.", "n": 2}, {"id": "s10", "sub": "silo", "t": "mc", "q": "O que pode aumentar a pressão interna sobre as paredes e levar ao colapso do silo?", "alts": ["A ventilação forçada por canaletas na massa de grãos armazenados", "A queda da temperatura da massa de grãos durante a noite e a madrugada", "O monitoramento contínuo da umidade e da temperatura dos grãos", "A pressão da descarga dos grãos e o acúmulo de água junto com os grãos"], "c": 3, "why": ["A ventilação ajuda a manter os grãos secos e não aumenta a pressão.", "A temperatura não é a causa citada.", "O monitoramento é uma medida de controle, e não uma causa.", null], "e": "O curso cita dois fatores: a pressão da descarga dos grãos, que pode forçar as paredes, e o acúmulo de água com os grãos, que aumenta a pressão interna.", "d": "Descarga + água = parede forçada.", "n": 2}, {"id": "s11", "sub": "silo", "t": "mc", "q": "De onde vêm os gases tóxicos citados entre os riscos de silos?", "alts": ["Da queima de combustível nos elevadores e esteiras", "De tubulações de gás natural próximas ao silo", "Da fermentação ou decomposição dos grãos", "Da evaporação de solventes de limpeza"], "c": 2, "why": ["Não é a origem apontada para os gases tóxicos de silo.", "O risco apontado é interno, do próprio grão.", null, "Não é a origem citada."], "e": "Grãos úmidos fermentam e se decompõem, e esse processo libera gases tóxicos e pode reduzir o oxigênio. Por isso a atmosfera do silo precisa ser testada antes e durante a entrada.", "d": "Grão que fermenta solta gás.", "n": 2}, {"id": "s12", "sub": "silo", "t": "mc", "q": "Por que a movimentação de grãos em elevadores e esteiras é um risco?", "alts": ["Faz os grãos fermentarem imediatamente", "Pode gerar uma nuvem de poeira explosiva", "Aumenta a pressão sobre as paredes do silo", "Produz gases tóxicos por atrito"], "c": 1, "why": ["A fermentação vem da umidade, e não da movimentação.", null, "A pressão sobre as paredes está ligada à descarga e à água.", "O curso aponta poeira, e não gases, como efeito da movimentação."], "e": "Ao movimentar os grãos, a poeira vai para o ar. Misturada ao oxigênio, em espaço confinado e com uma fonte de ignição, pode explodir.", "d": "Movimentou grão, levantou poeira.", "n": 1}, {"id": "e01", "sub": "engol", "t": "mc", "q": "Quais são os três tipos básicos de engolfamento por grãos apresentados no curso?", "alts": ["Crosta em ponte, queda em poço e crosta em teto", "Crosta em ponte, máquina em funcionamento e crosta em parede", "Máquina em funcionamento, colapso lateral e afogamento", "Crosta em parede, vazamento de tubulação e máquina parada"], "c": 1, "why": ["Queda em poço e crosta em teto não são tipos apresentados.", null, "Colapso e afogamento não são tipos de engolfamento do curso.", "Máquina parada não gera engolfamento, e o vazamento de tubulação não é um tipo."], "e": "A Aula 08 mostra três tipos: crosta em ponte (grãos endurecidos sobre um vazio), máquina em funcionamento (fluxo de descarga que arrasta a pessoa) e crosta em parede (massa de grãos aderida à parede que desaba).", "d": "Ponte, máquina, parede.", "n": 1}, {"id": "e02", "sub": "engol", "t": "mc", "q": "Qual é a principal causa de morte no aprisionamento em grãos?", "alts": ["Asfixia", "Trauma craniano por queda", "Intoxicação por gases de fermentação", "Hipotermia"], "c": 0, "why": [null, "A queda não é a causa principal de morte nesse tipo de acidente.", "Os gases são um risco do silo, mas a causa principal no aprisionamento é outra.", "Não é a causa citada."], "e": "Os grãos cobrem as vias aéreas e comprimem o tórax, e a pessoa não consegue respirar. Por isso a asfixia é a principal causa de morte.", "d": "Aprisionado em grãos morre de asfixia.", "n": 1}, {"id": "e03", "sub": "engol", "t": "mc", "q": "Qual é a causa principal de aprisionamento em grãos?", "alts": ["O colapso espontâneo da parede do silo por rachaduras e inclinação", "A falha no sistema de ventilação que controla a temperatura dos grãos", "A entrada para liberar crosta de grãos com o equipamento funcionando", "A entrada para inspeção visual com o equipamento bloqueado e etiquetado"], "c": 2, "why": ["O colapso é outro risco e não é a causa principal do aprisionamento.", "Não é a causa apontada.", null, "Com o equipamento bloqueado, o risco de ser arrastado pelo fluxo cai muito."], "e": "A situação típica é a pessoa entrar para soltar uma crosta ou desobstruir a saída com a máquina ligada. O fluxo de grãos a puxa para baixo. Por isso o primeiro passo de qualquer entrada é bloquear a energia e o fluxo de saída.", "d": "Máquina ligada + pessoa dentro = acidente.", "n": 2}, {"id": "e04", "sub": "engol", "t": "mc", "q": "Em quanto tempo uma pessoa pode ficar completamente aprisionada em grãos?", "alts": ["Em cerca de 5 minutos", "Em aproximadamente 2 minutos", "Em mais de 10 minutos", "Em menos de 30 segundos"], "c": 3, "why": ["O curso mostra que o tempo é bem menor.", "Ainda é tempo demais para o que o curso mostra.", "Esse tempo daria folga para pedir ajuda, o que não ocorre.", null], "e": "Em menos de 30 segundos a pessoa pode estar completamente aprisionada. Por isso o socorro sem preparo prévio quase nunca chega a tempo, e a prevenção (bloqueio e sistema de restrição) é decisiva.", "d": "30 segundos.", "n": 1}, {"id": "e05", "sub": "engol", "t": "mc", "q": "Qual conjunto de fatos sobre aprisionamento em grãos está correto?", "alts": ["Mais da metade é fatal, e cerca de 70% ocorrem em fazendas", "Menos da metade é fatal, e cerca de 70% ocorrem em fazendas", "Mais da metade é fatal, e cerca de 70% ocorrem em estabelecimentos comerciais", "Menos da metade é fatal, e cerca de 70% ocorrem em estabelecimentos comerciais"], "c": 0, "why": [null, "Mais da metade dos aprisionamentos é fatal.", "Os 70% ocorrem em fazendas, e o restante em estabelecimentos comerciais.", "Erra nos dois pontos."], "e": "Os dados da Aula 08: a asfixia é a principal causa de morte, mais de metade dos aprisionamentos é fatal e cerca de 70% acontecem em fazendas, ficando o restante em estabelecimentos comerciais.", "d": "Mais de 50% fatal; 70% em fazendas.", "n": 2}, {"id": "e06", "sub": "engol", "t": "mc", "q": "Um trabalhador caminha sobre uma camada endurecida de grãos formada sobre um vazio, e ela cede. Qual é o tipo de engolfamento?", "alts": ["Crosta em parede", "Crosta em ponte", "Máquina em funcionamento", "Explosão secundária"], "c": 1, "why": ["Na crosta em parede, a massa está aderida à lateral do silo.", null, "Não há máquina arrastando os grãos.", "Não há explosão no cenário."], "e": "Na crosta em ponte, os grãos formam uma camada que parece firme, mas há um vazio embaixo. Quando a pessoa pisa, a crosta cede e ela afunda.", "d": "Ponte = crosta sobre vazio.", "n": 2}, {"id": "e07", "sub": "engol", "t": "mc", "q": "Um trabalhador entra em um silo com a rosca de descarga ligada e é puxado para baixo pelo fluxo dos grãos. Qual é o tipo de engolfamento?", "alts": ["Crosta em ponte", "Máquina em funcionamento", "Crosta em parede", "Colapso da estrutura do silo"], "c": 1, "why": ["Não há crosta cedendo sobre um vazio.", null, "Não há massa de grãos desabando da parede.", "A estrutura está íntegra. O que arrasta a pessoa é o fluxo."], "e": "Quando a saída de grãos está aberta e a máquina funcionando, o fluxo forma um funil e puxa a pessoa. É a causa mais comum de aprisionamento, e por isso a energia e o fluxo precisam ser bloqueados antes de qualquer entrada.", "d": "Fluxo ligado puxa a pessoa.", "n": 1}, {"id": "e08", "sub": "engol", "t": "mc", "q": "Um trabalhador cava a base de uma massa de grãos aderida à parede do silo, e ela desaba sobre ele. Qual é o tipo de engolfamento?", "alts": ["Máquina em funcionamento", "Crosta em ponte", "Crosta em parede", "Colapso da estrutura do silo"], "c": 2, "why": ["O cenário não envolve fluxo de máquina.", "Na crosta em ponte, a pessoa pisa sobre a crosta. Aqui a massa desaba da parede.", null, "A estrutura não cai. É a massa de grãos que desaba."], "e": "Na crosta em parede, os grãos ficam grudados à parede, e quem trabalha por baixo ou ao lado pode ser atingido quando a massa se solta de uma vez.", "d": "Parede = massa colada que desaba.", "n": 2}, {"id": "e09", "sub": "engol", "t": "mc", "q": "O que o gráfico da força necessária para retirar uma pessoa de 80 kg mostra?", "alts": ["Quanto mais fundo a vítima está, maior a força necessária, chegando a centenas de quilos", "A força é constante em qualquer profundidade e igual ao peso da vítima, 80 kg", "A força diminui com a profundidade, porque os grãos afrouxam ao redor do corpo", "A força só aumenta nos primeiros 30 cm e depois se estabiliza em torno de 100 kg"], "c": 0, "why": [null, "A força cresce muito com a profundidade e passa bastante do peso da vítima.", "É o contrário: os grãos comprimem mais.", "O gráfico segue crescendo até a maior profundidade."], "e": "O gráfico mostra a força crescendo de cerca de 85 kg para até 700 kg conforme a vítima afunda. Ninguém consegue puxar uma pessoa nessas condições. Por isso se retiram os grãos do entorno, e não a vítima dos grãos.", "d": "Mais fundo, muito mais força.", "n": 2}, {"id": "e10", "sub": "engol", "t": "mc", "q": "Qual medida de prevenção é obrigatória para quem entra em silo com grãos?", "alts": ["Apenas capacete e calçado de segurança", "Entrar em dupla, sem corda, para um socorrer o outro", "Sistema de restrição com cinto de segurança e corda", "Trabalhar com o equipamento ligado para encurtar a exposição"], "c": 2, "why": ["Esses EPIs não impedem o afundamento nos grãos.", "Sem corda, os dois podem ser engolfados.", null, "Equipamento ligado é a principal causa de aprisionamento."], "e": "O uso de sistema de restrição com cinto e corda é obrigatório, junto com um sistema de gestão de segurança que ajude a evitar o acidente.", "d": "Cinto + corda, sempre.", "n": 1}, {"id": "e11", "sub": "engol", "t": "mc", "q": "Por que o engolfamento por grãos é tão letal, mesmo quando a vítima ainda está viva ao ser coberta?", "alts": ["O calor dos grãos fermentados causa queimaduras graves em segundos", "Os gases tóxicos dos grãos intoxicam a vítima antes do soterramento", "O choque elétrico dos equipamentos de descarga atinge a vítima", "Os grãos obstruem as vias aéreas e comprimem o tórax, levando à asfixia"], "c": 3, "why": ["Esse não é o mecanismo de morte descrito.", "Gases são um risco à parte. A asfixia pelos grãos é a principal causa de morte.", "Não é o mecanismo de morte descrito.", null], "e": "O curso indica a asfixia como principal causa de morte. Os grãos cobrem a boca e o nariz e pressionam o peito, impedindo a respiração. A descrição do mecanismo é complemento técnico.", "d": "Cobriu e comprimiu: asfixia.", "n": 2}, {"id": "e12", "sub": "engol", "t": "mc", "q": "Um colega tenta puxar pelos braços uma vítima afundada até o peito nos grãos. Por que isso está errado?", "alts": ["Porque só é permitido içar a vítima com máquinas e equipamentos da própria fazenda ou do vizinho", "A força necessária é muito maior que o peso da vítima; o correto é remover os grãos ao redor", "Porque a vítima deve sair sozinha para evitar lesões na coluna e nos braços", "Porque basta esperar a descarga esvaziar o silo para a vítima ficar livre"], "c": 1, "why": ["O içamento é feito com sistema de recuperação com vantagem mecânica, e não com máquinas da fazenda.", null, "Ela não consegue sair sozinha.", "Descarregar com a vítima dentro aumenta o risco e a pressão dos grãos."], "e": "O princípio do resgate em silo é retirar os grãos da vítima, e não a vítima dos grãos. Puxar exige centenas de quilos de força e pode causar lesões. A solução é bloquear os grãos ao redor e removê-los com baldes, pás ou aspirador.", "d": "Tire o grão da vítima, não a vítima do grão.", "n": 3}, {"id": "a01", "sub": "atmo", "t": "mc", "q": "Quais são os principais meios (vias) de intoxicação em um espaço confinado?", "alts": ["Apenas inalação, pois só o ar do espaço pode estar contaminado", "Inalação e exposição à radiação ionizante", "Contato com a pele e exposição ao ruído", "Inalação, contato e absorção pela pele e ingestão"], "c": 3, "why": ["Há também o contato com a pele e a ingestão.", "Radiação não é via de intoxicação química.", "Ruído é um risco físico, e não via de intoxicação.", null], "e": "As vias são a respiratória (inalação de gases, vapores e poeiras), a cutânea (contato e absorção pela pele) e a digestiva (ingestão). Em espaços confinados a mais relevante é a inalação. Complemento técnico.", "d": "Respirar, tocar, engolir.", "n": 1}, {"id": "a02", "sub": "atmo", "t": "mc", "q": "Um trabalhador sofre respingos de produto químico líquido que atravessa a pele. Qual é o meio de intoxicação?", "alts": ["Absorção pela pele (via cutânea)", "Inalação (via respiratória)", "Ingestão (via digestiva)", "Asfixia por deficiência de oxigênio"], "c": 0, "why": [null, "O produto entrou pelo contato com a pele, e não pela respiração.", "Não houve engolimento do produto.", "Asfixia é falta de oxigênio, e não intoxicação por contato."], "e": "Líquidos e vapores podem ser absorvidos pela pele. Por isso as roupas de proteção são escolhidas conforme o perigo: o nível B protege contra respingos e contaminações líquidas.", "d": "Respingo na pele = via cutânea.", "n": 1}, {"id": "a03", "sub": "atmo", "t": "mc", "q": "Qual faixa de oxigênio é considerada atmosfera perigosa?", "alts": ["Abaixo de 20,9% ou acima de 21,5%", "Abaixo de 16% ou acima de 25%", "Abaixo de 19,5% ou acima de 23,5%", "Somente abaixo de 19,5%"], "c": 2, "why": ["Os limites são mais amplos. O ar normal tem 20,9%.", "Os limites de alerta são 19,5% e 23,5%.", null, "O excesso de oxigênio, acima de 23,5%, também é perigoso."], "e": "Abaixo de 19,5% o ar é deficiente em oxigênio, com problemas respiratórios e cognitivos. Acima de 23,5% há risco extremo de incêndio e explosão. O ar normal tem 20,9%.", "d": "19,5 e 23,5.", "n": 1}, {"id": "a04", "sub": "atmo", "t": "mc", "q": "Qual é o principal risco de uma atmosfera com oxigênio acima de 23,5%?", "alts": ["Intoxicação química aguda dos entrantes", "Asfixia imediata por falta de ar", "Claustrofobia aguda nos entrantes", "Risco extremo de incêndio e explosão"], "c": 3, "why": ["O excesso de oxigênio não intoxica por si só.", "A asfixia está ligada à falta de oxigênio.", "É um quadro psicológico e não depende do teor de oxigênio.", null], "e": "O enriquecimento de oxigênio faz materiais comuns queimarem com muito mais facilidade. Por isso é considerado limite máximo seguro.", "d": "Oxigênio demais = fogo e explosão.", "n": 1}, {"id": "a05", "sub": "atmo", "t": "mc", "q": "Um detector marca 19,9% de oxigênio em um espaço confinado. Qual é a interpretação correta?", "alts": ["Atmosfera deficiente em oxigênio; é preciso abandonar o espaço imediatamente e acionar o resgate", "Atmosfera normal, sem necessidade de qualquer cuidado", "Atmosfera enriquecida, com risco de incêndio", "Está 1% abaixo do normal, ainda não é deficiente, mas a causa deve ser investigada"], "c": 3, "why": ["O limite de deficiência é abaixo de 19,5%. Mas isso não quer dizer que se possa ignorar.", "O normal é 20,9%. Uma queda de 1% indica que algo está consumindo oxigênio.", "O enriquecimento começa acima de 23,5%.", null], "e": "O curso explica que 19,9% é 1% abaixo do normal, não chega a ser deficiente, mas exige cuidado: deve-se monitorar a causa, porque a leitura pode continuar caindo.", "d": "19,9%: ainda não é deficiente, mas investigue.", "n": 3}, {"id": "a06", "sub": "atmo", "t": "mc", "q": "O que é o LEL e qual é o nível de ação para a segurança?", "alts": ["Limite inferior de explosividade, com nível de ação de 10% do LEL", "Limite de exposição de curta duração, com nível de ação de 15 minutos", "Limite superior de explosividade, com nível de ação de 100% do UEL", "Limite de tolerância em ppm, com nível de ação de 25 ppm"], "c": 0, "why": [null, "Isso descreve o STEL, que é um limite de exposição.", "O limite superior é o UEL, e o nível de ação não é 100%.", "O LEL é medido em porcentagem, e não em ppm."], "e": "O LEL (limite inferior de explosividade) é a menor concentração de gás ou vapor no ar capaz de queimar ou explodir. O medidor mostra o resultado em % do LEL, e o nível de ação para a segurança é 10% do LEL.", "d": "LEL em %; ação com 10%.", "n": 2}, {"id": "a07", "sub": "atmo", "t": "mc", "q": "O que é o STEL?", "alts": ["Concentração mínima que o sensor consegue detectar, relacionada à sensibilidade do aparelho", "Concentração máxima de exposição de curto prazo, geralmente 15 minutos, para evitar efeitos agudos", "Média de exposição ao longo de toda a jornada de trabalho de 8 horas diárias", "Percentual do limite inferior de explosividade que se tolera dentro do espaço"], "c": 1, "why": ["Isso é a sensibilidade do sensor.", null, "O STEL é de curto prazo, calculado em geral para 15 minutos.", "Isso se refere ao LEL, e não ao STEL."], "e": "STEL é o limite de exposição de curto prazo. Protege a equipe de efeitos agudos de substâncias perigosas e costuma ser calculado para exposição de 15 minutos.", "d": "STEL = curto prazo, 15 minutos.", "n": 2}, {"id": "a08", "sub": "atmo", "t": "mc", "q": "Qual destas condições NÃO caracteriza uma atmosfera IPVS?", "alts": ["Excesso de oxigênio, com enriquecimento acima do limite seguro", "Gases tóxicos acima dos limites de tolerância estabelecidos", "Atmosfera com potencial de ignição ou de explosão", "Oxigênio em 20,9% e contaminantes abaixo dos limites de tolerância"], "c": 3, "why": ["O enriquecimento de oxigênio é condição IPVS.", "É condição IPVS.", "É condição IPVS.", null], "e": "IPVS significa imediatamente perigosa para a vida e a saúde. Inclui falta ou excesso de oxigênio, gases tóxicos acima dos limites e risco de explosão. Ar com 20,9% de oxigênio e contaminantes dentro dos limites é a condição normal.", "d": "IPVS = falta/excesso de O2, tóxico ou explosivo.", "n": 2}, {"id": "a09", "sub": "atmo", "t": "mc", "q": "Em que ordem deve ser feito o teste da atmosfera?", "alts": ["Gases e vapores tóxicos, combustíveis e oxigênio", "Oxigênio, gases e vapores combustíveis, gases e vapores tóxicos", "Gases e vapores combustíveis, oxigênio e tóxicos", "Oxigênio, gases e vapores tóxicos e, por último, os gases e vapores combustíveis"], "c": 1, "why": ["A ordem começa pelo oxigênio.", null, "O oxigênio vem primeiro.", "Os combustíveis vêm antes dos tóxicos."], "e": "O teste segue a ordem: 1) nível de oxigênio, 2) gases e vapores combustíveis, 3) gases e vapores tóxicos. Os monitores multigases atendem a esse requisito.", "d": "O2, combustível, tóxico.", "n": 2}, {"id": "a10", "sub": "atmo", "t": "mc", "q": "Por que o monitoramento deve ser feito em vários pontos, inclusive 1 metro à frente e para os lados em esgotos e espaços largos?", "alts": ["Porque o sensor só mede corretamente a cada metro percorrido dentro do espaço", "Porque gases de densidades diferentes formam camadas, e há correntes de ar e espaços mortos", "Porque o oxigênio é mais denso que os outros gases e fica sempre no fundo", "Porque a calibração do aparelho se perde quando ele fica parado em um ponto"], "c": 1, "why": ["O sensor mede continuamente. O problema é a atmosfera em camadas.", null, "Os gases têm densidades diferentes entre si. Não há regra de que o oxigênio fique no fundo.", "A calibração não depende do movimento."], "e": "Gases leves sobem, gases pesados descem, e há bolsões onde o ar não circula. Medir só na entrada pode dar uma leitura falsa. Também se deve avançar devagar, pelo tempo de resposta dos sensores.", "d": "Gás em camadas: meça em vários pontos.", "n": 2}, {"id": "a11", "sub": "atmo", "t": "mc", "q": "Por que o cheiro não é um indicador confiável da presença de ácido sulfídrico (H₂S)?", "alts": ["Porque o H₂S é totalmente inodoro em qualquer concentração, seja baixa ou alta", "Porque o odor só é percebido em concentrações acima de 1.000 ppm", "Em altas concentrações, como 100 ppm, o olfato some em poucos minutos, e a falta de cheiro engana", "Porque o cheiro fica mais forte quanto maior a concentração, o que sempre protege o trabalhador"], "c": 2, "why": ["Em baixas concentrações ele tem odor perceptível.", "O odor é percebido a partir de cerca de 0,13 ppm.", null, "Em concentrações elevadas o olfato é perdido."], "e": "Pela tabela do curso, o odor mínimo perceptível é de 0,13 ppm, mas em 100 ppm (nível IPVS) o olfato some em 2 a 5 minutos. A pessoa para de sentir o gás justamente quando ele é mais perigoso. Por isso é preciso detector.", "d": "Perdeu o cheiro, não significa que o gás sumiu.", "n": 3}, {"id": "a12", "sub": "atmo", "t": "mc", "q": "Qual gás é mais denso que o ar e tende a se acumular junto ao fundo do espaço?", "alts": ["Cloro (densidade 2,47)", "Metano (densidade 0,55)", "Amônia (densidade 0,6)", "Acetileno (densidade 0,91)"], "c": 0, "why": [null, "É mais leve que o ar e tende a subir.", "É mais leve que o ar.", "É um pouco mais leve que o ar."], "e": "Na tabela do curso, valores acima de 1 indicam gás mais pesado que o ar: cloro (2,47), benzeno (2,7), dióxido de enxofre (2,26) e dióxido de carbono (1,53). Eles se acumulam nas partes baixas e pedem teste em várias alturas.", "d": "Densidade acima de 1 = gás pesado, vai pro fundo.", "n": 2}, {"id": "a13", "sub": "atmo", "t": "mc", "q": "Qual é uma limitação importante do monitor multigás em silos?", "alts": ["Não detecta o risco de explosividade da poeira (LEL de poeira)", "Não mede o teor de oxigênio do ar do espaço", "Só detecta gases acima de 100% do limite inferior de explosividade", "Não funciona em ambientes com grãos úmidos ou fermentando"], "c": 0, "why": [null, "Mede oxigênio normalmente.", "O monitor indica em % do LEL e alerta bem antes.", "Não é a limitação indicada no curso."], "e": "O curso alerta que o multigás não detecta o LEL da poeira. Em silos, a nuvem de poeira é um risco de explosão que esse aparelho não mede. É preciso controle da poeira e das fontes de ignição.", "d": "Multigás não enxerga poeira explosiva.", "n": 3}, {"id": "a14", "sub": "atmo", "t": "mc", "q": "Qual medida ajuda a controlar o risco de choque elétrico e de ignição por equipamentos?", "alts": ["Aumentar a vazão de ventilação do espaço com ventiladores e exaustores potentes", "Bloqueio e etiquetagem de energia e equipamentos intrinsecamente seguros", "Usar EPR autônomo de circuito aberto durante toda a entrada", "Monitorar apenas o teor de oxigênio durante a entrada"], "c": 1, "why": ["A ventilação trata da atmosfera, e não da energia elétrica.", null, "O EPR protege a respiração, e não contra choque elétrico.", "O oxigênio não elimina o risco elétrico."], "e": "O bloqueio e a etiquetagem impedem o acionamento acidental de energia, e lanternas e rádios intrinsecamente seguros não geram faísca capaz de acender atmosferas inflamáveis. Luvas de isolamento elétrico também fazem parte das proteções.", "d": "Sem energia e sem faísca.", "n": 2}, {"id": "a15", "sub": "atmo", "t": "mc", "q": "Qual destes é um sinal vital de alerta no monitoramento médico dos participantes?", "alts": ["Temperatura corporal acima de 38 °C", "Temperatura corporal acima de 36 °C", "Frequência cardíaca acima de 50% da máxima", "Perda de peso de apenas 200 g"], "c": 0, "why": [null, "36 °C é uma temperatura normal.", "O alerta é acima de 85% da frequência cardíaca máxima.", "O alerta é uma perda de mais de 2 kg, cerca de 2 litros de líquido."], "e": "O curso lista como alertas: temperatura acima de 38 °C, frequência cardíaca acima de 85% da máxima, recuperação do coração de cerca de 10 bpm após sair, perda de mais de 2 kg e tosse ou dificuldade respiratória. O calor é um dos riscos físicos do espaço confinado.", "d": "38 °C, 85% da FC máxima, 2 kg.", "n": 2}, {"id": "a16", "sub": "atmo", "t": "mc", "q": "Qual combinação de situações em um espaço confinado pode levar à asfixia?", "alts": ["Somente temperatura baixa e umidade elevada no interior do espaço", "Somente ruído excessivo e iluminação deficiente no interior do espaço confinado", "Somente a presença de vibração e de superfícies escorregadias", "Atmosfera deficiente em oxigênio ou obstrução das vias aéreas por engolfamento"], "c": 3, "why": ["Frio não causa asfixia por si só.", "O ruído afeta a audição, e não a respiração.", "Não leva à asfixia.", null], "e": "Asfixia é a falta de oxigênio chegando ao corpo. Pode vir do ar sem oxigênio suficiente (abaixo de 19,5%) ou do engolfamento, quando o material cobre as vias aéreas e comprime o tórax.", "d": "Pouco oxigênio ou vias cobertas.", "n": 1}, {"id": "f01", "sub": "fases", "t": "mc", "q": "Quais são as fases do resgate em espaço confinado, na ordem?", "alts": ["Avaliação, preparação, operações pré-entrada, entrada e operação de resgate, desmobilização", "Preparação, operações pré-entrada, avaliação, entrada e operação de resgate, desmobilização", "Preparação, avaliação, entrada e operação de resgate, operações pré-entrada, desmobilização", "Preparação, avaliação, operações pré-entrada, entrada e operação de resgate, desmobilização"], "c": 3, "why": ["A preparação vem antes da avaliação.", "A avaliação vem antes das operações pré-entrada.", "Os preparativos pré-entrada vêm antes da entrada.", null], "e": "A Aula 07 apresenta cinco fases: 1 preparação, 2 avaliação, 3 operações pré-entrada, 4 entrada e operação de resgate e 5 desmobilização. A importância está em seguir os passos de forma adequada e coerente.", "d": "Preparar, avaliar, pré-entrada, resgatar, desmobilizar.", "n": 1}, {"id": "f02", "sub": "fases", "t": "mc", "q": "O que compõe a fase de preparação?", "alts": ["Posto de comando, avaliação externa 360º e avaliação interna do espaço confinado", "Área de segurança, controle de riscos, sistemas de içamento e briefing pré-entrada", "Formação da equipe, treinamento, avaliação de pessoal e equipamentos e pré-planejamento", "Localização da vítima, extricação, recuperação e reabilitação da equipe"], "c": 2, "why": ["Isso é a fase de avaliação.", "Isso é a fase de operações pré-entrada.", null, "Isso é a fase de entrada e operação de resgate."], "e": "A preparação acontece antes do chamado: formar a equipe, treinar, avaliar pessoal e equipamentos e pré-planejar os espaços da planta.", "d": "Preparação = equipe, treino, pré-plano.", "n": 2}, {"id": "f03", "sub": "fases", "t": "mc", "q": "O que compõe a fase de avaliação?", "alts": ["Posto de comando, avaliação externa 360º e interna do espaço, e recursos (pessoal e equipamentos)", "Formação da equipe, treinamento, avaliação de pessoal e pré-planejamento dos espaços", "Ninguém no espaço, isolamento do espaço, debriefing e inventário do equipamento", "Ventilação, bloqueio e etiquetagem, raqueteamento, içamento, briefing e área de segurança pré-entrada"], "c": 0, "why": [null, "Isso é a fase de preparação.", "Isso é a desmobilização.", "Isso pertence às operações pré-entrada."], "e": "Na avaliação, monta-se o posto de comando (comando unificado), examina-se a cena por fora, em 360º, e por dentro do espaço confinado, e levantam-se os recursos disponíveis em pessoal e equipamentos.", "d": "Avaliação = comando, fora, dentro, recursos.", "n": 2}, {"id": "f04", "sub": "fases", "t": "mc", "q": "O que compõe a fase de operações pré-entrada?", "alts": ["Posto de comando, comando unificado, avaliação externa 360º e avaliação interna", "Localização da vítima, maca, extricação, recuperação e reabilitação da equipe", "Formação da equipe, treinamento, avaliação de pessoal e pré-planejamento dos espaços", "Área de segurança, controle de riscos, içamento e recuperação e briefing pré-entrada"], "c": 3, "why": ["Isso é a fase de avaliação.", "Isso é a fase de entrada e operação de resgate.", "Isso é a preparação.", null], "e": "Antes de qualquer resgatista entrar: estabelecer a área de segurança (perímetros, monitorar a atmosfera, verificar outros riscos), controlar os riscos (ventilação, bloqueio e etiquetagem, raqueteamento), montar os sistemas de içamento e recuperação e fazer o briefing.", "d": "Pré-entrada = segurança, riscos, içamento, briefing.", "n": 2}, {"id": "f05", "sub": "fases", "t": "mc", "q": "O que acontece na fase de entrada e operação de resgate?", "alts": ["Estabelecer perímetros, monitorar a atmosfera, verificar outros riscos e controlar a ventilação", "Debriefing, inventário e recolhimento de equipamentos, com isolamento do espaço", "Briefing, ventilação, bloqueio e etiquetagem e montagem do sistema de içamento", "Localizar a vítima, resgatar ou recuperar, amarrar na maca, extricar, recuperar e reabilitar a equipe"], "c": 3, "why": ["Isso ocorre na área de segurança das operações pré-entrada.", "Isso é a desmobilização.", "Isso ocorre antes da entrada.", null], "e": "A fase 4 começa com a localização da vítima e o resgate ou recuperação. Segue com a vítima amarrada na maca (cesto ou envelope), extricação, recuperação da equipe e reabilitação da equipe de resgate.", "d": "Achar, amarrar, tirar, recuperar e reabilitar.", "n": 2}, {"id": "f06", "sub": "fases", "t": "mc", "q": "Qual NÃO é um dos itens do briefing pré-entrada?", "alts": ["Tempo limite predeterminado para a equipe de entrantes", "Plano e sinais para a evacuação do espaço confinado", "Debriefing e lições aprendidas da última operação", "Riscos e sinais de exposição aos agentes do espaço"], "c": 2, "why": ["É item do briefing.", "É item do briefing.", null, "É item do briefing."], "e": "O briefing pré-entrada tem cinco itens: missão para a equipe de entrantes, riscos e sinais de exposição, plano e sinais para evacuação, tempo limite predeterminado e plano de operações. Debriefing é outra coisa, feita no fim.", "d": "Briefing: missão, riscos, evacuação, tempo, plano.", "n": 3}, {"id": "f07", "sub": "fases", "t": "mc", "q": "Quais funções formam a assessoria (staff) do comando unificado na fase de avaliação?", "alts": ["Oficial de segurança, oficial de ligação e oficial de informação", "Operações, logística, administração/finanças e planejamento", "Oficial de segurança, supervisor de entrada e vigia", "Chefe de operações, médico e atendente"], "c": 0, "why": [null, "Essas são as seções do comando, e não os oficiais da assessoria.", "Supervisor de entrada e vigia são funções da entrada no espaço.", "Não é a estrutura apresentada."], "e": "O organograma do posto de comando mostra o comando unificado com três oficiais (segurança, ligação e informação) e quatro seções: operações, logística, administração e finanças e planejamento.", "d": "Staff: segurança, ligação, informação.", "n": 3}, {"id": "f08", "sub": "fases", "t": "mc", "q": "Antes de qualquer chamado, a equipe treina, confere seus equipamentos e levanta informações sobre os espaços da planta. Em qual fase está?", "alts": ["Avaliação", "Operações pré-entrada", "Preparação", "Desmobilização"], "c": 2, "why": ["A avaliação ocorre com o incidente em curso.", "Essa fase ocorre já na ocorrência, antes da entrada.", null, "É o encerramento da operação."], "e": "Treinar, avaliar pessoal e equipamentos e pré-planejar os espaços são atividades da preparação, feitas antes de existir uma emergência.", "d": "Antes do chamado = preparação.", "n": 1}, {"id": "f09", "sub": "fases", "t": "mc", "q": "O comandante instala o posto de comando e a equipe faz a observação externa em 360º da cena. Em qual fase está?", "alts": ["Preparação", "Operações pré-entrada", "Avaliação", "Entrada e operação de resgate"], "c": 2, "why": ["A preparação ocorre antes da emergência.", "Essa fase vem depois, com perímetros, controle de riscos e briefing.", null, "A entrada só ocorre depois das operações pré-entrada."], "e": "Posto de comando, observação externa em 360º, avaliação interna e levantamento de recursos formam a avaliação, que reconhece a cena antes de agir.", "d": "Comando e 360º = avaliação.", "n": 2}, {"id": "f10", "sub": "fases", "t": "mc", "q": "Ventilação, bloqueio e etiquetagem e raqueteamento fazem parte de qual fase e de qual bloco?", "alts": ["Avaliação, no bloco de recursos", "Operações pré-entrada, no bloco de controle de riscos", "Preparação, no bloco de pré-planejamento", "Entrada e operação de resgate, no bloco de extricação"], "c": 1, "why": ["A avaliação reconhece a cena e levanta recursos, sem aplicar as medidas.", null, "No pré-planejamento só se prevê onde haverá bloqueios, por exemplo no croqui.", "Esses controles precisam estar prontos antes da entrada."], "e": "O controle de riscos das operações pré-entrada inclui ventilação, bloqueio e etiquetagem e raqueteamento. É o momento de deixar o espaço seguro antes de a equipe entrar.", "d": "Controles de risco = antes de entrar.", "n": 2}, {"id": "f11", "sub": "fases", "t": "mc", "q": "A reabilitação da equipe de resgate pertence a qual fase?", "alts": ["Desmobilização, junto com o debriefing", "Entrada e operação de resgate", "Operações pré-entrada, no controle de riscos", "Preparação, no treinamento da equipe"], "c": 1, "why": ["A desmobilização inclui debriefing e inventário, e não a reabilitação.", null, "A reabilitação ocorre depois que a equipe sai do espaço.", "Não é atividade de preparação."], "e": "Na sequência da Aula 07, a fase 4 termina com a extricação da vítima, a recuperação da equipe e a reabilitação da equipe de resgate. A desmobilização é a fase 5.", "d": "Reabilitação ainda é fase 4.", "n": 3}, {"id": "f12", "sub": "fases", "t": "mc", "q": "Em qual fase se montam os sistemas de içamento e recuperação?", "alts": ["Somente depois de localizar a vítima, na fase de entrada", "Na preparação, antes de saber qual espaço será usado", "Nas operações pré-entrada, antes de os resgatistas entrarem", "Na desmobilização, depois de retirar a vítima"], "c": 2, "why": ["O sistema deve estar pronto antes da entrada, para uma saída rápida.", "O sistema depende do espaço do incidente, definido na ocorrência.", null, "Na desmobilização só se recolhe e inventaria o material."], "e": "Os sistemas de içamento e recuperação fazem parte das operações pré-entrada. Com eles montados, a equipe pode retirar o entrante ou a vítima sem demora.", "d": "Içamento pronto antes de entrar.", "n": 2}, {"id": "d01", "sub": "desmob", "t": "mc", "q": "Quais etapas formam a desmobilização?", "alts": ["Ventilação, bloqueio e etiquetagem, briefing pré-entrada e montagem do içamento", "Ninguém no espaço, isolar o espaço, debriefing e inventário e recolhimento do equipamento", "Localização da vítima, maca, extricação, recuperação e reabilitação da equipe", "Formação da equipe, treinamento, pré-planejamento e avaliação de pessoal e dos equipamentos"], "c": 1, "why": ["Isso são as operações pré-entrada.", null, "Isso é a fase de entrada e operação de resgate.", "Isso é a preparação."], "e": "A Aula 07 mostra quatro etapas na desmobilização: confirmar que não há ninguém no espaço, isolar o espaço, fazer o debriefing e inventariar e recolher o equipamento.", "d": "Ninguém dentro, isola, debriefing, inventário.", "n": 1}, {"id": "d02", "sub": "desmob", "t": "mc", "q": "Qual é a primeira etapa da desmobilização, segundo a sequência do curso?", "alts": ["Fazer o debriefing com a equipe", "Recolher e inventariar todos os equipamentos usados na operação", "Montar de novo o sistema de içamento", "Confirmar que não há ninguém no espaço confinado"], "c": 3, "why": ["O debriefing vem depois de garantir a segurança do local.", "O inventário vem por último.", "A desmobilização é o encerramento. Montar sistemas é da pré-entrada.", null], "e": "Antes de qualquer outra coisa, é preciso ter certeza de que ninguém ficou dentro do espaço. Só depois se isola o espaço, faz-se o debriefing e se recolhem os equipamentos.", "d": "Primeiro: ninguém ficou lá dentro.", "n": 2}, {"id": "d03", "sub": "desmob", "t": "mc", "q": "Qual é o objetivo de isolar o espaço confinado na desmobilização?", "alts": ["Impedir novas entradas não autorizadas enquanto ainda houver riscos", "Deixar o espaço liberado para uso imediato pelos trabalhadores", "Facilitar a ventilação natural por todas as aberturas", "Dispensar a emissão de nova PET na próxima entrada"], "c": 0, "why": [null, "O espaço só volta ao uso depois de nova avaliação e nova PET.", "Isolar significa fechar e sinalizar o acesso.", "A PET é válida para cada entrada."], "e": "Na saída da equipe, o espaço continua perigoso. Fechar, bloquear e sinalizar evita que alguém entre por engano. Na Aula 08, o item é verificar e isolar os riscos que ainda possam existir.", "d": "Saiu a equipe, o risco continua: isole.", "n": 2}, {"id": "d04", "sub": "desmob", "t": "mc", "q": "O que é o debriefing?", "alts": ["Instrução dada antes da entrada, com a missão, os riscos, o plano de evacuação e o tempo limite", "Inspeção dos equipamentos antes do início da operação de resgate", "Reunião com a equipe após a operação para avaliar o que funcionou e as lições aprendidas", "Relatório final entregue ao empregador, sem a participação da equipe"], "c": 2, "why": ["Isso é o briefing pré-entrada.", "Isso ocorre na preparação e na avaliação de equipamentos.", null, "O debriefing é feito com a equipe."], "e": "O debriefing é a conversa final: o que foi bom, o que pode melhorar e quais lições ficam. Ajuda a corrigir falhas antes da próxima ocorrência.", "d": "Debriefing = conversa depois, para aprender.", "n": 2}, {"id": "d05", "sub": "desmob", "t": "mc", "q": "Qual é a diferença entre briefing pré-entrada e debriefing?", "alts": ["O briefing ocorre depois do resgate, na desmobilização, e o debriefing ocorre antes da entrada da equipe", "Ambos ocorrem na fase de preparação e têm exatamente a mesma finalidade", "Briefing é antes da entrada; debriefing, ao final, na desmobilização, avalia a operação", "O briefing é voltado só à vítima, e o debriefing é voltado só ao comando"], "c": 2, "why": ["Está invertido.", "Cada um tem seu momento e sua finalidade.", null, "Ambos são feitos com a equipe de resgate."], "e": "Briefing é o alinhamento antes de entrar. Debriefing é a avaliação depois de sair. O primeiro prepara a operação, o segundo aprende com ela.", "d": "Briefing = antes de entrar. Debriefing = depois de sair.", "n": 3}, {"id": "d06", "sub": "desmob", "t": "mc", "q": "No resgate em silo, o que o curso inclui na desmobilização?", "alts": ["Retirar o bloqueio de energia para testar os equipamentos logo após a saída", "Verificar e isolar riscos remanescentes, recolher e inventariar o material e fazer debriefing", "Liberar a vítima no local, sem avaliação médica, desde que ela esteja consciente e sem queixas", "Manter o fluxo de grãos ligado para esvaziar o silo depois do resgate"], "c": 1, "why": ["A energia permanece bloqueada enquanto houver risco.", null, "A liberação no local só ocorre após rigorosa avaliação médica, e isso é o passo 7.", "O fluxo é bloqueado no primeiro passo e continua bloqueado."], "e": "Na Aula 08, o último passo (8 – desmobilizar) reúne três ações: verificar e isolar riscos remanescentes, recolher e inventariar o material e fazer o debriefing com a equipe.", "d": "Isolar risco, inventariar, debriefing.", "n": 2}, {"id": "r01", "sub": "resg", "t": "mc", "q": "Qual é a sequência correta dos oito passos do resgate em silo?", "alts": ["Verificar atmosfera e ventilar; bloquear fluxo e eletricidade; estabilizar; montar restrição e vantagem mecânica; bloquear movimento dos grãos; remover grãos da vítima; tratar e transportar; desmobilizar", "Bloquear fluxo e eletricidade; verificar atmosfera e ventilar; montar restrição e vantagem mecânica; estabilizar; bloquear movimento dos grãos; remover grãos da vítima; tratar e transportar; desmobilizar", "Bloquear fluxo e eletricidade; verificar atmosfera e ventilar; estabilizar; montar restrição e vantagem mecânica; bloquear movimento dos grãos; remover grãos da vítima; tratar e transportar; desmobilizar", "Bloquear fluxo e eletricidade; verificar atmosfera e ventilar; estabilizar; montar restrição e vantagem mecânica; remover grãos da vítima; bloquear movimento dos grãos; tratar e transportar; desmobilizar"], "c": 2, "why": ["O primeiro passo é bloquear o fluxo e a eletricidade.", "A estabilização (passo 3) vem antes do sistema de restrição (passo 4).", null, "Primeiro se bloqueia o movimento dos grãos (5) e só depois se removem (6)."], "e": "Os passos da Aula 08: 1 bloquear sistemas elétricos e fluxo de saída; 2 verificar riscos atmosféricos e ventilar; 3 estabilização; 4 sistema de restrição e vantagem mecânica; 5 bloquear o movimento dos grãos; 6 remover os grãos da vítima; 7 tratar e transportar; 8 desmobilizar.", "d": "Bloqueia, respira, estabiliza, prende, protege, remove, trata, desmobiliza.", "n": 3}, {"id": "r02", "sub": "resg", "t": "mc", "q": "Qual é o primeiro passo do resgate em silo?", "alts": ["Bloquear os sistemas elétricos e o fluxo de saída dos grãos", "Entrar rapidamente e puxar a vítima pelos braços", "Montar o sistema de recuperação com vantagem mecânica", "Remover os grãos ao redor da vítima com pás"], "c": 0, "why": [null, "Entrar sem bloqueio expõe a equipe ao mesmo perigo. E puxar a vítima não funciona.", "Isso é o passo 4.", "Isso é o passo 6, depois de bloquear, ventilar, estabilizar e proteger."], "e": "O primeiro passo é garantir o bloqueio do fluxo de grãos e da eletricidade. Sem isso, o equipamento pode voltar a arrastar a vítima ou a equipe.", "d": "Passo 1: bloquear grão e energia.", "n": 1}, {"id": "r03", "sub": "resg", "t": "mc", "q": "A vítima está consciente e conversa com a equipe. O que isso significa para a atmosfera?", "alts": ["Indica, mas não garante, ar respirável; só se entra após verificar o ar ou com EPR adequado", "Garante que a atmosfera é respirável, dispensando o monitoramento do ar", "Indica que só falta ventilar o espaço, e por isso a entrada da equipe pode ser imediata e sem EPR", "Significa que o oxigênio está acima de 23,5% e a atmosfera é enriquecida"], "c": 0, "why": [null, "Uma vítima consciente não garante ar seguro para a equipe.", "A entrada depende de verificação do ar ou de EPR adequado.", "Não há relação entre consciência da vítima e esse limite."], "e": "A vítima pode estar consciente por um tempo, mas a atmosfera pode piorar, e quem entra sem proteção vira a próxima vítima. A entrada só pode ser autorizada após a verificação de ar respirável ou com o EPR adequado.", "d": "Vítima falando não prova ar bom.", "n": 3}, {"id": "r04", "sub": "resg", "t": "mc", "q": "Qual é o objetivo da estabilização no resgate em silo?", "alts": ["Retirar a vítima rapidamente, usando a força máxima de todos os resgatistas disponíveis", "Dar suporte para evitar o agravamento ou que algum membro da equipe afunde", "Cortar a parede do silo para escoar os grãos e aliviar a pressão", "Transportar a vítima ao hospital o mais rápido possível"], "c": 1, "why": ["A retirada vem depois, com sistema e remoção dos grãos.", null, "O corte é usado na remoção de carga, e não na estabilização.", "O transporte é o passo 7."], "e": "A estabilização é o passo 3. Com apoios que distribuem o peso, como estrados e pranchas, evita-se que a situação piore ou que algum resgatista afunde também.", "d": "Estabilizar = não afundar mais ninguém.", "n": 2}, {"id": "r05", "sub": "resg", "t": "mc", "q": "Quem deve estar preso a um sistema de restrição durante o resgate em silo?", "alts": ["Somente o primeiro resgatista a entrar", "Apenas a vítima", "Todos os resgatistas", "Somente quem trabalhar abaixo de dois metros de grãos"], "c": 2, "why": ["Todos os resgatistas devem estar presos.", "A vítima tem seu sistema de recuperação. Os resgatistas precisam do de restrição.", null, "Não há essa regra. O sistema vale para todos."], "e": "O passo 4 diz que todos os resgatistas devem estar presos por um sistema de restrição. Para a vítima, monta-se um sistema de recuperação com vantagem mecânica.", "d": "Todos os resgatistas, presos.", "n": 1}, {"id": "r06", "sub": "resg", "t": "mc", "q": "Qual sistema de vantagem mecânica normalmente é o mais adequado para recuperar a vítima?", "alts": ["5:1", "2:1", "3:1", "1:1"], "c": 0, "why": [null, "Daria pouca redução de força para o esforço necessário.", "Não é o indicado no curso.", "Sem vantagem mecânica, a força necessária é a total."], "e": "A montagem de um sistema 5:1 normalmente é a mais adequada. Como a força para recuperar uma vítima afundada é muito grande, a vantagem mecânica reduz o esforço e permite uma recuperação suave e controlada.", "d": "Recuperação em silo: 5:1.", "n": 2}, {"id": "r07", "sub": "resg", "t": "mc", "q": "Para que servem as placas de madeira ou metal colocadas ao redor da vítima?", "alts": ["Servir de ponto de ancoragem para o sistema de restrição", "Fechar a saída de descarga do silo", "Bloquear o movimento dos grãos em direção à vítima, protegendo-a", "Aumentar a pressão dos grãos para empurrá-la para cima"], "c": 2, "why": ["A ancoragem é feita em pontos seguros fora da massa de grãos.", "O fluxo de saída é bloqueado no passo 1.", null, "Mais pressão agravaria a situação."], "e": "No passo 5, as placas formam uma proteção em volta da vítima e impedem que mais grãos escorram sobre ela enquanto a equipe retira o material.", "d": "Placas = barreira contra novos grãos.", "n": 2}, {"id": "r08", "sub": "resg", "t": "mc", "q": "Qual é o princípio da remoção dos grãos no resgate?", "alts": ["Retirar os grãos do entorno da vítima com baldes, pás ou aspirador, e não arrancá-la dos grãos", "Içar a vítima na hora com o sistema 5:1 e só depois retirar os grãos", "Abrir a descarga inferior para os grãos arrastarem a vítima até a saída", "Aplicar ar comprimido sobre os grãos para fluidificá-los e soltar rapidamente a vítima aprisionada"], "c": 0, "why": [null, "O içamento sem retirar os grãos exige força enorme e pode causar lesões.", "Abrir a descarga com a vítima dentro pode agravar o engolfamento.", "Não é técnica do curso e pode levantar poeira explosiva."], "e": "O passo 6 segue o mesmo princípio da extricação: retira-se o material ao redor da vítima, com baldes, pás ou aspirador, e não se arranca a vítima dos grãos.", "d": "Tira o grão, não a vítima.", "n": 1}, {"id": "x04", "sub": "gerais", "t": "mc", "q": "Por que a asfixia pode ocorrer em um espaço confinado mesmo sem gases tóxicos presentes?", "alts": ["Porque o ar fica quente e a pessoa perde a consciência por calor", "Porque o excesso de oxigênio impede a troca de gases nos pulmões", "Porque o oxigênio pode cair abaixo de 19,5%, como na inertização com nitrogênio ou pelo consumo de oxigênio no espaço", "Porque a claustrofobia reduz a frequência respiratória da pessoa"], "c": 2, "why": ["Calor causa outro quadro. A asfixia é falta de oxigênio.", "O excesso de oxigênio não causa asfixia. Ele leva a risco de incêndio.", null, "A claustrofobia acelera a respiração, e não a reduz."], "e": "Asfixia é a falta de oxigênio no organismo. Ela pode ocorrer com o ar sem gás tóxico se o oxigênio estiver abaixo de 19,5%. A aula cita a inertização, que usa nitrogênio para remover o oxigênio, como causa dessa deficiência.", "d": "Sem oxigênio, asfixia, mesmo sem gás tóxico.", "n": 2}, {"id": "r10", "sub": "resg", "t": "mc", "q": "Depois da retirada, a vítima parece estar bem. O que o curso orienta?", "alts": ["Liberar a vítima imediatamente no local, desde que esteja consciente, orientada e sem queixas aparentes", "Mantê-la apenas em repouso no local, sem transporte, até melhorar", "Transportá-la somente se ela mesma solicitar o transporte", "Liberar no local só após rigorosa avaliação médica, pois pode haver disfunção respiratória"], "c": 3, "why": ["Pode haver disfunção respiratória mesmo sem sinais evidentes.", "A conduta depende da avaliação médica.", "A decisão é técnica e médica, e não da vontade da vítima.", null], "e": "No passo 7 (tratar e transportar), a vítima pode ter alguma disfunção respiratória. A liberação no local só ocorre depois de uma avaliação médica rigorosa.", "d": "Pós-resgate: avaliação médica antes de liberar.", "n": 2}, {"id": "k01", "sub": "ctrl", "t": "mc", "q": "Quais fatores se consideram no controle dos riscos atmosféricos de um espaço?", "alts": ["Apenas o volume do espaço, a potência do ventilador, o número de entrantes e o horário em que a operação começa", "Somente as normas aplicáveis, a escala da equipe e a cor da sinalização", "Exclusivamente o tipo de EPR usado e o treinamento anual dos entrantes", "Características do espaço, aberturas, contaminante e sua fonte, clima, equipamento e tempo disponíveis"], "c": 3, "why": ["Há outros fatores, como aberturas, contaminante e clima.", "São fatores técnicos do ambiente que definem o controle.", "EPR e treinamento são importantes, mas não são os fatores do espaço.", null], "e": "A Aula 05 lista cinco considerações: características do espaço, aberturas disponíveis, fonte e características do contaminante, condições do clima e equipamento e tempo disponíveis.", "d": "Espaço, aberturas, contaminante, clima, recursos.", "n": 2}, {"id": "k02", "sub": "ctrl", "t": "mc", "q": "Na ventilação natural de um gás mais pesado que o ar, como o propano, qual abertura é usada?", "alts": ["Somente a abertura de cima", "Nenhuma, pois a ventilação natural não retira gases pesados", "A abertura de baixo", "Qualquer uma, porque a densidade não influencia"], "c": 2, "why": ["O gás pesado fica embaixo e precisa sair por baixo.", "Pode retirar, usando a abertura de baixo.", null, "A densidade define por onde o gás sai."], "e": "O esquema da Aula 05 mostra o propano (densidade 1,6) acumulado no fundo, saindo pela abertura de baixo, com ar externo entrando por cima.", "d": "Pesado sai por baixo.", "n": 2}, {"id": "x05", "sub": "gerais", "t": "mc", "q": "O que deve preceder toda entrada em espaço confinado, segundo a NR-33 citada no curso?", "alts": ["Apenas a emissão da PET, sem testes de atmosfera", "Somente a verificação dos equipamentos de resgate, sem análise de riscos", "Um teste de atmosfera feito uma única vez, no início do dia", "Análise preliminar de riscos, com testes das condições antes de entrar e monitoramento durante o trabalho"], "c": 3, "why": ["A PET não substitui a análise de riscos nem os testes.", "Equipamentos são uma parte, mas a análise de riscos é obrigatória.", "O teste deve ser contínuo quando o espaço não puder ser testado por completo.", null], "e": "Pela Aula 04, toda entrada deve ser precedida de análise de riscos: testar as condições antes de entrar e monitorar durante o trabalho ou o resgate. Se não for possível testar todo o espaço, testa-se até onde for possível e faz-se teste contínuo ao avançar.", "d": "Analisar, testar antes, monitorar durante.", "n": 2}, {"id": "k04", "sub": "ctrl", "t": "mc", "q": "Qual é a diferença entre ventilação de pressão positiva e de pressão negativa?", "alts": ["A positiva aspira o ar contaminado para fora e a negativa insufla ar limpo no espaço", "A positiva insufla ar limpo; a negativa aspira o ar contaminado para fora (exaustão)", "A positiva é natural e sem equipamento; a negativa é sempre mecânica", "A positiva só vale para gases leves, e a negativa só para gases pesados"], "c": 1, "why": ["Está invertido.", null, "Ambas são mecânicas, feitas com ventilador ou exaustor.", "A escolha depende do espaço, das aberturas e do contaminante."], "e": "Na pressão positiva, um ventilador insufla ar limpo e empurra o ar ruim para fora. Na pressão negativa, um exaustor retira o ar contaminado, e o ar limpo entra pelas aberturas. A pressão positiva tem um risco: a atmosfera inflamável e tóxica expulsa pode atingir quem está na saída.", "d": "Positiva empurra ar limpo; negativa puxa ar ruim.", "n": 3}, {"id": "k05", "sub": "ctrl", "t": "mc", "q": "O que é o chamado circuito curto na ventilação?", "alts": ["O ar contaminado expelido é aspirado de novo e volta ao espaço", "O ar limpo sai rapidamente por uma abertura próxima, sem varrer o interior", "Falha elétrica no ventilador, que interrompe a ventilação", "Captação de ar contaminado do exterior pela mangueira de insuflação"], "c": 1, "why": ["Isso é a recirculação.", null, "Não é o conceito.", "Isso é o erro do ar contaminado."], "e": "Entre os erros na ventilação, o circuito curto é quando o ar não percorre o espaço: entra e sai por aberturas próximas, deixando o ar ruim no fundo. Outros erros: recirculação e captação de ar contaminado.", "d": "Circuito curto: o ar não passa pelo espaço todo.", "n": 3}, {"id": "k06", "sub": "ctrl", "t": "mc", "q": "Depois da inertização com nitrogênio, como fica a atmosfera do espaço?", "alts": ["Deficiente em oxigênio: sem risco de explosão, mas não respirável sem EPR de adução de ar", "Segura para entrar sem EPR, pois já não há combustível no espaço", "Enriquecida em oxigênio, com risco de incêndio muito elevado", "Mais inflamável, pois o nitrogênio usado na inertização é combustível e alimenta o fogo"], "c": 0, "why": [null, "Sem oxigênio suficiente, a pessoa asfixia.", "A inertização retira o oxigênio.", "O nitrogênio é um gás inerte, que não queima."], "e": "A inertização usa um gás inerte (o mais usado é o nitrogênio) para remover o oxigênio e impedir uma explosão. O resultado é uma atmosfera deficiente em O₂, que exige EPR de adução de ar.", "d": "Inerte tira o oxigênio: sem fogo, mas sem ar.", "n": 3}, {"id": "k07", "sub": "ctrl", "t": "mc", "q": "Qual é o objetivo do bloqueio e etiquetagem (LOTO)?", "alts": ["Identificar o espaço confinado para o cadastro e rastrear o histórico de cada entrada", "Sinalizar a presença do vigia na entrada do espaço confinado", "Impedir a ventilação natural do espaço durante os trabalhos", "Evitar acionamentos acidentais de energia enquanto há trabalhadores no interior"], "c": 3, "why": ["A identificação é feita no cadastro, e não pelo LOTO.", "O vigia é uma função, e não o objetivo do LOTO.", "O LOTO trata de energia, e não de ventilação.", null], "e": "O sistema de travamento e etiquetagem (lockout/tagout, ou L.O.T.O.) é vital para evitar acionamentos acidentais de energia, como motores, válvulas e painéis, enquanto há pessoas dentro do espaço.", "d": "Travou e etiquetou: ninguém liga.", "n": 1}, {"id": "k08", "sub": "ctrl", "t": "mc", "q": "O que é a raquete usada em tubulações?", "alts": ["Tampa metálica da abertura de visita que fecha o espaço confinado", "Cadeado com etiqueta fixado na válvula para impedir o acionamento", "Dispositivo de içamento da vítima, instalado sobre a boca de visita de espaços verticais profundos", "Disco metálico ou anel inserido entre flanges, que bloqueia o fluxo ou deixa passar"], "c": 3, "why": ["A tampa de visita é outro elemento.", "Isso é o bloqueio e a etiquetagem.", "O içamento usa tripé e sistemas de recuperação.", null], "e": "A raquete (raqueteamento) é inserida entre flanges da tubulação. Pode bloquear completamente o fluxo em uma linha ou permitir a passagem livre de fluidos. Garante um bloqueio físico mais seguro que a válvula fechada.", "d": "Raquete = disco entre flanges.", "n": 2}, {"id": "k09", "sub": "ctrl", "t": "mc", "q": "Por que a equipe de resgate deve conversar com o pessoal local no pré-plano e na chegada, buscando a energia “zero”?", "alts": ["Porque só o pessoal local pode acionar o Corpo de Bombeiros e liberar a entrada da equipe no local", "Porque a energia zero dispensa o bloqueio e a etiquetagem na entrada", "Porque as fontes de energia podem não ser óbvias, e há sistemas redundantes, como geradores", "Porque a equipe de resgate não precisa isolar energia, só o pessoal local"], "c": 2, "why": ["Não é o motivo da conversa.", "A meta de energia zero é atingida justamente com o bloqueio e a etiquetagem.", null, "A equipe de resgate também deve garantir o isolamento."], "e": "A Aula 05 diz que as fontes de energia podem não ser óbvias, que há sistemas redundantes (geradores) e que sistemas complexos são desafiadores, especialmente se a equipe não conhece o ambiente. Por isso o contato com o pessoal local no pré-plano e na chegada.", "d": "Energia escondida: pergunte a quem conhece.", "n": 3}, {"id": "k10", "sub": "ctrl", "t": "mc", "
