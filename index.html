?", "x": "A coercibilidade é a imposição da medida ainda contra a vontade do particular, indissociável da autoexecutoriedade.", "o": ["Discricionariedade", "Atividade negativa", "Indelegabilidade", "Coercibilidade"], "k": 3}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Qual é a ordem do ciclo de polícia na atividade de prevenção?", "x": "O ciclo tem quatro fases: ordem (a norma que fixa a exigência), consentimento (aprovação de projeto, licenciamento), fiscalização (vistoria) e sanção (notificação, multa, embargo, interdição, apreensão).", "o": ["Ordem, fiscalização, consentimento e sanção", "Consentimento, ordem, sanção e fiscalização", "Ordem, consentimento, fiscalização e sanção", "Fiscalização, ordem, sanção e consentimento"], "k": 2}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Qual critério separa a polícia administrativa da polícia judiciária?", "x": "O critério é a natureza do ilícito. Polícia administrativa: ilícito administrativo, regime de Direito Administrativo, incide sobre bens, direitos e atividades. Judiciária: ilícito penal já praticado, regime processual penal, incide sobre pessoas.", "o": ["A natureza do ilícito: administrativo ou penal", "O momento: preventivo ou repressivo", "A sanção: multa ou prisão", "O órgão: militar ou civil"], "k": 0}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "O CBMPR exerce polícia judiciária:", "x": "A Corporação exerce polícia administrativa de prevenção e, quanto aos crimes militares de seus integrantes ou contra a instituição, polícia judiciária militar (flagrante e IPM). Não exerce polícia judiciária comum.", "o": ["Comum e militar, conforme a ocorrência", "Somente a militar, quanto aos crimes militares", "Comum, apurando infrações penais em geral", "Nenhuma, em qualquer hipótese"], "k": 1}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Qual afirmação correta distingue poder de políc  "No desvio de poder a competência existe, mas é usada para fim estranho ao interesse público. A escala usada como punição disfarçada é exemplo de desvio de finalidade, mais difícil de provar que o excesso.", "o": ["Omissão", "Desvio de poder", "Exercício regular do poder disciplinar", "Excesso de poder"], "k": 1}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Na responsabilidade objetiva do Estado, a vítima precisa provar:", "x": "Na responsabilidade objetiva (CF, art. 37, § 6º) a vítima prova apenas conduta, dano e nexo causal. A discussão sobre culpa fica reservada à ação de regresso contra o agente. Na subjetiva exige-se também culpa ou dolo.", "o": ["Conduta, dano e nexo causal", "Conduta e culpa do agente", "Dano e dolo do agente", "Conduta, dano, nexo causal e culpa"], "k": 0}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "No risco administrativo, o Estado pode afastar o dever de indenizar provando:", "x": "O risco administrativo é a regra do art. 37, § 6º: objetiva, porém mitigada. Admite excludentes: culpa exclusiva da vítima, fato de terceiro, caso fortuito e força maior (a culpa concorrente atenua). No risco integral nenhuma excludente é admitida.", "o": ["Que o valor do dano é reduzido", "Que o agente cumpria ordem do superior", "Culpa exclusiva da vítima", "Ausência de culpa do agente"], "k": 2}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Segundo o STF (Tema 940), o cidadão lesado por ato de agente público deve acionar:", "x": "Pela teoria da dupla garantia, a ação deve ser ajuizada contra o Estado, sendo o agente parte ilegítima, assegurado o direito de regresso nos casos de dolo ou culpa. Protege a vítima e o agente.", "o": ["O Estado, sem qualquer possibilidade de regresso contra o agente público", "O Estado, com regresso contra o agente em caso de dolo ou culpa", "O agente diretamente, sem a necessidade de acionar o Estado", "O agente e o Estado, em litisconsórcio passivo necessário"], "k": 1}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "Um mesmo ato funcional ilícito pode gerar responsabilidade:", "x": "As três esferas podem incidir sobre o mesmo fato, cada qual com seu processo, sua autoridade e seu grau de exigência probatória: civil (reparar o dano), penal (punir o crime) e administrativa (sancionar a transgressão disciplinar).", "o": ["Somente na esfera em que o fato for apurado em primeiro lugar", "Civil ou administrativa, nunca as duas ao mesmo tempo", "Civil, penal e administrativa, cada qual em processo próprio", "Apenas penal, desde que o fato configure crime"], "k": 2}, {"t": "mc", "a": "Aula 8 · Poderes Administrativos e Responsabilidade", "q": "A absolvição penal que afasta também a responsabilidade civil e a administrativa é aquela por:", "x": "As instâncias são independentes. A exceção é a certeza penal: a absolvição que reconhece a inexistência do fato ou a negativa de autoria afasta as demais. A dúvida penal (falta de provas) não vincula. A falta residual ainda pode ser punida (Súmula 18 do STF).", "o": ["Inexistência do fato ou negativa de autoria", "Extinção da punibilidade pela prescrição", "Existência de falta residual administrativa", "Insuficiência de provas para condenar o militar"], "k": 0}];

/* ===================== 2) ESTADO E PERSISTÊNCIA ===================== */
const TOTAL = QUESTOES.length;
const CHAVE = "quiz-dir-adm-v1";
let estado = { atual: 0, resp: {}, sel: {} };   // resp[i] = índice confirmado; sel[i] = seleção ainda não confirmada

function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch(e){} }
function carregar(){
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if (s && s.resp && typeof s.atual === "number") estado = { atual: Math.min(s.atual, TOTAL-1), resp: s.resp, sel: s.sel || {} };
  } catch(e){}
}

/* ===================== 3) CORREÇÃO E DESEMPENHO ===================== */
const foiRespondida = i => estado.resp[i] !== undefined;
const acertou = i => foiRespondida(i) && estado.resp[i] === QUESTOES[i].k;
function desempenho(){
  let ok = 0, bad = 0;
  for (let i = 0; i < TOTAL; i++) if (foiRespondida(i)) (acertou(i) ? ok++ : bad++);
  const resp = ok + bad;
  return { ok, bad, resp, pct: resp ? Math.round(100 * ok / resp) : 0, pctTotal: Math.round(100 * ok / TOTAL) };
}

/* ===================== 4) INTERFACE ===================== */
const $ = id => document.getElementById(id);
const LETRAS = ["A","B","C","D"];
const rotulo = (q, j) => q.t === "vf" ? q.o[j] : LETRAS[j];

function renderPlacar(){
  const d = desempenho();
  $("sOk").textContent = d.ok; $("sBad").textContent = d.bad; $("sPct").textContent = d.pct + "%";
  $("sAns").textContent = d.resp;
  $("barFill").style.width = (100 * d.resp / TOTAL) + "%";
  $("barFill").parentElement.setAttribute("aria-valuenow", d.resp);
}

function renderQuestao(){
  const i = estado.atual, q = QUESTOES[i], conf = foiRespondida(i);
  $("qNum").textContent = i + 1;
  $("qAula").textContent = q.a;
  $("qType").textContent = q.t === "vf" ? "Verdadeiro ou Falso" : "Múltipla escolha";
  $("qText").textContent = q.q;

  const box = $("qOpts"); box.innerHTML = "";
  q.o.forEach((txt, j) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt" + (q.t === "vf" ? " vf" : "");
    b.setAttribute("role", "radio");
    const marcada = conf ? estado.resp[i] === j : estado.sel[i] === j;
    b.setAttribute("aria-checked", marcada ? "true" : "false");
    const l = document.createElement("span"); l.className = "l"; l.textContent = rotulo(q, j);
    b.appendChild(l);
    if (q.t === "mc") { const t = document.createElement("span"); t.className = "t"; t.textContent = txt; b.appendChild(t); }
    if (conf) {
      b.disabled = true;
      if (j === q.k) { b.classList.add("correct"); b.insertAdjacentHTML("beforeend", '<span class="mark">✔</span>'); }
      else if (j === estado.resp[i]) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", '<span class="mark">✖</span>'); }
    } else if (marcada) b.classList.add("selected");
    b.addEventListener("click", () => selecionar(j));
    box.appendChild(b);
  });

  const fb = $("qFeedback");
  if (conf) {
    const ok = acertou(i);
    fb.className = "feedback " + (ok ? "ok" : "bad");
    $("fVerdict").textContent = ok ? "✅ Correto!" : "❌ Incorreto.";
    $("fRight").innerHTML = "<b>Resposta correta: " + (q.t === "vf" ? q.o[q.k] : LETRAS[q.k]) + "</b>" + (q.t === "mc" ? " — " + esc(q.o[q.k]) : "");
    $("fExplain").textContent = q.x;
  } else fb.className = "feedback hidden";

  $("btnConfirm").disabled = conf || estado.sel[i] === undefined;
  $("btnConfirm").classList.toggle("hidden", conf);
  $("btnPrev").disabled = i === 0;
  $("btnNext").textContent = i === TOTAL - 1 ? "Ver resultado" : "Próxima →";
  renderPlacar(); renderMapa();
  salvar();
}
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function renderMapa(){
  const m = $("map"); if (m.classList.contains("hidden")) return;
  m.innerHTML = "";
  for (let i = 0; i < TOTAL; i++) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = i + 1;
    if (foiRespondida(i)) b.classList.add(acertou(i) ? "c" : "w");
    if (i === estado.atual) b.classList.add("cur");
    b.addEventListener("click", () => irPara(i));
    m.appendChild(b);
  }
}

/* ===================== 5) NAVEGAÇÃO ===================== */
function irPara(i){ estado.atual = Math.max(0, Math.min(TOTAL - 1, i)); mostrar("quiz"); renderQuestao(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function anterior(){ if (estado.atual > 0) irPara(estado.atual - 1); }
function proxima(){ estado.atual === TOTAL - 1 ? mostrarResultado() : irPara(estado.atual + 1); }
function selecionar(j){ if (foiRespondida(estado.atual)) return; estado.sel[estado.atual] = j; renderQuestao(); }
function confirmar(){
  const i = estado.atual;
  if (foiRespondida(i) || estado.sel[i] === undefined) return;
  estado.resp[i] = estado.sel[i]; delete estado.sel[i];
  renderQuestao();
  $("qFeedback").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function mostrar(qual){
  $("quizView").classList.toggle("hidden", qual !== "quiz");
  $("resultView").classList.toggle("hidden", qual !== "result");
}

/* ===================== 6) RESULTADO FINAL ===================== */
function mostrarResultado(){
  const d = desempenho();
  const falt = TOTAL - d.resp;
  $("rNote").textContent = falt ? falt + " questão(ões) ainda sem resposta — o aproveitamento abaixo considera as " + d.resp + " respondidas." : "";
  $("rTot").textContent = TOTAL; $("rOk").textContent = d.ok; $("rBad").textContent = d.bad;
  $("rPct").textContent = (falt ? d.pct : d.pct) + "%";
  const por = {};
  QUESTOES.forEach((q, i) => { const a = q.a; por[a] = por[a] || { n: 0, ok: 0, bad: 0 }; por[a].n++; if (foiRespondida(i)) (acertou(i) ? por[a].ok++ : por[a].bad++); });
  let h = "<tr><th>Assunto</th><th>Questões</th><th>Acertos</th><th>Erros</th></tr>";
  Object.keys(por).forEach(a => { h += "<tr><td>" + esc(a) + "</td><td>" + por[a].n + "</td><td>" + por[a].ok + "</td><td>" + por[a].bad + "</td></tr>"; });
  $("rTable").innerHTML = h;
  mostrar("result"); window.scrollTo({ top: 0, behavior: "smooth" });
}
function refazer(){
  if (!confirm("Reiniciar o quiz? Suas respostas atuais serão apagadas.")) return;
  estado = { atual: 0, resp: {}, sel: {} }; salvar(); irPara(0);
}

/* ===================== 7) EVENTOS ===================== */
$("btnPrev").addEventListener("click", anterior);
$("btnNext").addEventListener("click", proxima);
$("btnConfirm").addEventListener("click", confirmar);
$("btnRestart").addEventListener("click", refazer);
$("btnRestartTop").addEventListener("click", refazer);
$("btnBack").addEventListener("click", () => irPara(0));
$("btnFinish").addEventListener("click", mostrarResultado);
$("btnMap").addEventListener("click", () => { $("map").classList.toggle("hidden"); renderMapa(); });
$("btnGo").addEventListener("click", () => { const n = parseInt($("goto").value, 10); if (n >= 1 && n <= TOTAL) irPara(n - 1); });
$("goto").addEventListener("keydown", e => { if (e.key === "Enter") $("btnGo").click(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || $("quizView").classList.contains("hidden")) return;
  const q = QUESTOES[estado.atual], k = e.key.toLowerCase();
  if (q.t === "mc" && "abcd".includes(k) && k.length === 1) selecionar("abcd".indexOf(k));
  else if (q.t === "vf" && (k === "v" || k === "f")) selecionar(k === "v" ? 0 : 1);
  else if (e.key === "ArrowLeft") anterior();
  else if (e.key === "ArrowRight") proxima();
  else if (e.key === "Enter" && !e.target.closest("button")) confirmar();
});

/* ===================== 8) INÍCIO ===================== */
$("qTot").textContent = TOTAL; document.querySelectorAll(".tot").forEach(e => e.textContent = TOTAL);
$("goto").max = TOTAL; $("barFill").parentElement.setAttribute("aria-valuemax", TOTAL);
carregar(); mostrar("quiz"); renderQuestao();
</script>
</body>
</html>
