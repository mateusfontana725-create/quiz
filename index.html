<title>Simulado APH</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--c:#fff;--t:#1d1d1b;--m:#6b6b66;--b:#d9d7cf;--ok:#1b7f4b;--okb:#e0f3e9;--er:#b3261e;--erb:#fbe4e2;--ac:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--c:#262624;--t:#eee;--m:#a5a5a0;--b:#3d3d3a;--okb:#16382a;--erb:#432120;--ok:#5fd394;--er:#ff8a80}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t)}
button{cursor:pointer}
.sc{margin-left:auto;font-weight:600}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.tag{font-size:.75rem;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.q{margin:6px 0 10px;font-weight:600;white-space:pre-line}
.o{display:block;width:100%;text-align:left;margin:6px 0}
.o.ok{background:var(--okb);border-color:var(--ok)}
.o.er{background:var(--erb);border-color:var(--er)}
.o:disabled{cursor:default;color:var(--t)}
.vf{display:flex;gap:8px;align-items:center;margin:6px 0}
.vf span{flex:1}
.vf button{min-width:44px}
.fb{margin-top:8px;font-size:.9rem;color:var(--m)}
.fb.ok{color:var(--ok)}.fb.er{color:var(--er)}
.res{text-align:center;font-size:1.1rem}
</style></head><body><main>
<h1>🚑 Simulado APH — Alfa &amp; Bravo</h1>
<div class="bar">
<select id="f"></select>
<button id="rs">Reiniciar</button>
<span class="sc" id="sc"></span>
</div>
<div id="app"></div>
</main>
<script>
const Q=[],mc=(s,q,o,a)=>Q.push({s,q,o,a}),vf=(s,q,i,a)=>Q.push({s,q,i,a,v:1});
let s="Alfa · G1";
mc(s,"O Acidente Vascular Encefálico (AVE) pode ser classificado em dois tipos principais. Quais são eles?",["Traumático e infeccioso.","Cardíaco e hemorrágico","Isquêmico e hemorrágico.","Isquêmico e neurológico"],2);
mc(s,"O que caracteriza uma convulsão?",["Apenas uma alteração da pressão arterial.","Uma dor muscular causada por esforço físico.","Uma alteração respiratória sem envolvimento cerebral.","Uma contração involuntária da musculatura, provocando movimentos desordenados, geralmente acompanhada de perda da consciência e relacionada a uma desordem elétrica cerebral."],3);
mc(s,"Durante uma crise convulsiva, qual deve ser uma das principais preocupações do profissional?",["Fazer a pessoa beber água.","Segurar os braços e as pernas da vítima.","Colocar algum objeto dentro da boca para evitar que morda a língua.","Evitar lesões secundárias, protegendo a cabeça, afastando objetos perigosos, mantendo as vias aéreas livres e colocando a pessoa em posição lateral de segurança assim que possível."],3);
s="Alfa · G2";
mc(s,"A síncope (desmaio) é uma intercorrência frequente no APH. Assinale a alternativa que traz a sua correta caracterização fisiopatológica:",["Perda gradual e prolongada da consciência com rigidez muscular persistente.","Perda abrupta da consciência decorrente da privação temporária de oxigênio no cérebro, com perda do tônus postural e rápida recuperação espontânea.","Alteração permanente do estado mental sem capacidade de recuperação espontânea.","Parada cardiorrespiratória irreversível decorrente de infarto agudo do miocárdio."],1);
mc(s,"Nas emergências respiratórias, a dispneia é clinicamente descrita como:",["Parada completa da ventilação com ausência de movimentos torácicos.","Uma respiração difícil, desconfortável ou desagradável, comumente relatada pelo paciente como 'fome de ar'.","Aumento fisiológico da frequência respiratória exclusivamente durante o sono.","Diminuição da frequência cardíaca associada a pulso pleno e forte."],1);
mc(s,"Quais são os objetivos terapêuticos da administração de oxigênio suplementar?",["Induzir broncodilatação direta e promover a eliminação de CO2","Corrigir a hipoxemia, melhorar a difusão tecidual e reduzir a carga de trabalho cardiopulmonar.","Estimular a frequência respiratória e elevar a pressão arterial.","Substituir a ventilação assistida em pacientes em parada respiratória."],1);
s="Alfa · G3";
mc(s,"Qual é o mecanismo fisiopatológico primário responsável pela maioria dos casos de Infarto Agudo do Miocárdio (IAM)?",["O descolamento de um coágulo no ventrículo direito que se aloja em pequenos vasos cerebrais.","O espasmo vascular transitório decorrente de estresse emocional em artérias sem acúmulo prévio de gordura.","A destruição irreversível dos alvéolos pulmonares provocada por hiperinsuflação e retenção de dióxido de carbono.","A ruptura física de uma placa aterosclerótica com subsequente formação de um trombo oclusivo na artéria coronária."],3);
mc(s,"Sobre a formação da placa aterosclerótica, assinale a alternativa CORRETA:",["O colesterol permanece apenas no sangue, sem entrar na parede arterial.","A aterosclerose ocorre exclusivamente pela formação de coágulos dentro das artérias.","A lesão do endotélio permite a entrada de LDL na parede arterial, desencadeando inflamação e formação de células espumosas.","As células musculares da artéria destroem completamente o colesterol acumulado.","A formação da placa aumenta o espaço disponível para a passagem do sangue."],2);
mc(s,"Qual das opções abaixo apresenta um sinal de gravidade na exacerbação aguda da DPOC?",["Sibilância.","Taquipneia (aumento da frequência respiratória).","Edema periférico.","Confusão mental.","Hiperinsuflação pulmonar."],3);
s="Alfa · G4";
vf(s,"Em uma ocorrência de emergências psiquiátricas, em que a vítima apresenta sinais de alerta para risco suicida, o socorrista:",["não deve deixar o paciente sozinho quando houver risco imediato","remover, quando possível e seguro, objetos ou meios potencialmente perigosos","encaminhar para avaliação especializada","dizer “não existe ninguém querendo te machucar”"],[1,1,1,0]);
mc(s,"Durante a triagem pelo Método START em um IMUV, um socorrista avalia uma vítima adulta que não caminha. Ao abrir a via aérea (manobra manual), a vítima volta a respirar com frequência de 24 irpm e perfusão maior que dois segundos. Qual deve ser a cor da prioridade?",["Preta","Vermelha","Amarela","Verde"],1);
mc(s,"Em resposta inicial a IMUVs/desastres, dentro das delimitações das zonas quente, morna e fria, qual é o ponto ideal para o tratamento da vítima?",["Zona morna","Zona fria","Zona quente","Zona neutra"],-1);
s="Alfa · G5";
mc(s,"A guarnição encontra uma vítima com queimadura por líquido quente. Após garantir a segurança e interromper o processo da queimadura, parte da roupa está aderida à pele. A conduta correta é:",["Retirar toda a roupa imediatamente, inclusive a parte aderida à pele.","Resfriar a queimadura utilizando gelo diretamente sobre a pele.","Retirar as roupas da vítima e, caso alguma parte esteja aderida à pele, não arrancá-la à força; realizar o resfriamento com água em temperatura ambiente, deixando-a correr suavemente sobre o local, sem esfregar a pele.","Cobrir imediatamente a queimadura com uma pomada e iniciar o transporte, evitando qualquer contato da água."],2);
mc(s,"Na avaliação de um paciente em exacerbação de asma no APH, qual achado é sinal de gravidade indicativo para acionar o Suporte Avançado de Vida (SAV)?",["Presença de tórax silencioso ou rebaixamento de nível de consciência","FC entre 100-120 bpm","SpO2 > 90%","Capacidade de falar frases completas e preferência por ficar sentado."],0);
mc(s,"Sobre a classificação das queimaduras quanto à profundidade, assinale a correta:",["A queimadura de 1º grau atinge a derme e apresenta bolhas intensas.","A queimadura de 2º grau atinge a epiderme e parte da derme, podendo apresentar bolhas e dor acentuada.","A queimadura de 3º grau atinge somente a epiderme e apresenta vermelhidão.","A queimadura de 3º grau sempre provoca dor intensa em toda a região afetada."],1);
s="Bravo · G1";
mc(s,"Qual é o principal mecanismo fisiopatológico responsável pelo Infarto Agudo do Miocárdio (IAM)?",["Ocorre devido a um espasmo muscular passageiro e isolado na parede da artéria coronária.","É desencadeado pelo acúmulo direto e repentino de oxigênio na musculatura do coração.","Decorre da ruptura ou erosão de uma placa aterosclerótica com formação de trombo oclusivo, processo iniciado por lesão endotelial (hipertensão, diabetes, tabagismo), acúmulo de LDL na íntima, formação de células espumosas e de uma capa fibrosa que, ao se romper, bloqueia o fluxo de oxigênio ao miocárdio.","É provocado por uma inflamação aguda nas válvulas cardíacas sem qualquer envolvimento de placas de gordura."],2);
mc(s,"Em relação ao diagnóstico diferencial das dores torácicas, como se caracteriza a Angina Instável em comparação à Estável?",["Surge apenas durante esforço físico intenso e dura menos de 10 minutos.","É totalmente previsível e alivia rapidamente apenas com o repouso.","Possui baixo risco imediato de evolução para infarto e melhora com nitrato sublingual.","Ocorre no repouso ou com mínimo esforço, é imprevisível e súbita, tem duração prolongada (podendo superar 20 minutos), frequentemente não melhora com repouso ou medicação usual e decorre da ruptura de placa com trombo parcial, com alto risco iminente de infarto."],3);
mc(s,"Quais são as condutas recomendadas no APH para paciente com suspeita de IAM?",["Transporte imediato em alta velocidade com sirene ligada para qualquer posto de saúde próximo.","Abordagem primária ABCD e histórico SAMPLE, vítima confortável e semissentada em repouso absoluto, oferta de oxigênio, monitorização constante de sinais vitais e SpO2, transporte calmo e sem sirene para hospital com unidade coronariana.","Orientação para o paciente caminhar até a ambulância e aguardar atendimento em pé.","Administração imediata de água fria e liberação do paciente sem regulação médica."],1);
mc(s,"Como são classificados os tipos de AVE/AVC e quais são seus mecanismos desencadeantes?",["Apenas isquêmico, decorrente exclusivamente de hipoglicemia grave.","O hemorrágico é causado pelo bloqueio da artéria por placas de gordura calcificadas sem sangramento.","Isquêmico — subdividido em Trombose (trombo sobre placa aterosclerótica cerebral) e Embolia (coágulo de outra região, como o coração, que se aloja em vaso menor) — e Hemorrágico, por rompimento de vasos devido principalmente a pressão alta descontrolada, aneurismas ou malformações arteriovenosas.","Alteração muscular periférica causada por esforço físico excessivo nos membros superiores."],2);
mc(s,"Qual ferramenta é usada na avaliação pré-hospitalar para identificação rápida de suspeita de AVE e quais parâmetros analisa?",["Escala de dor torácica, para avaliar se há radiação para os membros inferiores.","Escala de Cincinnati: Assimetria Facial (sorrir/mostrar os dentes), Debilidade dos Braços (olhos fechados e braços estendidos) e Fala Anormal (repetir uma frase), como apoio diante de paresia, parestesia e cefaleia súbita.","Medição isolada da glicemia capilar para confirmar o diagnóstico definitivo de derrame.","Aferição da frequência respiratória durante o repouso."],1);
mc(s,"Quais são os cuidados e condutas indicados no APH durante o atendimento a vítima de AVE?",["Posicionar o paciente com a cabeça rebaixada a 0° e transportar rápido com sirene ligada.","Manter o paciente calmo com cabeceira elevada a 30°, avaliação ABCDE primária e secundária (sinais vitais e saturação), registrar com precisão o horário de início dos sintomas devido à janela terapêutica do trombolítico (< 4,5 h), histórico SAMPLA e transporte suave e monitorado.","Oferecer medicação oral para dor e liberar o paciente para repousar em residência.","Verificar apenas o pulso e aguardar a melhora espontânea dos déficits motores."],1);
s="Bravo · G2";
mc(s,"Convulsão — Qual é a conduta NÃO adequada no atendimento à vítima em convulsão?",["Adotar posição lateral de segurança.","Observar o período de crise.","Após a crise realizar avaliação primária e secundária.","Transportar o paciente de maneira tranquila e oferecer O2 se necessário.","Colocar as mãos ou objetos dentro da boca da vítima para evitar que ela enrole a língua."],4);
mc(s,"Convulsão — A cerca da convulsão, assinale a correta:",["É a contração involuntária da musculatura que provoca movimentos desordenados, geralmente com perda da consciência, por desordem elétrica cerebral, podendo ter origens clínicas ou traumáticas.","Se durar mais de cinco minutos é uma crise leve que não necessita de cuidados médicos.","É condição exclusivamente neurológica causada por movimentos voluntários.","A proteção da cabeça da vítima é dispensável por parte do socorrista.","Ocorre exclusivamente pela falta de oxigênio no cérebro."],0);
vf(s,"Convulsão — Assinale V ou F:",["A convulsão é classificada em crise generalizada tônico-clônica, ausência, mioclônica ou crises focais."],[1]);
mc(s,"Desmaio — O desmaio pode indicar problemas, EXCETO:",["Cardíacos.","Neurológicos.","Queda súbita de pressão arterial.","Crise de ansiedade ou histeria.","Hiperglicemia e problemas de circulação."],4);
vf(s,"Desmaio — Assinale V ou F:",["Um dos sinais e sintomas do desmaio é a sensação de fraqueza muscular."],[1]);
mc(s,"Desmaio — Sobre o desmaio é correto afirmar, EXCETO:",["Não jogar água ou molhar o rosto da vítima.","Não dar tapas no rosto da vítima.","Oferecer alimentos ou bebidas até que a pessoa esteja totalmente acordada.","Se associada a um IAM ou AVC, acionar suporte avançado de vida.","É chamado cientificamente como termo síncope."],2);
s="Bravo · G3";
mc(s,"Em casos de DPOC, um dos tratamentos indicados é:",["Oxigênio suplementar: cateter nasal ou venturi se <88-92% SpO2","Oxigênio suplementar: cateter nasal ou venturi se <90-94% SpO2","Sentar na posição vertical levemente inclinado","Realizar exame primário e secundário detalhado","Utilizar bombinha de asma"],0);
mc(s,"São sinais clínicos de DPOC:",["Sibilância, taquipneia, redução da saturação de O₂, uso da musculatura acessória, edema periférico e hiperinsuflação pulmonar.","Bradipneia, saturação normal, ausência de sibilância e ausência de uso da musculatura acessória.","Taquipneia, saturação normal, tosse seca e ausência de edema.","Frequência respiratória normal, saturação elevada, sibilância e ausência de hiperinsuflação.","Bradipneia, saturação elevada, ausência de esforço respiratório e redução da frequência cardíaca."],0);
mc(s,"Principais causas da DPOC:",["Poeira doméstica, frio intenso, estresse e sedentarismo.","Infecções respiratórias, alergias, umidade e falta de exercícios.","Cigarros, cigarros eletrônicos, cachimbos, narguilés e poluição ambiental.","Alimentação inadequada, obesidade, álcool e exposição ao sol.","Vírus, bactérias, mudanças climáticas e baixa ingestão de água."],2);
mc(s,"No APH a uma vítima em crise de asma, assinale a conduta INCORRETA:",["Folgar as roupas da vítima para diminuir a sensação de opressão.","Incentivar a vítima a respirar de forma lenta e profunda, inspirando pelo nariz e expirando pela boca.","Posicionar a vítima sentada na posição vertical, levemente inclinada para a frente.","Administrar oxigenioterapia suplementar para manter a saturação de 94%.","Orientar a vítima a realizar apneia forçada por 20 segundos repetidas vezes para expandir os alvéolos."],4);
mc(s,"Sobre a fisiopatologia da crise asmática em comparação com outras patologias respiratórias, assinale a sequência CORRETA:",["Alérgeno → Inflamação aguda → Broncoespasmo → Crise → Reversível","Tabagismo → Inflamação crônica → Destruição/obstrução → Progressão → Irreversível","Crise → Inflamação aguda → Broncoespasmo → Reversível → Alérgeno","Tabagismo → Alérgeno → Destruição/obstrução → Progressão → Reversível","Alérgeno → Tosse → Crise → Falta de ar → Reversível"],0);
mc(s,"Sobre o uso do inalador dosimetrado (sem espaçador), indique o procedimento INCORRETO:",["Agitar bem o medicamento antes da aplicação e remover a tampa do dispositivo.","Colocar o dispositivo distante da boca (cerca de 30 cm) para facilitar a inalação pelo ar.","Esvaziar totalmente o ar dos pulmões antes de acionar a bombinha.","Encaixar o bocal entre os dentes, fechar os lábios, apertar a bombinha e puxar o ar de forma lenta e profunda.","Segurar o ar (apneia) por 10 segundos após a inalação e soltar o ar na sequência."],1);
s="Bravo · G4";
mc(s,"Quais indicações para uso de oxigênio no paciente são corretas?",["Aumentar a taxa de oxigênio no tecido musculoesquelético.","Corrigir hipoxemia/hipóxia tissular e prevenir trabalho cardiopulmonar excessivo.","Dificultar a quantidade de CO no sangue.","Aumentar a imunidade e melhorar a saúde cardiopulmonar."],1);
mc(s,"De acordo com o material sobre oxigenoterapia, qual alternativa apresenta um dos objetivos do tratamento?",["Reduzir o trabalho respiratório aumentando o dióxido de carbono.","Minimizar a necessidade de intubação em pacientes estáveis.","Aumentar a ventilação alveolar através da retenção metabólica de oxigênio.","Facilitar a absorção de ar nas cavidades orgânicas e minimizar a carga de trabalho cardiopulmonar"],3);
mc(s,"Sobre a máscara não reinalante utilizada em oxigenoterapia de alto fluxo, assinale a correta:",["Não possui válvulas de proteção.","Provoca alta reinalação do CO2 expirado.","É indicada apenas para traumas com indicação de intubação.","Possui válvula anti-retorno e é utilizada no trauma quando a intubação ainda não está indicada, bem como em emergências clínicas com hipoxemia moderada-grave."],3);
s="Bravo · Emerg. Psiquiátrica";
mc(s,"O que é uma emergência psiquiátrica?",["Uma situação que envolve apenas doenças físicas.","Uma situação de saúde mental que exige avaliação e atendimento imediato.","Uma consulta de rotina, sem urgência.","Uma situação que pode ser ignorada sem riscos."],1);
mc(s,"Paciente com agitação intensa, grita e demonstra comportamento agressivo. Qual deve ser a primeira conduta da equipe?",["Realizar imediatamente a contenção física do paciente.","Garantir a segurança do local, avaliar os riscos e tentar estabelecer uma comunicação calma e respeitosa.","Administrar medicamentos imediatamente, sem avaliação inicial.","Confrontar verbalmente o paciente para interromper seu comportamento.","Deixar o paciente sozinho até que ele se acalme."],1);
mc(s,"Paciente com sinais de possível tentativa de suicídio relata que não deseja mais viver. Qual é a conduta mais adequada?",["Dizer que ele precisa ser forte e parar de pensar nisso.","Deixar o paciente sozinho para que possa descansar.","Evitar falar sobre suicídio para não incentivar esse comportamento.","Avaliar imediatamente o risco de suicídio, garantir a segurança do paciente e oferecer acolhimento e atendimento especializado.","Liberar o paciente se ele afirmar que está se sentindo melhor."],3);
s="Bravo · G5";
mc(s,"Sobre a definição de queimadura e os fatores de sua gravidade clínica, assinale a correta:",["Lesões restritas à epiderme, causadas somente pela exposição direta ao calor.","A gravidade depende exclusivamente da intensidade da dor apresentada pela vítima.","Tecidos profundos, como músculos, ossos e órgãos internos, nunca podem ser atingidos.","Lesão provocada por agentes externos sobre o revestimento corporal, cuja gravidade depende da associação entre profundidade, extensão e área corporal atingida, além das características do agente causador."],3);
mc(s,"Quanto aos agentes etiológicos das queimaduras (físicos, químicos e biológicos), é correto afirmar:",["Podem ser físicos (térmicos, elétricos, radiantes); químicos (ácidos e álcalis de produtos industriais ou domésticos); e biológicos (animais e organismos como taturanas, águas-vivas e urtigas).","Raios e correntes elétricas são agentes biológicos.","Produtos de limpeza, como soda cáustica, são agentes físicos.","Fogo e líquidos quentes pertencem exclusivamente ao grupo dos agentes químicos."],0);
mc(s,"Aplicando a Regra dos Nove em um adulto, assinale a correlação correta:",["Cabeça 18%, membros superiores 18% cada e genitais 9%.","Membros inferiores 9% cada, tronco anterior 9% e dorso 9%.","Cabeça 9%; cada membro superior 9%; tronco anterior 18%; tronco posterior 18%; cada membro inferior 18%; região genital 1%.","Cada membro superior 4,5% e cada membro inferior 36%."],2);
mc(s,"Na resposta inicial a um IMUV, com demanda excedendo os recursos, a diferença fundamental em relação ao APH convencional é que o objetivo principal é:",["Fazer o melhor para cada paciente individualmente, dedicando todos os recursos à vítima mais grave até estabilizá-la.","Fazer o melhor para o maior número de vítimas com os recursos disponíveis, no menor tempo possível, para então direcioná-las ao tratamento definitivo.","Atender apenas as vítimas conscientes, deixando as demais para recursos adicionais.","Aguardar a chegada do médico para iniciar qualquer atendimento ou triagem."],1);
vf(s,"Verdadeiro ou falso:",["IMV é definido, segundo o PHTLS, como incidentes com vítimas em massa: incidentes cuja demanda (número de vítimas) excede os recursos disponíveis na comunidade."],[1]);
mc(s,"No algoritmo START, qual parâmetro de FR classifica diretamente na categoria Vermelha a vítima que não consegue caminhar?",["FR superior a 30 mrpm.","FR superior a 50 mrpm associada a sangramento periférico.","FR exatamente igual a 0 mrpm antes da abertura das vias aéreas.","FR estritamente entre 12 e 20 mrpm."],0);

s="Afogamento · Questões";
mc(s,"Segundo a OMS (Congresso de Amsterdã, 2002), o afogamento é definido como:",["A aspiração de líquido causada por submersão do indivíduo ou imersão das vias aéreas em meio aquoso.", "A obstrução das vias aéreas pelo líquido ingerido durante um engasgo.", "A perda de consciência por queda brusca da pressão arterial dentro da água.", "A ingestão de água que chega ao esôfago e ao estômago."],0);
vf(s,"Assinale V ou F:",["Aspiração é a entrada de líquido nas vias aéreas (traqueia, brônquios e/ou pulmões).","Engolir água, que chega ao esôfago e ao estômago, é o mesmo que aspiração."],[1,0]);
mc(s,"Durante o afogamento, o laringoespasmo (fechamento da glote) é uma resposta do organismo que:",["Ocorre apenas após a parada cardiorrespiratória.", "Aumenta a entrada de água nos pulmões para facilitar a respiração.", "Impede a entrada de água nas vias aéreas; com a hipóxia o reflexo cessa, mas se a vítima não for retirada da água o afogamento continua.", "Garante a oxigenação do cérebro sem necessidade de socorro."],2);
mc(s,"Qual é a diferença entre imersão e submersão no afogamento?",["Imersão é a água cobrindo totalmente o corpo; submersão é apenas a água na face.", "Não há diferença, são dois nomes para o mesmo evento.", "Imersão ocorre apenas em água salgada; submersão, apenas em água doce.", "Imersão é a água na face (vias aéreas em contato com o líquido); submersão é a pessoa abaixo da superfície do líquido."],3);
mc(s,"Qual situação caracteriza um afogamento SECUNDÁRIO?",["Uma pessoa que não sabe nadar e entra no mar sem supervisão.", "Uma convulsão ou infarto que impede a vítima de manter o rosto fora da água.", "Cansaço físico excessivo dentro da água.", "Correntes marítimas fortes que arrastam o nadador."],1);
mc(s,"A hidrocussão (choque térmico na água) ocorre quando:",["A pessoa engole água gelada durante um mergulho em água doce.", "A vítima perde o surfactante dos alvéolos após inspirar ar frio.", "O corpo aquecido é exposto de repente a água cerca de 5 °C mais fria que a temperatura corporal.", "A pessoa fica muito tempo submersa em água morna."],2);
mc(s,"Uma vítima foi classificada como Grau 4 de afogamento no atendimento em área seca. Após 5 minutos, evolui para PCR. Como ela deve ser considerada?",["Continua Grau 4; o grau não muda após a classificação, apenas o quadro clínico evolui.", "Reclassificada como Grau 6, pois evoluiu para PCR.", "Passa a Resgate, por ter sido estabilizada.", "Passa a Grau 1, pois a PCR é reversível."],0);
mc(s,"Uma vítima de afogamento está sem respiração, mas apresenta sinais de circulação após 5 ventilações iniciais. Qual é o grau e a conduta?",["Grau 6; RCP 30:2.", "Grau 2; oxigênio nasal a 5 L/min.", "Resgate; liberar a vítima do local.", "Grau 5; 1 ventilação a cada 5 a 6 segundos (10 a 12 por minuto)."],3);
mc(s,"No grau 6 do afogamento (PCR), em adulto atendido por um socorrista, a relação de compressões e ventilações é:",["15 compressões para 2 ventilações.", "3 compressões para 1 ventilação.", "30 compressões para 2 ventilações.", "5 ventilações e depois 2 compressões."],2);
vf(s,"Quando não fazer RCP, assinale V ou F:",["Não se deve iniciar a RCP em PCR com tempo de submersão maior que 1 hora, rigidez cadavérica, decomposição ou livores.","Rigidez cadavérica e livores são sinais que indicam que a RCP deve ser iniciada imediatamente."],[1,0]);
mc(s,"A espuma que sai pela boca e pelo nariz da vítima de afogamento é formada por:",["Saliva em excesso produzida pelo medo.", "Ar + proteína alveolar (surfactante) + água, formada nas vias aéreas durante o esforço de respirar.", "Sangue proveniente de lesões pulmonares.", "Vômito formado pela ingestão de água do mar."],1);
mc(s,"Na Posição Lateral de Segurança (PLS) em vítimas de afogamento, a posição deve ser feita para o lado:",["Esquerdo, por ser o lado de menor alagamento.", "Ventral, com o rosto voltado para o chão.", "Tanto faz, desde que a cabeça fique abaixada.", "Direito, pois o pulmão direito alaga muito mais que o esquerdo."],3);
mc(s,"Ao usar a pocket mask boca a boca, a oferta aproximada de oxigênio é de:",["17%", "21%", "60%", "100%"],0);
mc(s,"Um adulto em PCR por afogamento é atendido por 2 guarda-vidas. Qual é a sequência de SBV em área seca?",["5 ventilações iniciais e depois 30 compressões para 2 ventilações, com 1 socorrista.", "Apenas compressões, sem ventilações.", "5 ventilações iniciais e depois 15 compressões para 2 ventilações, com 2 socorristas.", "10 ventilações iniciais e depois 3 compressões para 1 ventilação."],2);
mc(s,"No afogamento, qual ritmo é o mais comum na PCR (grau 6), e por quê?",["FV ou TVSP, por arritmia cardíaca primária.", "Bradicardia sinusal, por hipotermia.", "Taquicardia supraventricular, por estresse.", "AESP e assistolia (não chocáveis), por causa da hipóxia que antecede a PCR."],3);
mc(s,"Quando o DEA deve ser usado no afogamento?",["Em todas as vítimas de afogamento, independentemente do ritmo.", "Nas PCR por afogamento secundário (ex.: trauma ou arritmia), em geral com FV ou TVSP, e assim que houver acesso ao aparelho.", "Somente após 1 hora de submersão.", "Nunca, pois o DEA não pode ser usado em área seca."],1);
mc(s,"Quanto à imobilização da coluna cervical no afogamento, assinale a correta:",["É indicada somente em casos de forte suspeita (ex.: mergulho, esqui aquático, surf ou embarcação), pois lesões cervicais ocorrem em menos de 0,5% dos afogados.", "Deve ser feita em todas as vítimas, pois lesões cervicais são comuns.", "Não deve ser feita nunca, mesmo com forte suspeita.", "Deve ser feita apenas em vítimas conscientes."],0);
mc(s,"No transporte da água para a área seca, qual posição deve ser mantida na vítima de afogamento?",["Deitada de bruços, com a cabeça abaixada.", "Com as pernas elevadas acima do coração.", "Na vertical, com as vias aéreas abertas, para prevenir vômitos e aspiração.", "Sentada com a cabeça apoiada no peito."],2);
mc(s,"Qual é a conduta correta na área seca para uma vítima de afogamento?",["Tentar retirar a água dos pulmões, pressionando o abdômen.", "Virar a vítima de cabeça para baixo para drenar a água.", "Dar água à vítima para que ela se hidrate.", "Posicionar a cabeça no mesmo nível do tronco e não tentar retirar a água do pulmão, pois isso aumenta o risco de vômito e atrasa a ventilação."],3);
mc(s,"Na triagem START em múltiplas vítimas de afogamento, a prioridade é:",["Atender primeiro a vítima de maior gravidade, dedicando todos os recursos a ela.", "Salvar o maior número possível de vidas com os recursos disponíveis, e não atender somente a de maior gravidade no primeiro momento.", "Atender apenas as vítimas conscientes.", "Aguardar a chegada de todos os recursos antes de iniciar qualquer resgate."],1);
mc(s,"No START aplicado ao afogamento, a vítima de cor PRETA (sem movimentos, submersa) deve receber qual conduta?",["Resgate prioritário com aproximação imediata.", "Orientação e liberação do local.", "Ressuscitação dentro da água e avaliação de RCP em área seca.", "Transporte imediato em posição sentada."],2);
mc(s,"Segundo o instrutor, qual é o maior objetivo do atendimento, independentemente do serviço ou da área de atuação?",["O bem-estar da vítima, com maior possibilidade de sobrevida e menor probabilidade de sequelas por causas alheias ao acidente principal.", "Atender o maior número de pessoas no menor tempo possível.", "Garantir a remoção rápida da vítima ao hospital, sem outras condutas.", "Registrar corretamente o grau de afogamento antes de qualquer conduta."],0);

const L="ABCDE",$=id=>document.getElementById(id);
const sets=["Todos",...new Set(Q.map(q=>q.s.split(" · ")[0])),...new Set(Q.map(q=>q.s))];
$("f").innerHTML=sets.map(x=>`<option>${x}</option>`).join("");
let st={};
function list(){const v=$("f").value;return Q.map((q,i)=>[q,i]).filter(([q])=>v=="Todos"||q.s==v||q.s.startsWith(v+" "))}
function score(){let a=0,e=0;for(const k in st){if(st[k]===true)a++;else if(st[k]===false)e++}$("sc").textContent=`✔ ${a}  ✘ ${e}`}
function render(){
 const l=list();
 $("app").innerHTML=l.map(([q,i],n)=>{
  let h=`<div class="card" id="c${i}"><div class="tag">${n+1}/${l.length} · ${q.s}</div><div class="q">${q.q}</div>`;
  if(q.v)h+=q.i.map((t,j)=>`<div class="vf"><span>${t}</span><button data-i="${i}" data-j="${j}" data-v="1">V</button><button data-i="${i}" data-j="${j}" data-v="0">F</button></div>`).join("");
  else h+=q.o.map((t,j)=>`<button class="o" data-i="${i}" data-j="${j}">${L[j]}) ${t}</button>`).join("");
  return h+`<div class="fb" id="fb${i}"></div></div>`}).join("")+`<div class="card res" id="res"></div>`;
 st={};score();$("res").textContent="";
}
function fin(i){
 const q=Q[i],c=$("c"+i),fb=$("fb"+i);
 if(q.v){
  const r=q.i.map((_,j)=>c.querySelector(`[data-j="${j}"].done`)?.dataset.v);
  if(r.some(x=>x==null))return;
  const ok=r.every((x,j)=>+x===q.a[j]);st[i]=ok;
  fb.className="fb "+(ok?"ok":"er");
  fb.textContent=ok?"Correto!":"Gabarito: "+q.a.map(x=>x?"V":"F").join(", ");
 }
 score();
 const l=list();if(l.every(([,k])=>k in st)){const a=l.filter(([,k])=>st[k]===true).length,t=l.filter(([,k])=>st[k]!==undefined).length;$("res").textContent=`Resultado: ${a} de ${t} (${Math.round(a/t*100)}%)`}
}
$("app").onclick=e=>{
 const b=e.target.closest("button");if(!b||b.disabled)return;
 const i=+b.dataset.i,j=+b.dataset.j,q=Q[i],c=$("c"+i);
 if(q.v){
  const v=+b.dataset.v,bs=c.querySelectorAll(`[data-j="${j}"]`);
  bs.forEach(x=>{x.disabled=true});b.classList.add("done");
  const ok=v===q.a[j];bs.forEach(x=>{if(+x.dataset.v===q.a[j])x.classList.add("ok");else if(x===b)x.classList.add("er")});
  fin(i);return;
 }
 const bs=c.querySelectorAll(".o");bs.forEach(x=>x.disabled=true);
 const fb=$("fb"+i);
 if(q.a<0){b.classList.add("er");fb.textContent="O PDF não indica o gabarito desta questão.";st[i]=null;score();return}
 bs[q.a].classList.add("ok");
 const ok=j===q.a;if(!ok)b.classList.add("er");
 st[i]=ok;fb.className="fb "+(ok?"ok":"er");fb.textContent=ok?"Correto!":`Gabarito: ${L[q.a]}`;
 fin(i);
};
$("f").onchange=render;$("rs").onclick=render;render();
</script></body></html>
